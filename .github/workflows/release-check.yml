name: Weekly release package check

on:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-check:
    uses: ./.github/workflows/release.yml
    with:
      project-path: examples/input_output/cursorExample
      trussc-ref: ${{ github.sha }}
      publish: false
      sign-identity: '-'
