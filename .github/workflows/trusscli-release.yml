name: trusscli release assets

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to re-attach assets to
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}

# Intel Mac, Windows arm64 and Linux arm64 use the local-build fallback.
jobs:
  protocol:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      supported: ${{ steps.protocol.outputs.supported }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - id: protocol
        run: |
          if [ -f tools/trusscli-protocol ]; then
            echo "supported=true" >> "$GITHUB_OUTPUT"
          fi

  linux:
    needs: protocol
    if: needs.protocol.outputs.supported == 'true'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - uses: ./.github/actions/apt-deps
        timeout-minutes: 10
      - name: Build trusscli
        shell: bash
        run: |
          cmake -S tools -B tools/build
          cmake --build tools/build --config MinSizeRel --parallel
      - name: Check executable before packaging
        shell: bash
        # A tracked-file edit would bake "-dirty" into the version and trigger
        # false drift warnings in delegated builds.
        run: |
          git diff --quiet || { git status --short; echo "::error::build edited tracked files"; exit 1; }
          version="$(tools/bin/trusscli --version)"
          echo "$version"
          case "$version" in *-dirty*) echo "::error::trusscli version is dirty: $version"; exit 1;; esac
      - name: Package release asset
        shell: bash
        run: python3 -I tools/package_trusscli_release.py package --tag "$RELEASE_TAG" --os linux --arch x86_64 --bin-dir tools/bin --out assets
      - uses: actions/upload-artifact@v4
        with:
          name: trusscli-linux-x86_64
          path: assets/*.tar.gz
          if-no-files-found: error

  macos:
    needs: protocol
    if: needs.protocol.outputs.supported == 'true'
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - name: Build trusscli
        shell: bash
        # core/cmake/trussc_app.cmake and ProjectGenerator's native preset use 14.0.
        env:
          MACOSX_DEPLOYMENT_TARGET: '14.0'
        run: |
          test "$(uname -m)" = arm64
          cmake -S tools -B tools/build
          cmake --build tools/build --config MinSizeRel --parallel
      - name: Check executable before packaging
        shell: bash
        # A tracked-file edit would bake "-dirty" into the version and trigger
        # false drift warnings in delegated builds.
        run: |
          git diff --quiet || { git status --short; echo "::error::build edited tracked files"; exit 1; }
          version="$(tools/bin/trusscli.app/Contents/MacOS/trusscli --version)"
          echo "$version"
          case "$version" in *-dirty*) echo "::error::trusscli version is dirty: $version"; exit 1;; esac
      - name: Package release asset
        shell: bash
        run: python3 -I tools/package_trusscli_release.py package --tag "$RELEASE_TAG" --os macos --arch arm64 --bin-dir tools/bin --out assets
      - uses: actions/upload-artifact@v4
        with:
          name: trusscli-macos-arm64
          path: assets/*.tar.gz
          if-no-files-found: error

  windows:
    needs: protocol
    if: needs.protocol.outputs.supported == 'true'
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build trusscli
        shell: bash
        run: TC_NO_LAUNCH=1 ./tools/build_win.bat
      - name: Check executable before packaging
        shell: bash
        # A tracked-file edit would bake "-dirty" into the version and trigger
        # false drift warnings in delegated builds.
        run: |
          git diff --quiet || { git status --short; echo "::error::build edited tracked files"; exit 1; }
          version="$(tools/bin/trusscli.exe --version)"
          echo "$version"
          case "$version" in *-dirty*) echo "::error::trusscli version is dirty: $version"; exit 1;; esac
      - name: Package release asset
        shell: bash
        run: python3 -I tools/package_trusscli_release.py package --tag "$RELEASE_TAG" --os windows --arch x86_64 --bin-dir tools/bin --out assets
      - uses: actions/upload-artifact@v4
        with:
          name: trusscli-windows-x86_64
          path: assets/*.tar.gz
          if-no-files-found: error

  upload:
    needs: [protocol, linux, macos, windows]
    if: ${{ always() && needs.protocol.result == 'success' && (needs.protocol.outputs.supported != 'true' || (needs.linux.result == 'success' && needs.macos.result == 'success' && needs.windows.result == 'success')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
      # Required here too: re-publishing an older tag is a successful no-op.
      - id: protocol
        run: |
          if [ ! -f tools/trusscli-protocol ]; then
            echo "Tag has no trusscli protocol; no assets to upload."
            exit 0
          fi
          echo "supported=true" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        if: steps.protocol.outputs.supported == 'true'
        with:
          pattern: trusscli-*
          path: assets
          merge-multiple: true
      - name: Write checksums and upload
        if: steps.protocol.outputs.supported == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          python3 -I tools/package_trusscli_release.py checksums --tag "$RELEASE_TAG" --dir assets
          options=()
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            options+=(--clobber)
          fi
          gh release upload "$RELEASE_TAG" assets/* --repo "$GITHUB_REPOSITORY" "${options[@]}"
