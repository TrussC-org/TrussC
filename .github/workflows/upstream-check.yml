# Weekly upstream check (#407): asks each third-party upstream in the one
# list (docs/LICENSE.md, "Third-Party Libraries") whether something newer
# exists, with tools/check_upstream_versions.py, and comments on one tracking
# issue, "Third-party updates available", the same way daily.yml reports
# failures. It comments only when the set of entries with something newer
# changes, so the issue does not get the same comment every week. It never
# changes a version and never blocks anything: a person reads the upstream
# release notes and decides. The PR-time check that the list matches the
# build is tools/check_dependencies.py, in build.yml's header-state-check.
#
# Weekly, not part of daily.yml: upstream releases are rare, and daily.yml
# skips its run when main has not changed, which says nothing about upstream.
name: Upstream check

on:
  schedule:
    - cron: '23 0 * * 1' # Mondays 00:23 UTC = 09:23 JST
  workflow_dispatch:

concurrency:
  group: upstream-check
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  upstream:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Ask each upstream for its newest release
        run: python3 tools/check_upstream_versions.py --body upstream.md --fingerprint upstream.key

      - name: Comment on the tracking issue when the set changes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Third-party updates available"
          key=$(cat upstream.key)
          printf '\nRun: %s\n' "$RUN_URL" >> upstream.md
          existing=$(gh issue list -R "$REPO" --search "\"$title\" in:title" \
                     --state open --json number -q '.[0].number' || true)
          if [ -n "$existing" ]; then
            # The key of the last report, from the issue body or its comments.
            last=$(gh issue view "$existing" -R "$REPO" --json body,comments \
                   -q '([.body] + [.comments[].body]) | join("\n")' \
                   | grep -o '<!-- upstream-check: [0-9a-z]* -->' | tail -n 1 \
                   | sed 's/<!-- upstream-check: \(.*\) -->/\1/' || true)
            if [ "$last" = "$key" ]; then
              echo "Same set as the last report on #$existing ($key): no comment."
            else
              gh issue comment "$existing" -R "$REPO" --body-file upstream.md
            fi
          elif [ "$key" != "none" ]; then
            gh issue create -R "$REPO" --title "$title" --body-file upstream.md
          else
            echo "Nothing newer upstream and no open tracking issue."
          fi
          cat upstream.md >> "$GITHUB_STEP_SUMMARY"
