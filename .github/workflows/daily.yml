# Daily CI: the HEAVY lane. Everything the per-PR fast lane (build.yml)
# leaves out: every example (examples/ + every bundled addon example, which
# includes AllFeaturesExample) on every desktop platform + web, and the
# behavioral tests again on top of the full build. It catches example rot
# (API drift, include-order breakage, generated-build-file drift) and addon /
# third-party build breakage.
#
# Runs once a day on main, skipped when main hasn't changed since the last
# completed daily run. A failure opens (or comments on) a tracking issue with
# the commit range since the last green daily run, instead of blocking anyone.
# Being a separate workflow, it never touches the README badge (build.yml).
name: Daily

on:
  schedule:
    - cron: '0 18 * * *' # daily 18:00 UTC = 03:00 JST
  workflow_dispatch:

concurrency:
  group: daily
  cancel-in-progress: true

permissions:
  contents: read
  actions: read   # the check job reads this workflow's previous runs
  issues: write

jobs:
  # Skip the day when main is where the last completed daily run left it.
  # A manual dispatch always runs. Also finds the last GREEN run's commit for
  # the failure report's range.
  check:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.c.outputs.run }}
      last_green: ${{ steps.c.outputs.last_green }}
    steps:
      - id: c
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          # No history yet (first run, or the API can't find it): run.
          if ! runs=$(gh api "repos/$REPO/actions/workflows/daily.yml/runs?branch=main&per_page=30" \
                      -q "[.workflow_runs[] | select(.id != $RUN_ID and .status == \"completed\")]" 2>/dev/null); then
            runs='[]'
          fi
          last_done=$(echo "$runs" | jq -r '[.[] | select(.conclusion == "success" or .conclusion == "failure")][0].head_sha // ""')
          # A skipped day also concludes "success" (its jobs were skipped), so a
          # commit counts as green only if no run on it failed.
          last_green=$(echo "$runs" | jq -r '([.[] | select(.conclusion == "failure") | .head_sha]) as $red
                         | [.[] | select(.conclusion == "success" and ((.head_sha as $s | $red | index($s)) | not))][0].head_sha // ""')
          echo "last completed: ${last_done:-none}  last green: ${last_green:-none}  now: $SHA"
          echo "last_green=$last_green" >> "$GITHUB_OUTPUT"
          if [ "$EVENT" = "schedule" ] && [ "$last_done" = "$SHA" ]; then
            echo "main is unchanged since the last daily run: skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  sweep:
    needs: check
    if: needs.check.outputs.run == 'true'
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            preset: macos
            launcher: ccache
          # Same runner as build.yml (windows-latest, Ninja; see there why the
          # old windows-2022 pin was dropped). The weekly sweep this replaces
          # kept the pin after build.yml was unpinned (86c3f513), and the two
          # then shared build caches across VS versions (#223).
          - os: windows-latest
            preset: windows
            launcher: sccache
            cmake_gen: Ninja
          - os: ubuntu-latest
            preset: linux
            launcher: ccache

    runs-on: ${{ matrix.os }}

    env:
      TRUSSC_CMAKE_GENERATOR: ${{ matrix.cmake_gen }}

    steps:
      - uses: actions/checkout@v5

      # Same cache keys as build.yml, so the sweep starts warm from PR builds
      # (the build-directory cache only when the runner image matches).
      - name: Setup compiler cache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          variant: ${{ matrix.launcher }}
          key: ${{ matrix.os }}-build
          max-size: 800M

      - name: Enable compiler launcher
        shell: bash
        run: |
          echo "CMAKE_C_COMPILER_LAUNCHER=${{ matrix.launcher }}" >> "$GITHUB_ENV"
          echo "CMAKE_CXX_COMPILER_LAUNCHER=${{ matrix.launcher }}" >> "$GITHUB_ENV"
          echo "CCACHE_COMPILERCHECK=content" >> "$GITHUB_ENV"

      # The build directories' CMakeCache records absolute compiler paths (the
      # VS / MSVC toolset directory, the Xcode app), so a cache restored onto a
      # different runner image points at a compiler that isn't there and
      # configure fails ("is not a full path to an existing compiler tool",
      # #223: a windows-2022 sweep restored a windows-latest VS 18 cache
      # through the OS-only prefix). Key on the runner IMAGE: the first build
      # after an image update is cold (the compiler cache still helps), and a
      # cache never crosses images.
      - name: Runner image id (cache key)
        shell: bash
        run: echo "RUNNER_IMAGE=${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "$GITHUB_ENV"

      - name: Cache build directories
        uses: actions/cache@v5
        with:
          path: |
            core/build-${{ matrix.preset }}
            tools/build
          key: ${{ runner.os }}-${{ env.RUNNER_IMAGE }}-build-v5-${{ hashFiles('core/**/*.h', 'core/**/*.cpp', 'core/**/*.mm') }}
          restore-keys: |
            ${{ runner.os }}-${{ env.RUNNER_IMAGE }}-build-v5-

      - name: Cache sokol-shdc
        uses: actions/cache@v5
        with:
          path: core/tools/sokol-shdc
          key: sokol-shdc-v1-${{ runner.os }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          chmod +x tools/install_dependencies_linux.sh
          ./tools/install_dependencies_linux.sh -y

      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build trusscli
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "macOS" ]; then
            sed -i '' 's/read -r -p/#read -r -p/g' tools/build_mac.command
            sed -i '' 's/open /#open /g' tools/build_mac.command
            ./tools/build_mac.command
          elif [ "$RUNNER_OS" == "Linux" ]; then
            chmod +x tools/build_linux.sh
            sed -i 's/read -r -p/#read -r -p/g' tools/build_linux.sh
            sed -i 's|\"$SCRIPT_DIR/trusscli\"|#&|g' tools/build_linux.sh
            ./tools/build_linux.sh
          elif [ "$RUNNER_OS" == "Windows" ]; then
            ./tools/build_win.bat
          fi

      - name: Build every example
        shell: bash
        run: |
          chmod +x examples/build_all.py
          ./examples/build_all.py --verbose

      # The behavioral tests again, on top of the full build (cheap next to it).
      - name: Build & run addon tests
        shell: bash
        run: ./examples/build_all.py --addon-tests-only --verbose

      - name: Build & run core tests
        shell: bash
        run: ./examples/build_all.py --core-tests-only --verbose

      - name: Compiler cache stats
        if: always()
        shell: bash
        run: |
          if [ "${{ matrix.launcher }}" = "sccache" ]; then
            sccache --show-stats || true
          else
            ccache -s || true
          fi

  sweep-web:
    needs: check
    if: needs.check.outputs.run == 'true'
    timeout-minutes: 180
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup compiler cache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          variant: ccache
          key: web-build
          max-size: 800M

      - name: Enable compiler launcher
        run: |
          echo "CMAKE_C_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"
          echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"
          echo "CCACHE_COMPILERCHECK=content" >> "$GITHUB_ENV"

      - name: Cache build directories
        uses: actions/cache@v5
        with:
          path: |
            core/build-web
            tools/build
          key: web-build-v3-${{ hashFiles('core/**/*.h', 'core/**/*.cpp') }}
          restore-keys: |
            web-build-v3-

      - name: Cache sokol-shdc
        uses: actions/cache@v5
        with:
          path: core/tools/sokol-shdc
          key: sokol-shdc-v1-${{ runner.os }}

      # Same pin as build.yml — bump both together.
      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: '6.0.2'

      - name: Install Linux dependencies (for trusscli)
        run: |
          chmod +x tools/install_dependencies_linux.sh
          ./tools/install_dependencies_linux.sh -y

      - name: Build trusscli
        run: |
          chmod +x tools/build_linux.sh
          sed -i 's/read -r -p/#read -r -p/g' tools/build_linux.sh
          sed -i 's|\"$SCRIPT_DIR/trusscli\"|#&|g' tools/build_linux.sh
          ./tools/build_linux.sh

      - name: Build every example (Web)
        run: |
          chmod +x examples/build_all.py
          ./examples/build_all.py --web-only --verbose

      - name: Compiler cache stats
        if: always()
        run: ccache -s || true

  # On any failure, open an issue (or comment on the existing open one) so a
  # red daily run is impossible to miss without blocking anything. The body
  # names the commits merged since the last green daily run — with several
  # PRs a day, that range is where the breakage came from.
  report:
    needs: [check, sweep, sweep-web]
    if: always() && contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    steps:
      - name: Open or update tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SERVER: ${{ github.server_url }}
          SHA: ${{ github.sha }}
          LAST_GREEN: ${{ needs.check.outputs.last_green }}
        run: |
          title="Daily build failed"
          if [ -n "$LAST_GREEN" ]; then
            range="Commits since the last green daily run: ${SERVER}/${REPO}/compare/${LAST_GREEN}...${SHA}"
          else
            range="No earlier green daily run to compare against (commit ${SHA})."
          fi
          body=$(printf 'The daily build failed: %s\n\n%s\n' "$RUN_URL" "$range")
          existing=$(gh issue list -R "$REPO" --search "\"$title\" in:title" \
                     --state open --json number -q '.[0].number' || true)
          if [ -n "$existing" ]; then
            gh issue comment "$existing" -R "$REPO" --body "$body"
          else
            gh issue create -R "$REPO" --title "$title" --body "$body"
          fi
