["Fbo::setDebugName"]
category = "graphics_fbo"
description.en = "Set the MCP inspection name. tc_list_fbos lists live objects with index, name, width, height and format. tc_analyze_image accepts source={fbo:name or index} and reads the final Fbo pass after the frame. Moves transfer the name/index and remove the moved-from object; destruction removes the entry. Empty names remain available by index. Web readback and iOS float readback return errors. Byte Fbo readback supports RGBA8; other integer formats return an error. Texture is not a source; draw it into a named Fbo."
description.ja = "MCP 検査用の名前を設定。tc_list_fbos は生存中のオブジェクトの index、name、width、height、format を一覧化。tc_analyze_image は source={fbo:名前またはインデックス} を受け、フレーム終了後に最後の Fbo パスを読む。移動で名前とインデックスを引き継ぎ、移動元と破棄済みの項目は消える。空の名前もインデックスで取得可能。Web の読み戻しと iOS の float 読み戻しはエラー。byte Fbo の読み戻しは既存 API の RGBA8 のみ対応し、他の整数形式はエラー。Texture はソースにできないため、名前付き Fbo に描画する。"
description.ko = "MCP 검사 이름을 설정. tc_list_fbos 는 살아 있는 객체의 index, name, width, height, format 을 나열. tc_analyze_image 는 source={fbo:이름 또는 인덱스} 로 프레임 종료 후 마지막 Fbo 패스를 읽는다. 이동하면 이름과 인덱스가 이전되고 이동 원본 및 파괴된 항목은 사라진다. 빈 이름도 인덱스로 접근 가능. Web 읽기 및 iOS float 읽기는 오류. byte Fbo 읽기는 기존 API 의 RGBA8 만 지원하며 다른 정수 형식은 오류. Texture 는 소스가 아니므로 이름 있는 Fbo 에 그린다."
related = ["Fbo::getDebugName", "Image::setDebugName"]

["Fbo::getDebugName"]
category = "graphics_fbo"
description.en = "Return the MCP inspection name (empty for unnamed or moved-from objects)."
description.ja = "MCP 検査用の名前を返す（名前なし、または移動元は空文字列）。"
description.ko = "MCP 검사 이름을 반환 (이름이 없거나 이동된 원본이면 빈 문자열)."
related = ["Fbo::setDebugName"]

["Image::setDebugName"]
description.en = "Set the MCP inspection name. tc_list_images lists live Images with index, name, width, height and format; moves transfer name/index and remove moved-from entries, destruction removes entries, unnamed Images remain available by index. tc_analyze_image reads CPU pixels with source={image:name or index}; other sources are window:index, fbo:name or index, path:file. Returns width, height, format (RGBA8/float), colorSpace (sRGB/linear), and results in ops order; byte colors are normalized RGBA, float values above 1 pass through. Ops: pixel(x,y):color; histogram(bins):histogram[channel][bin] over 0-1 (outliers in end bins); count(color,tolerance or min,max):count,bbox,centroid; stats():mean,min,max; grid(cols,rows):mean colors[row][col]; diff(path,threshold,optional save):count,bbox,maxDifference; line(x0,y0,x1,y1):colors along inclusive Bresenham samples. Every op accepts optional rect=[x,y,w,h], default whole image. Coordinates are top-left, bbox=[x,y,w,h], centroid=[x,y]; empty matches yield null bbox/centroid. Rects and grid cells must be nonempty; line endpoints are in the image and samples clip to rect. Count accepts RGB/RGBA bounds or color plus a nonnegative scalar tolerance. Diff compares raw RGBA values with equal image dimensions and counts maximum absolute channel differences strictly above threshold. Optional top-level save (omitted/null writes nothing) and diff.save use tc_save_screenshot paths: UTF-8, data-directory-relative, create parents, unsupported extensions append .png. Float file output is clamped to 0-1; analysis preserves float values. Texture, VideoPlayer and VideoGrabber are not sources."
description.ja = "MCP 検査用の名前を設定。tc_list_images は生存中の Image の index、name、width、height、format を一覧化。移動で名前とインデックスを引き継ぎ、移動元と破棄済みの項目は消える。名前なしもインデックスで取得可能。tc_analyze_image は source={image:名前またはインデックス} で CPU ピクセルを読む。他のソースは window:インデックス、fbo:名前またはインデックス、path:ファイル。width、height、format（RGBA8/float）、colorSpace（sRGB/linear）、ops 順の results を返す。byte は RGBA 0–1、float は 1 を超える値も保持。操作: pixel(x,y):color、histogram(bins):histogram[channel][bin]（0–1 の等幅区間、範囲外は端の bin）、count(color,tolerance または min,max):count,bbox,centroid、stats():mean,min,max、grid(cols,rows):平均 colors[row][col]、diff(path,threshold,任意の save):count,bbox,maxDifference、line(x0,y0,x1,y1):両端を含む Bresenham 線上の colors。各操作に任意の rect=[x,y,w,h]（既定は画像全体）。座標は左上原点、bbox=[x,y,w,h]、centroid=[x,y]、一致なしは bbox/centroid が null。rect とセルは空にできない。線の両端は画像内、rect 内のサンプルだけを返す。count は RGB/RGBA の範囲または色と非負のスカラー tolerance。diff は同寸法の RGBA 生値を比較し、最大絶対チャネル差が threshold を超えたピクセルを数える。任意のトップレベル save（省略/null は保存なし）と diff.save は tc_save_screenshot と同じ UTF-8・data 相対パス・親作成・未対応拡張子に .png 追加の規則。float の保存は 0–1 に制限するが解析値は保持。Texture、VideoPlayer、VideoGrabber はソースではない。"
description.ko = "MCP 검사 이름을 설정. tc_list_images 는 살아 있는 Image 의 index, name, width, height, format 을 나열. 이동하면 이름과 인덱스가 이전되며 이동 원본 및 파괴된 항목은 사라진다. 이름 없는 객체도 인덱스로 접근 가능. tc_analyze_image 는 source={image:이름 또는 인덱스} 로 CPU 픽셀을 읽는다. 다른 소스는 window:인덱스, fbo:이름 또는 인덱스, path:파일. width, height, format (RGBA8/float), colorSpace (sRGB/linear), ops 순서의 results 를 반환. byte 색은 RGBA 0–1, float 는 1 초과 값도 유지. 연산: pixel(x,y):color; histogram(bins):histogram[channel][bin] (0–1 등간격, 범위 밖은 끝 bin); count(color,tolerance 또는 min,max):count,bbox,centroid; stats():mean,min,max; grid(cols,rows):평균 colors[row][col]; diff(path,threshold,선택 save):count,bbox,maxDifference; line(x0,y0,x1,y1):양 끝점을 포함한 Bresenham 색 배열. 모든 연산에 선택 rect=[x,y,w,h], 기본값은 전체 이미지. 좌표는 왼쪽 위 원점, bbox=[x,y,w,h], centroid=[x,y]; 일치 없으면 bbox/centroid 는 null. rect 와 셀은 비어 있을 수 없다. 선 끝점은 이미지 내부, rect 내부 샘플만 반환. count 는 RGB/RGBA 범위 또는 색과 음이 아닌 스칼라 tolerance. diff 는 동일 크기 RGBA 원시 값을 비교하며 최대 절대 채널 차이가 threshold 보다 큰 픽셀을 센다. 선택 최상위 save (생략/null 은 저장 안 함) 와 diff.save 는 tc_save_screenshot 의 UTF-8, data 상대 경로, 부모 생성, 미지원 확장자에 .png 추가 규칙을 따른다. float 저장은 0–1 로 제한하지만 분석 값은 유지. Texture, VideoPlayer, VideoGrabber 는 소스가 아니다."
related = ["Image::getDebugName", "Fbo::setDebugName"]

