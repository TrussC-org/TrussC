["SoundBuffer::getPath"]
description.en = "File the samples were decoded from (for AAC, when loaded through load()); empty for memory, PCM and generated buffers."
description.ja = "サンプルをデコードした元のファイル (AAC は load() で読んだとき)。メモリ・PCM・生成したバッファでは空"
description.ko = "샘플을 디코딩한 원본 파일 (AAC 는 load() 로 읽었을 때). 메모리·PCM·생성한 버퍼에서는 비어 있음"

["SoundBuffer::load"]
description.en = "Decode a file into PCM, auto-detecting format from the extension (.wav .mp3 .ogg .flac .aac .m4a, case-insensitive). Returns false on failure."
description.ja = "拡張子から形式を自動判別してファイルをPCMにデコード(.wav .mp3 .ogg .flac .aac .m4a、大文字小文字を区別しない)。失敗時falseを返す"
description.ko = "확장자로 형식을 자동 판별해 파일을 PCM으로 디코딩(.wav .mp3 .ogg .flac .aac .m4a, 대소문자 무시). 실패 시 false 반환"

["SoundBuffer::loadAac"]
description.en = "Decode an AAC / M4A file into PCM (platform-specific; returns false on unsupported platforms)."
description.ja = "AAC / M4AファイルをPCMにデコード(プラットフォーム依存。非対応プラットフォームではfalseを返す)"
description.ko = "AAC / M4A 파일을 PCM으로 디코딩(플랫폼 의존. 미지원 플랫폼에서는 false 반환)"
platform_note.en = "AAC/M4A decoding (reached via Sound::load() on .aac/.m4a, or SoundBuffer::loadAac). macOS/iOS use AVFoundation (AVAssetReader), Windows uses Media Foundation, Linux uses GStreamer, wasm uses Web Audio decodeAudioData (deferred until play(), placeholder samples until then). STUBBED on Android: logs 'AAC loading not yet implemented' and returns false (TODO MediaCodec). All other audio formats (WAV/MP3/FLAC via miniaudio, OGG via stb_vorbis) work on all 6 platforms."
platform_note.ja = "AAC/M4A デコード (.aac/.m4a を Sound::load()、または SoundBuffer::loadAac で到達)。macOS/iOS は AVFoundation (AVAssetReader)、Windows は Media Foundation、Linux は GStreamer、wasm は Web Audio decodeAudioData (play() まで遅延、それまではプレースホルダ)。Android のみスタブで 'AAC loading not yet implemented' を出して false を返す (TODO MediaCodec)。他フォーマット (WAV/MP3/FLAC=miniaudio、OGG=stb_vorbis) は全6プラットフォームで動作。"

["SoundBuffer::loadAacFromMemory"]
description.en = "Decode AAC data from a memory buffer (platform-specific; returns false on unsupported platforms)."
description.ja = "メモリバッファからAACデータをデコード(プラットフォーム依存。非対応プラットフォームではfalseを返す)"
description.ko = "메모리 버퍼에서 AAC 데이터를 디코딩(플랫폼 의존. 미지원 플랫폼에서는 false 반환)"
platform_note.en = "Memory-based AAC decode. Real impls on macOS/iOS (AVFoundation), Windows (Media Foundation), Linux (GStreamer). STUBBED on Android (returns false) and on wasm (logs 'loadAacFromMemory() not yet implemented for Web (use file path instead)' and returns false). Not documented in api-definition.yaml."
platform_note.ja = "メモリからの AAC デコード。macOS/iOS (AVFoundation)、Windows (Media Foundation)、Linux (GStreamer) は実装あり。Android はスタブで false、wasm も 'loadAacFromMemory() not yet implemented for Web' を出して false。api-definition.yaml には未記載。"

