["TweenMod::ease"]
category = "scene_graph"
keywords = ["easing", "interpolation", "tween", "smooth", "curve", "custom", "lambda"]
description.en = "Set easing (TweenMod method): a built-in EaseType + EaseMode, or a custom EaseFunction (C++ only)"
description.ja = "イージングを設定（TweenModメソッド）：組み込み EaseType + EaseMode、またはカスタム EaseFunction（C++のみ）"
description.ko = "easing 설정 (TweenMod 메서드): 내장 EaseType + EaseMode, 또는 커스텀 EaseFunction (C++ 전용)"
details.en = '''
`ease(EaseType, EaseMode = InOut)` picks a built-in curve (Linear, Quad,
Cubic, Quart, Quint, Sine, Expo, Circ, Back, Elastic, Bounce).
`ease(EaseFunction fn, EaseMode = In)` supplies a custom curve with the same
semantics as [`Tween::ease`](#Tween::ease): mode `In` applies the function as
authored, the function may capture live-editable state, values outside 0..1
overshoot, and a null function falls back to Linear.
'''
details.ja = '''
`ease(EaseType, EaseMode = InOut)` は組み込みカーブ（Linear, Quad, Cubic,
Quart, Quint, Sine, Expo, Circ, Back, Elastic, Bounce）を指定。
`ease(EaseFunction fn, EaseMode = In)` はカスタムカーブを渡す。セマンティクスは
[`Tween::ease`](#Tween::ease) と同じ：`In` は書いたまま適用、関数はライブ編集
可能な状態をキャプチャでき、0..1 範囲外はオーバーシュート、null はリニアに
フォールバック。
'''
details.ko = '''
`ease(EaseType, EaseMode = InOut)`는 내장 커브(Linear, Quad, Cubic, Quart,
Quint, Sine, Expo, Circ, Back, Elastic, Bounce)를 지정.
`ease(EaseFunction fn, EaseMode = In)`은 커스텀 커브를 전달하며 의미는
[`Tween::ease`](#Tween::ease)와 동일: `In`은 작성한 그대로 적용, 함수는 라이브
편집 가능한 상태를 캡처할 수 있고, 0..1 범위 밖은 오버슈트, null은 Linear로
폴백.
'''
related = ["EaseFunction", "EaseType", "EaseMode", "Tween::ease", "TweenMod"]

