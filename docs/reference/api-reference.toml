["Logger"]
keywords = ["log", "logging", "console", "log level", "os_log", "logcat", "OutputDebugString", "system log"]
description.en = "Logging core with console, file and system (OS log) output, each with its own level, and an onLog event; access the global instance via getLogger()"
description.ja = "コンソール・ファイル・システム（OS ログ）出力（それぞれ独自のレベル）と onLog イベントを備えたロギングコア。グローバルインスタンスは getLogger() でアクセス"
description.ko = "콘솔·파일·시스템(OS 로그) 출력(각각 고유 레벨)과 onLog 이벤트를 갖춘 로깅 코어. 전역 인스턴스는 getLogger() 로 접근"
details.en = '''
Every line goes to three outputs, each filtered by its own level. An output shows a line when the line's level is at or above the output's level; `LogLevel::Silent` turns that output off.

| Output | Where it goes | Level (default) |
|---|---|---|
| console | stdout (Verbose / Notice) and stderr (Warning and up) on macOS, Windows, Linux and web; `os_log` on iOS; logcat on Android | `setConsoleLogLevel()` (Notice) |
| file | the file opened with `setLogFile()` (or `TRUSSC_LOG_FILE`); none until one is opened | `setFileLogLevel()` (Notice) |
| system | `os_log` on macOS; `OutputDebugStringW` on Windows; none on iOS, Android, Linux and web | `setSystemLogLevel()` (Notice) |

`setLogLevel()` sets all three at once; it overwrites them when called, and a later per-output call wins. On iOS and Android the OS log is the console output, so `setConsoleLogLevel()` controls it and the system level has no effect.

```cpp
setLogLevel(LogLevel::Warning);       // console, file and system output: all Warning
setFileLogLevel(LogLevel::Verbose);   // then only the file goes down to Verbose
setSystemLogLevel(LogLevel::Silent);  // no OS log (os_log / OutputDebugString)
```

`onLog` listeners receive every line, whatever the levels.

The OS log: Apple's unified log uses subsystem `org.trussc`, category `TrussC`, and is visible in Console.app; on macOS it is skipped while the app runs from Xcode, whose console already shows stdout. Windows' debug output shows in the Visual Studio output window and DebugView (DebugView reads the bytes in the system's ANSI code page, so non-ASCII text shows garbled there); each call has a fixed cost, more with a debugger or DebugView attached.

Thread-safe: `log()` and the settings may be called from any thread. The outputs are written under one mutex, so every line lands whole, and `closeFile()` / `setLogFile()` wait for a write in progress. Other `onLog` listeners run on the thread that logged, outside that mutex, so a listener may log too. One exception: `setLogFile()` with a relative path resolves it through `getDataPath()`, which reads the data path state without a lock, so it must not race `setDataPathRoot()` or the first `getDataPath()` call; an absolute path does not touch that state. sokol's own messages (`[sg]`, `[sapp]`, `[sgl]`, `[simgui]`) come through here as well; its info messages are Verbose.
'''
details.ja = '''
各行は 3 つの出力に送られ、出力ごとに自分のレベルで絞り込まれる。行のレベルが出力のレベル以上なら、その出力に出る。`LogLevel::Silent` にした出力は止まる。

| 出力 | 出力先 | レベル（既定） |
|---|---|---|
| コンソール | macOS・Windows・Linux・web では stdout（Verbose / Notice）と stderr（Warning 以上）。iOS は `os_log`、Android は logcat | `setConsoleLogLevel()`（Notice） |
| ファイル | `setLogFile()`（または `TRUSSC_LOG_FILE`）で開いたファイル。開くまでは無し | `setFileLogLevel()`（Notice） |
| システム | macOS は `os_log`、Windows は `OutputDebugStringW`。iOS・Android・Linux・web には無い | `setSystemLogLevel()`（Notice） |

`setLogLevel()` は 3 つを一度に設定する。呼んだ時点で上書きし、その後の出力ごとの呼び出しが優先される。iOS と Android では OS ログがコンソール出力なので `setConsoleLogLevel()` で制御し、システムレベルは効かない。

```cpp
setLogLevel(LogLevel::Warning);       // console, file and system output: all Warning
setFileLogLevel(LogLevel::Verbose);   // then only the file goes down to Verbose
setSystemLogLevel(LogLevel::Silent);  // no OS log (os_log / OutputDebugString)
```

`onLog` リスナーはレベルに関係なく全行を受け取る。

OS ログについて：Apple の統合ログはサブシステム `org.trussc`、カテゴリ `TrussC` で、Console.app で見られる。macOS では Xcode から起動している間は書かない（Xcode のコンソールが stdout を既に表示するため）。Windows のデバッグ出力は Visual Studio の出力ウィンドウと DebugView に出る（DebugView はシステムの ANSI コードページでバイト列を読むため、非 ASCII の文字は化ける）。1 回の呼び出しごとに固定のコストがあり、デバッガや DebugView が接続中はさらに増える。

スレッドセーフ：`log()` と各設定はどのスレッドからも呼べる。出力は 1 つのミューテックスの下で書かれるので各行は欠けずに出て、`closeFile()` / `setLogFile()` は書き込み中の行を待つ。その他の `onLog` リスナーはログを出したスレッドで、そのミューテックスの外で動くので、リスナー内でもログを出せる。例外が 1 つ：相対パスの `setLogFile()` は `getDataPath()` で解決し、これはデータパスの状態をロックなしで読むため、`setDataPathRoot()` や最初の `getDataPath()` 呼び出しと競合させてはいけない（絶対パスならその状態に触れない）。sokol 自身のメッセージ（`[sg]`、`[sapp]`、`[sgl]`、`[simgui]`）もここを通り、info メッセージは Verbose になる。
'''
details.ko = '''
각 줄은 세 출력으로 가고, 출력마다 자신의 레벨로 걸러진다. 줄의 레벨이 출력의 레벨 이상이면 그 출력에 나온다. `LogLevel::Silent`로 한 출력은 꺼진다.

| 출력 | 출력 대상 | 레벨(기본값) |
|---|---|---|
| 콘솔 | macOS·Windows·Linux·web에서는 stdout(Verbose / Notice)과 stderr(Warning 이상). iOS는 `os_log`, Android는 logcat | `setConsoleLogLevel()` (Notice) |
| 파일 | `setLogFile()`(또는 `TRUSSC_LOG_FILE`)로 연 파일. 열기 전에는 없음 | `setFileLogLevel()` (Notice) |
| 시스템 | macOS는 `os_log`, Windows는 `OutputDebugStringW`. iOS·Android·Linux·web에는 없음 | `setSystemLogLevel()` (Notice) |

`setLogLevel()`은 셋을 한 번에 설정한다. 호출 시점에 덮어쓰고, 그 뒤의 출력별 호출이 우선한다. iOS와 Android에서는 OS 로그가 콘솔 출력이므로 `setConsoleLogLevel()`로 제어하며 시스템 레벨은 효과가 없다.

```cpp
setLogLevel(LogLevel::Warning);       // console, file and system output: all Warning
setFileLogLevel(LogLevel::Verbose);   // then only the file goes down to Verbose
setSystemLogLevel(LogLevel::Silent);  // no OS log (os_log / OutputDebugString)
```

`onLog` 리스너는 레벨과 상관없이 모든 줄을 받는다.

OS 로그: Apple의 통합 로그는 서브시스템 `org.trussc`, 카테고리 `TrussC`이며 Console.app에서 볼 수 있다. macOS에서는 Xcode에서 실행하는 동안 쓰지 않는다(Xcode 콘솔이 이미 stdout을 보여 주므로). Windows의 디버그 출력은 Visual Studio 출력 창과 DebugView에 나온다(DebugView는 시스템 ANSI 코드 페이지로 바이트를 읽으므로 비 ASCII 문자는 깨져 보인다). 호출마다 고정 비용이 있고, 디버거나 DebugView가 연결되어 있으면 더 크다.

스레드 안전: `log()`와 설정은 어느 스레드에서나 호출할 수 있다. 출력은 하나의 뮤텍스 아래에서 쓰이므로 각 줄은 온전히 기록되고, `closeFile()` / `setLogFile()`은 진행 중인 쓰기를 기다린다. 그 밖의 `onLog` 리스너는 로그를 낸 스레드에서 그 뮤텍스 밖에서 실행되므로 리스너 안에서도 로그를 낼 수 있다. 예외 하나: 상대 경로의 `setLogFile()`은 `getDataPath()`로 해석하는데, 이는 데이터 경로 상태를 잠금 없이 읽으므로 `setDataPathRoot()`나 첫 `getDataPath()` 호출과 경합하면 안 된다(절대 경로는 그 상태를 건드리지 않음). sokol 자체 메시지(`[sg]`, `[sapp]`, `[sgl]`, `[simgui]`)도 여기를 거치며, info 메시지는 Verbose가 된다.
'''
