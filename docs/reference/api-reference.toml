["Light::setShadowSoftness"]
description.en = "Set shadow softness as the light's emitter size in world units (0 = hard, default); drives PCSS penumbra"
description.ja = "shadowの柔らかさをlightのemitterサイズ（world単位）で設定（0=硬い、デフォルト）。PCSSの半影を制御"
description.ko = "섀도우 부드러움을 조명 이미터 크기(월드 단위)로 설정 (0=단단함, 기본값); PCSS 반영을 제어"
related = ["Light::setShadowSamples", "Light::setShadowArea", "beginShadowPass"]
details.en = '''
Drives PCSS (percentage-closer soft shadows): a bigger emitter widens the
penumbra, which also contact-hardens automatically — sharp where the caster
touches the receiver, blurrier the farther the two are apart. `0` (default)
means a point emitter, giving hard edges and the zero-cost hard-shadow path.
The unit depends on light type: for Spot lights `size` is the emitter diameter
in world units; for Directional lights the emitter is at infinity, so `size` is
how many world units the penumbra widens per 100 units of caster-receiver
distance (the sun ≈ 0.9). The tap count from
[`setShadowSamples`](#Light::setShadowSamples) only applies when `size > 0`.
'''
details.ja = '''
PCSS（percentage-closer soft shadows）を駆動する。emitterが大きいほど半影が広がり、
接触硬化も自動で効く（casterがreceiverに接する所は鋭く、離れるほどぼける）。`0`
（デフォルト）は点emitterで、硬いエッジとゼロコストのハードシャドウ経路になる。
単位はlight typeで変わる。Spot lightでは `size` はemitterの直径（world単位）。
Directional lightではemitterが無限遠にあるため、`size` は「caster-receiver間の距離
100単位あたり半影が広がるworld単位」を表す（太陽 ≈ 0.9）。`size > 0` のときだけ
[`setShadowSamples`](#Light::setShadowSamples) のタップ数が効く。
'''
details.ko = '''
PCSS(percentage-closer soft shadows)를 구동한다. 이미터가 클수록 반영이 넓어지며,
접촉 경화도 자동으로 적용된다(캐스터가 리시버에 닿는 곳은 날카롭고 멀어질수록 흐려진다).
`0`(기본값)은 점 이미터로, 단단한 가장자리와 무비용 하드 섀도우 경로가 된다.
단위는 조명 유형에 따라 다르다. 스포트 라이트에서는 `size`가 이미터 지름(월드 단위)이다.
디렉셔널 라이트에서는 이미터가 무한대에 있으므로, `size`는 캐스터-리시버 거리 100단위당
반영이 넓어지는 월드 단위를 뜻한다(태양 ≈ 0.9).
[`setShadowSamples`](#Light::setShadowSamples)의 탭 수는 `size > 0`일 때만 적용된다.
'''

