["Mesh::drawGpuPbr"]
category = "types_mesh"
keywords = ["gpu", "pbr", "retained", "vbo", "lighting"]
description.en = "Draw the mesh through the GPU PBR pipeline (retained GPU buffer + active lights, material and environment)."
description.ja = "GPU PBRパイプラインでメッシュを描画（GPU常駐バッファ＋アクティブなライト・マテリアル・環境を使用）。"
description.ko = "GPU PBR 파이프라인으로 메시를 그림(GPU 상주 버퍼 + 활성 light·material·환경 사용)."
related = ["Mesh::draw", "Mesh::uploadToGpu", "Mesh::getGpuVertexBuffer", "Material", "Light"]
details.en = '''
The retained-buffer path [`draw()`](#Mesh::draw) dispatches to when the mesh has
normals and a [`Material`](#Material) is active. The vertex data is uploaded to a
GPU buffer once (see [`uploadToGpu`](#Mesh::uploadToGpu)) and re-used every frame,
and Cook–Torrance PBR is evaluated per pixel from the active lights, material and
[`Environment`](#Environment). You normally just call `draw()` — call this
directly only to force the PBR path. The draw is deferred into the per-layer
flush, so it composites with 2D in submission order and shares the depth buffer.
'''
details.ja = '''
メッシュが法線を持ち [`Material`](#Material) がアクティブなとき
[`draw()`](#Mesh::draw) が振り分ける GPU常駐パス。頂点データは一度 GPU バッファに
アップロードされ（[`uploadToGpu`](#Mesh::uploadToGpu) 参照）毎フレーム再利用され、
アクティブなライト・マテリアル・[`Environment`](#Environment) から Cook–Torrance
PBR をピクセル単位で評価する。通常は `draw()` を呼べばよく、直接呼ぶのは PBR
パスを強制したいときだけ。描画は per-layer flush に遅延され、2D と投入順で合成し
深度バッファを共有する。
'''
details.ko = '''
메시가 법선을 갖고 [`Material`](#Material)이 활성일 때 [`draw()`](#Mesh::draw)가
분기하는 GPU 상주 경로다. 정점 데이터는 한 번 GPU 버퍼에 업로드되어
([`uploadToGpu`](#Mesh::uploadToGpu) 참고) 매 프레임 재사용되고, 활성
light·material·[`Environment`](#Environment)로부터 Cook–Torrance PBR을 픽셀
단위로 평가한다. 보통은 `draw()`만 호출하면 되고, 이 함수를 직접 호출하는 것은
PBR 경로를 강제할 때뿐이다. 그리기는 per-layer flush로 지연되어 2D와 제출
순서로 합성되고 깊이 버퍼를 공유한다.
'''

["Mesh::drawGpuPoints"]
category = "types_mesh"
keywords = ["gpu", "point cloud", "points", "retained", "vbo", "splat"]
description.en = "Draw a Points-mode mesh as a GPU-resident point cloud (Square/Round splats or 1px Pixel points)."
description.ja = "Points モードのメッシュを GPU常駐の点群として描画（Square/Round スプラット、または 1px の Pixel 点）。"
description.ko = "Points 모드 메시를 GPU 상주 포인트 클라우드로 그림(Square/Round 스플랫 또는 1px Pixel 포인트)."
related = ["Mesh::draw", "setPointStyle", "setPointSize", "PointStyle", "Mesh::uploadPointsToGpu", "Mesh::getGpuPointBuffer"]
details.en = '''
The retained-buffer path [`draw()`](#Mesh::draw) dispatches to when the mesh's
mode is [`PrimitiveMode`](#PrimitiveMode)`::Points`. Positions and per-vertex
colors are uploaded to a GPU buffer once (see
[`uploadPointsToGpu`](#Mesh::uploadPointsToGpu)) and drawn in a single call every
frame, so a multi-million-point cloud is nearly free on the CPU. The shape
follows the current [`setPointStyle`](#setPointStyle): `Square` / `Round` are
instanced billboard splats sized by [`setPointSize`](#setPointSize) (`Round` is
anti-aliased), `Pixel` is a true 1px point primitive. You normally just call
`draw()` — this is its dispatch target. Deferred into the per-layer flush, so the
points share the depth buffer and composite with 2D in submission order.
'''
details.ja = '''
メッシュのモードが [`PrimitiveMode`](#PrimitiveMode)`::Points` のとき
[`draw()`](#Mesh::draw) が振り分ける GPU常駐パス。位置と頂点ごとの色は一度 GPU
バッファにアップロードされ（[`uploadPointsToGpu`](#Mesh::uploadPointsToGpu) 参照）
毎フレーム 1 回のドローで描かれるので、数百万点の点群でも CPU 負荷はほぼゼロ。
形は現在の [`setPointStyle`](#setPointStyle) に従う。`Square` / `Round` は
[`setPointSize`](#setPointSize) でサイズ指定するインスタンス化ビルボード
スプラット（`Round` はアンチエイリアス）、`Pixel` は本物の 1px 点プリミティブ。
通常は `draw()` を呼べばよく、これはその振り分け先。per-layer flush に遅延され、
点群は深度バッファを共有し 2D と投入順で合成される。
'''
details.ko = '''
메시의 모드가 [`PrimitiveMode`](#PrimitiveMode)`::Points`일 때
[`draw()`](#Mesh::draw)가 분기하는 GPU 상주 경로다. 위치와 정점별 색상은 한 번
GPU 버퍼에 업로드되어([`uploadPointsToGpu`](#Mesh::uploadPointsToGpu) 참고) 매
프레임 한 번의 드로우로 그려지므로, 수백만 점 규모의 포인트 클라우드도 CPU
부하가 거의 없다. 모양은 현재 [`setPointStyle`](#setPointStyle)을 따른다.
`Square` / `Round`는 [`setPointSize`](#setPointSize)로 크기를 정하는 인스턴스
빌보드 스플랫이고(`Round`는 안티앨리어싱), `Pixel`은 진짜 1px 포인트
프리미티브다. 보통은 `draw()`만 호출하면 되며 이 함수는 그 분기 대상이다.
per-layer flush로 지연되어 포인트는 깊이 버퍼를 공유하고 2D와 제출 순서로
합성된다.
'''

