["Tween::ease"]
category = "animation"
keywords = ["easing", "interpolation", "tween", "smooth", "curve", "custom", "lambda"]
description.en = "Set the easing curve: a built-in EaseType, an asymmetric in/out pair, or a custom EaseFunction"
description.ja = "イージングカーブを設定：組み込み EaseType、非対称 in/out ペア、またはカスタム EaseFunction"
description.ko = "이징 커브 설정: 내장 EaseType, 비대칭 in/out 쌍, 또는 커스텀 EaseFunction"
details.en = '''
Three overloads:

- `ease(EaseType, EaseMode = InOut)` — one of the built-in curve families.
- `ease(EaseType inType, EaseType outType)` — asymmetric: one curve for the
  accelerating half, another for the decelerating half (e.g. leave with
  `Cubic`, land with `Bounce`).
- `ease(EaseFunction fn, EaseMode = In)` — a custom curve. The default mode
  `In` applies the function exactly as authored (an editor-drawn or fully
  hand-designed 0..1 curve is used verbatim). Pass `Out` / `InOut` when `fn`
  is an ease-in base curve and you want the standard reflected variants
  derived from it.

The custom function may capture state: a lambda closing over a live-edited
curve object is evaluated every frame, so edits retarget the motion instantly
without calling `ease()` again. Capture by reference (or `shared_ptr`) for
live behavior; capturing by value snapshots the curve instead. Return values
outside 0..1 create overshoot. Setting a custom function switches
`getEaseType()` to `EaseType::Custom`; selecting `EaseType::Custom` without a
function falls back to Linear. See `customEaseExample` for a freehand editor,
a tone-curve point editor, and a plain code-defined lambda.
'''
details.ja = '''
オーバーロードは3つ：

- `ease(EaseType, EaseMode = InOut)` — 組み込みカーブファミリを指定。
- `ease(EaseType inType, EaseType outType)` — 非対称。加速側と減速側で別の
  カーブを使う（例：`Cubic` で飛び出して `Bounce` で着地）。
- `ease(EaseFunction fn, EaseMode = In)` — カスタムカーブ。デフォルトの `In`
  は関数を書いたまま適用する（エディタで描いた 0..1 全体のカーブはそのまま
  使われる）。`fn` を ease-in 基準カーブとして書き、標準の変換で Out/InOut を
  導出したいときは `Out` / `InOut` を渡す。

カスタム関数は状態をキャプチャできる。ライブ編集中のカーブオブジェクトを
閉じ込めたラムダは毎フレーム評価されるため、カーブを編集した瞬間に動きが
変わる — `ease()` を呼び直す必要はない。ライブ挙動には参照（または
`shared_ptr`）キャプチャを使うこと。値キャプチャは渡した時点のスナップ
ショットになる。0..1 の範囲外の戻り値はオーバーシュートになる。カスタム関数を
設定すると `getEaseType()` は `EaseType::Custom` を返す。関数を設定せず
`EaseType::Custom` を選んだ場合はリニアにフォールバック。フリーハンド
エディタ・トーンカーブ点エディタ・コード定義ラムダの3方式は
`customEaseExample` を参照。
'''
details.ko = '''
오버로드는 3가지:

- `ease(EaseType, EaseMode = InOut)` — 내장 커브 계열 지정.
- `ease(EaseType inType, EaseType outType)` — 비대칭. 가속 구간과 감속 구간에
  다른 커브를 사용 (예: `Cubic`으로 출발, `Bounce`로 착지).
- `ease(EaseFunction fn, EaseMode = In)` — 커스텀 커브. 기본값 `In`은 함수를
  작성한 그대로 적용한다 (에디터로 그린 0..1 전체 커브는 그대로 사용).
  `fn`을 ease-in 기준 커브로 작성하고 표준 변환으로 Out/InOut을 도출하려면
  `Out` / `InOut`을 전달.

커스텀 함수는 상태를 캡처할 수 있다. 라이브 편집 중인 곡선 객체를 담은
람다는 매 프레임 평가되므로 곡선을 편집하는 즉시 움직임이 바뀐다 —
`ease()`를 다시 호출할 필요가 없다. 라이브 동작에는 참조(또는 `shared_ptr`)
캡처를 사용할 것. 값 캡처는 전달 시점의 스냅샷이 된다. 0..1 범위 밖 반환값은
오버슈트가 된다. 커스텀 함수를 설정하면 `getEaseType()`은 `EaseType::Custom`을
반환하며, 함수 없이 `EaseType::Custom`만 선택하면 Linear로 폴백.
`customEaseExample` 참조.
'''
