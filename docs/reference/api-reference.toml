["setFps"]
category = "graphics_shapes"
keywords = ["frame rate", "framerate", "vsync", "speed", "ofsetframerate"]
of = ["ofSetFrameRate"]
description.en = "Set the target frame rate; update and draw run together (VSYNC = -1, EVENT_DRIVEN = 0, or a fixed fps). A fixed fps at or just above the display rate draws every display frame. Switching at runtime starts the new rate from the switch (no catch-up; a fixed fps draws the next frame, and the first update's getDeltaTime() leaves out the previous mode: called between updates it counts from the call, called inside an update from that update's start; the time dropped is under a frame in the usual modes, long only after an idle like EVENT_DRIVEN). Calling it again with the current rate does nothing, so it is safe to call every frame; on the frame where the value changes (setFps(guiValue) in draw() while a slider moves), that update's dt counts only from the call and is shorter than the frame"
description.ja = "ターゲットフレームレートを設定し、update と draw を同期して回す（VSYNC = -1、EVENT_DRIVEN = 0、または固定fps）。ディスプレイのリフレッシュレートと同じか少し上の固定fpsは毎フレーム描画する。実行中の切り替えは切り替えた時点から新しいレートで始まる（取り戻しはせず、固定fpsなら次のフレームを描画し、最初の update の getDeltaTime() には前のモードの時間が入らない。update の外で呼べば呼び出しから、update の中で呼べばその update の開始から数える。捨てる時間は普段のモードなら1フレーム未満で、長くなるのは EVENT_DRIVEN のアイドルのあとだけ）。今と同じレートで呼んでも何もしないので、毎フレーム呼んでもよい。ただし値が変わったフレーム（スライダー操作中に draw() で setFps(guiValue) するなど）では、その update の dt は呼び出しからの時間になり、1フレームより短くなる"
description.ko = "목표 프레임레이트를 설정하고 update와 draw를 동기로 돌린다(VSYNC = -1, EVENT_DRIVEN = 0, 또는 고정 fps). 디스플레이 리프레시레이트와 같거나 약간 높은 고정 fps는 매 프레임 그린다. 실행 중 전환은 전환 시점부터 새 레이트로 시작한다(따라잡기 없이, 고정 fps라면 다음 프레임을 그리고, 첫 update의 getDeltaTime()에는 이전 모드의 시간이 들어가지 않는다. update 밖에서 호출하면 호출 시점부터, update 안에서 호출하면 그 update의 시작부터 센다. 버려지는 시간은 평소 모드라면 1프레임 미만이며, 길어지는 것은 EVENT_DRIVEN 대기 뒤뿐이다). 현재와 같은 레이트로 호출하면 아무것도 하지 않으므로 매 프레임 호출해도 된다. 단, 값이 바뀐 프레임(슬라이더 조작 중 draw()에서 setFps(guiValue) 하는 경우 등)에서는 그 update의 dt가 호출 시점부터의 시간이 되어 1프레임보다 짧아진다"
related = ["getFps", "setIndependentFps", "getFpsSettings"]

