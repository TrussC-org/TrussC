details.en = '''
A `Path` is a retained list of vertices you build up with curve and line
commands, then draw. Unlike [`beginShape`](#beginShape) (immediate-mode), a
`Path` keeps its geometry so you can build it once and draw it every frame.

Append segments — each command continues from the previous endpoint:

```cpp
Path p;
p.moveTo(50, 150);                        // start point
p.lineTo(120, 60);                        // straight segment
p.quadBezierTo(200, 20, 280, 120);        // one control point
p.bezierTo(320, 180, 380, 60, 430, 150);  // two control points
p.arc(480, 150, 40, HALF_TAU, TAU);       // circular arc (angles in radians)

// draw with the current color / fill state
setColor(colors::cornflowerBlue);
noFill();
p.draw();      // 1px outline of every subpath
```

`p.draw()` uses the current [`setColor`](#setColor) and [`fill`](#fill) /
[`noFill`](#noFill) state (a `Path` has no per-instance color). `draw()`'s fill
is a convex triangle fan; for concave or holed shapes call
[`drawFill`](#Path::drawFill) (non-zero winding), and for thick outlines with
caps/joins use [`drawStroke`](#Path::drawStroke). Call [`moveTo`](#Path::moveTo)
again to start a disjoint subpath, and [`close`](#Path::close) to close the
current one.
'''
details.ja = '''
`Path` は、曲線・直線コマンドで組み立てて保持しておく頂点リスト。
[`beginShape`](#beginShape)（即時モード）と違い、`Path` はジオメトリを保持する
ので、一度組み立てて毎フレーム描画できる。

セグメントを追加していく — 各コマンドは前のコマンドの終点から続く:

```cpp
Path p;
p.moveTo(50, 150);                        // 開始点
p.lineTo(120, 60);                        // 直線
p.quadBezierTo(200, 20, 280, 120);        // 制御点 1 個
p.bezierTo(320, 180, 380, 60, 430, 150);  // 制御点 2 個
p.arc(480, 150, 40, HALF_TAU, TAU);       // 円弧（角度は radian）

// 現在の color / fill 状態で描画
setColor(colors::cornflowerBlue);
noFill();
p.draw();      // 全 subpath の 1px 輪郭
```

`p.draw()` は現在の [`setColor`](#setColor) と [`fill`](#fill) /
[`noFill`](#noFill) の状態を使う（`Path` 自体は色を持たない）。`draw()` の塗りは
凸 triangle fan。凹形状や穴あき形状は [`drawFill`](#Path::drawFill)（non-zero
winding）、cap / join 付きの太い輪郭は [`drawStroke`](#Path::drawStroke) を使う。
[`moveTo`](#Path::moveTo) をもう一度呼ぶと離れた subpath を開始し、
[`close`](#Path::close) で現在の subpath を閉じる。
'''
details.ko = '''
`Path`는 곡선·직선 명령으로 쌓아 올린 뒤 그리는 정점 리스트다.
[`beginShape`](#beginShape)(즉시 모드)와 달리 `Path`는 지오메트리를 보관하므로
한 번 만들어 매 프레임 그릴 수 있다.

세그먼트를 추가한다 — 각 명령은 이전 명령의 끝점에서 이어진다:

```cpp
Path p;
p.moveTo(50, 150);                        // 시작점
p.lineTo(120, 60);                        // 직선
p.quadBezierTo(200, 20, 280, 120);        // 제어점 1개
p.bezierTo(320, 180, 380, 60, 430, 150);  // 제어점 2개
p.arc(480, 150, 40, HALF_TAU, TAU);       // 원호(각도는 라디안)

// 현재 color / fill 상태로 그리기
setColor(colors::cornflowerBlue);
noFill();
p.draw();      // 모든 subpath의 1px 윤곽
```

`p.draw()`는 현재 [`setColor`](#setColor)와 [`fill`](#fill) /
[`noFill`](#noFill) 상태를 사용한다(`Path` 자체는 색을 갖지 않는다). `draw()`의
채움은 볼록 triangle fan이다. 오목하거나 구멍이 있는 도형은
[`drawFill`](#Path::drawFill)(non-zero winding), cap / join이 있는 두꺼운
윤곽은 [`drawStroke`](#Path::drawStroke)를 사용한다. [`moveTo`](#Path::moveTo)를
다시 호출하면 분리된 subpath를 시작하고, [`close`](#Path::close)로 현재
subpath를 닫는다.
'''

