["endShape"]
category = "graphics_shapes"
keywords = ["close", "finish shape", "polygon", "ofendshape"]
of = ["ofEndShape"]
description.en = "End drawing a shape"
description.ja = "図形の描画を終了"
description.ko = "도형 그리기 종료"
related = ["beginShape", "fill", "noFill"]
details.en = '''
Closes the buffer opened by [`beginShape`](#beginShape) and draws it. Pass
`endShape(true)` to close the outline (link the last vertex back to the
first). See [`beginShape`](#beginShape) for the full pattern and a code
example.
'''
details.ja = '''
[`beginShape`](#beginShape) で開いたバッファを閉じて描画する。
`endShape(true)` を渡すと輪郭を閉じる（最後の頂点を最初の頂点に繋ぐ）。
パターン全体とコード例は [`beginShape`](#beginShape) を参照。
'''
details.ko = '''
[`beginShape`](#beginShape)로 연 버퍼를 닫고 그린다. `endShape(true)`를
전달하면 윤곽을 닫는다(마지막 정점을 첫 정점에 연결). 전체 패턴과 코드
예시는 [`beginShape`](#beginShape)를 참고.
'''

["endStroke"]
category = "graphics_shapes"
keywords = ["thick line", "finish", "polyline"]
description.en = "End drawing a stroke"
description.ja = "ストローク描画を終了"
description.ko = "stroke 그리기 종료"
related = ["beginStroke"]
details.en = '''
Closes the buffer opened by [`beginStroke`](#beginStroke) and renders it as a
`StrokeMesh` (width / caps / joins). Pass `endStroke(true)` to close the
polyline into a loop. See [`beginStroke`](#beginStroke) for the full pattern
and a code example.
'''
details.ja = '''
[`beginStroke`](#beginStroke) で開いたバッファを閉じ、`StrokeMesh`（太さ /
cap / join）として描画する。`endStroke(true)` を渡すと線をループとして閉じる。
パターン全体とコード例は [`beginStroke`](#beginStroke) を参照。
'''
details.ko = '''
[`beginStroke`](#beginStroke)로 연 버퍼를 닫고 `StrokeMesh`(두께 / cap /
join)로 그린다. `endStroke(true)`를 전달하면 선을 루프로 닫는다. 전체 패턴과
코드 예시는 [`beginStroke`](#beginStroke)를 참고.
'''

