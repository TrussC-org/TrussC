["VideoPlayer::getFrameRate"]
category = "video"
keywords = ["fps", "frame rate", "unknown"]
description.en = "Get the file frame rate in fps, or 0 when unknown or unloaded. Web returns 0."
description.ja = "ファイルのフレームレート（fps）を取得。不明または未ロードなら 0。Web では 0。"
description.ko = "파일의 프레임 레이트(fps)를 가져옴. 알 수 없거나 로드되지 않았으면 0. Web에서는 0."
details.en = "Windows reads MF_MT_FRAME_RATE instead of assuming 30 fps. Linux uses average/nominal metadata; macOS/iOS use the nominal rate. Frame counts and seeks derived from a rate are approximate for variable-frame-rate files. Unknown rates are never replaced with 30: frame queries return 0 and frame operations do nothing, with one warning per player instance. This getter itself does not warn. Use getPosition()/setPosition() and getDuration() for portable time-based control."
details.ja = "Windows は 30 fps と仮定せず MF_MT_FRAME_RATE を読む。Linux は平均／公称レート、macOS/iOS は公称レートを使う。可変フレームレートのファイルではレートから求めるフレーム数やシークは近似。不明時に 30 で代用せず、フレーム取得は 0、操作は何もせず、インスタンスごとに一度だけ警告する。この getter 自体は警告しない。移植可能な時間ベースの制御には getPosition()/setPosition() と getDuration() を使う。"
details.ko = "Windows는 30 fps로 가정하지 않고 MF_MT_FRAME_RATE를 읽음. Linux는 평균/명목 메타데이터, macOS/iOS는 명목 레이트를 사용. 가변 프레임 레이트 파일에서 레이트로 계산한 프레임 수와 탐색은 근사값임. 알 수 없는 레이트를 30으로 대체하지 않으며 프레임 조회는 0, 프레임 조작은 무동작이고 인스턴스당 한 번 경고함. 이 getter 자체는 경고하지 않음. 이식 가능한 시간 기반 제어에는 getPosition()/setPosition()과 getDuration()을 사용."
related = ["VideoPlayerBase::getFrameRate", "VideoPlayerBase::getCurrentFrame", "VideoPlayerBase::getTotalFrames", "VideoPlayerBase::setFrame", "VideoPlayer::getPosition"]

