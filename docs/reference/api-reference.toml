["getDataPath"]
category = "file"
keywords = ["resource", "asset", "resolve"]
of = ["ofToDataPath"]
description.en = "Resolve a relative path against the data directory and return it as fs::path. An absolute input is returned unchanged. Only the data-directory base is lexically normalized; filename components are preserved. Safe to call from any thread. This is the bundled data the app reads (bin/data in development, the bundle's Resources/data when packaged); files the app writes and keeps go to getUserDataPath()."
description.ja = "相対パスをデータディレクトリ基準で解決して fs::path で返す。絶対パスはそのまま返る。データディレクトリの基準部分だけを字句的に正規化し、ファイル名の構成要素は保つ。どのスレッドから呼んでもよい。アプリが読む同梱データの場所（開発中は bin/data、パッケージ後はバンドルの Resources/data）。アプリが書いて残すファイルは getUserDataPath() へ"
description.ko = "상대 경로를 데이터 디렉터리 기준으로 해석해 fs::path로 반환. 절대 경로는 그대로 반환됨. 데이터 디렉터리 기준 부분만 어휘적으로 정규화하고 파일 이름의 구성 요소는 유지. 어느 스레드에서 호출해도 됨. 앱이 읽는 동봉 데이터의 위치(개발 중에는 bin/data, 패키지 후에는 번들의 Resources/data). 앱이 쓰고 보관하는 파일은 getUserDataPath()로"
related = ["getDataPathRoot", "getUserDataPath", "getAbsolutePath", "joinPath"]

