["setSystemLogLevel"]
category = "utility"
keywords = ["verbosity", "filter", "os_log", "OutputDebugString", "system log", "console.app", "debugview"]
description.en = "Set the minimum log level written to the OS log: os_log on macOS, OutputDebugStringW on Windows"
