description.ko = "보조 윈도우 (현재 macOS 전용). 자체 Node 트리·이벤트·마우스 상태·렌더 컨텍스트를 갖고, 소속 디스플레이의 주사율로 구동됨. GPU 리소스는 모든 윈도우와 공유"
related = ["createWindow", "WindowSettings"]

["Window::setApp"]
keywords = ["attach", "lifecycle", "content", "swap", "scene", "request", "frame boundary"]
description.en = "Attach an App to this window — the only way to give a window content. The App's full lifecycle (setup/update/draw/key/mouse/windowResized + RectNode size sync) runs against this window. One App per window. An App runs once: setup() when first attached, exit() / cleanup() when it leaves its window (close(), setApp(other), or setApp(nullptr)), and leaving also detaches its audioOut() / audioIn() for good. To show it again, create a new App: setApp() refuses an App whose cleanup() already ran, and any App on a window that is not open or is closing (both log an error and leave the window as it is). setApp() is a request: it returns at once and the window applies it at its next frame boundary (before or after one of its ticks or events), wherever it is called from, including the App's own update() / draw() / keyPressed(). Until then getApp() returns the current App. The last setApp() before the boundary wins, a close() requested before it wins over it, and the checks run again when the request is applied"
description.ja = "このウィンドウにAppを設定 (ウィンドウにコンテンツを与える唯一の方法)。Appのライフサイクル一式 (setup/update/draw/キー/マウス/windowResized + RectNodeサイズ同期) がこのウィンドウで動く。1ウィンドウ1App。App は 1 回だけ動く: 最初に付けたときに setup()、ウィンドウから外れたとき (close()、setApp() で別の App に差し替えたとき、setApp(nullptr) のとき) に exit() / cleanup()。ウィンドウから外れると audioOut() / audioIn() も切り離され、元には戻らない。もう一度表示するには新しい App を作る。setApp() は cleanup() 済みの App と、開いていないウィンドウ・閉じる途中のウィンドウへの設定を拒否する (どちらもエラーログを出し、ウィンドウはそのまま)。setApp() はリクエスト: すぐに戻り、ウィンドウは次のフレーム境界 (そのウィンドウの tick やイベントの前後) で反映する。App 自身の update() / draw() / keyPressed() など、どこから呼んでも同じ。それまで getApp() は今の App を返す。境界までの最後の setApp() が有効で、それより前に close() が要求されていれば close() が優先される。チェックは反映時にもう一度行う"
description.ko = "이 윈도우에 App을 연결 (윈도우에 콘텐츠를 주는 유일한 방법). App의 전체 라이프사이클이 이 윈도우에서 실행됨. 윈도우당 App 하나. App 은 한 번만 동작한다: 처음 연결할 때 setup(), 윈도우에서 분리될 때 (close(), setApp() 으로 다른 App 으로 교체할 때, setApp(nullptr) 일 때) exit() / cleanup(). 윈도우에서 분리되면 audioOut() / audioIn() 도 분리되고 다시 연결되지 않는다. 다시 표시하려면 새 App 을 만든다. setApp() 은 cleanup() 이 이미 실행된 App 과, 열려 있지 않거나 닫히는 중인 윈도우에 대한 설정을 거부한다 (둘 다 에러 로그를 남기고 윈도우는 그대로). setApp() 은 요청이다: 바로 반환되고, 윈도우는 다음 프레임 경계 (그 윈도우의 tick 이나 이벤트의 앞뒤) 에서 반영한다. App 자신의 update() / draw() / keyPressed() 등 어디서 호출해도 같다. 그때까지 getApp() 은 현재 App 을 반환한다. 경계까지의 마지막 setApp() 이 유효하고, 그 전에 close() 가 요청되었으면 close() 가 우선한다. 검사는 반영할 때 다시 수행한다"

