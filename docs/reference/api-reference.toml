["VideoPlayerBase::getFrameRate"]
category = "video"
keywords = ["fps", "frame rate", "unknown"]
description.en = "Return the file frame rate in fps, or 0 when unknown or unloaded. Implemented by each video player."
description.ja = "ファイルのフレームレート（fps）を返す。不明または未ロードなら 0。各動画プレイヤーが実装する。"
