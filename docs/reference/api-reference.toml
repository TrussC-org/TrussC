platform_note.en = "UDP via raw BSD/Winsock sockets — full support on the 5 native platforms (send/recv, broadcast, multicast join/leave/TTL/loopback/interface, reuse-addr/port). The .cpp DOES compile for wasm and the API exists, but raw UDP is not functional in a browser: Emscripten only emulates sockets tunneled over a WebSocket proxy server, and there is no native UDP datagram path. Additionally on wasm threading is disabled (useThread_ forced false; the receive loop must run via processNetwork() on the update event, and setUseThread(true) warns + no-ops). Treat UdpSocket as native-only in practice."
platform_note.ja = "生 BSD/Winsock ソケットによる UDP — ネイティブ5プラットフォームで完全対応 (送受信、ブロードキャスト、マルチキャスト join/leave/TTL/loopback/interface、reuse-addr/port)。.cpp は wasm でもコンパイルされ API も存在するが、ブラウザでは生 UDP は機能しない: Emscripten はソケットを WebSocket プロキシ経由でしかエミュレートせず、ネイティブ UDP データグラム経路が無い。さらに wasm ではスレッド無効 (useThread_ は強制 false、受信は update イベントの processNetwork() で回す、setUseThread(true) は警告して no-op)。実用上はネイティブ専用とみなす。"

