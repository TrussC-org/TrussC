category = "file"
keywords = ["resource", "directory", "base"]
description.en = "Get the current data path root as fs::path. Unless explicitly set, Apple platforms choose one existing folder on first use, in order: <exe>/data (iOS), <exe>/../Resources/data (macOS release), <exe>/../../../data (macOS development). The choice is kept for the process; missing files never fall back to another folder. Only the release workflow copies bin/data into the macOS bundle; normal builds keep using bin/data."
description.ja = "現在のデータパスルートを fs::path で取得。明示的に設定しない場合、Apple では最初の使用時に存在するフォルダを <exe>/data（iOS）、<exe>/../Resources/data（macOS 配布）、<exe>/../../../data（macOS 開発）の順で一つ選ぶ。この選択はプロセス中保持され、見つからないファイルを別フォルダで探すことはない。macOS バンドルに bin/data をコピーするのはリリース workflow のみで、通常のビルドでは bin/data を使う"
description.ko = "현재 데이터 경로 루트를 fs::path로 얻음. 명시적으로 설정하지 않으면 Apple에서는 최초 사용 시 존재하는 폴더를 <exe>/data(iOS), <exe>/../Resources/data(macOS 배포), <exe>/../../../data(macOS 개발) 순으로 하나 선택한다. 이 선택은 프로세스 동안 유지되며, 없는 파일을 다른 폴더에서 찾지 않는다. macOS 번들에 bin/data를 복사하는 것은 릴리스 workflow뿐이며 일반 빌드에서는 bin/data를 사용한다"
related = ["setDataPathRoot", "getDataPath"]

["getTempPath"]
category = "file"
keywords = ["temporary", "cache", "tmp", "scratch"]
description.en = "Folder for temporary files, which the OS may delete at any time: $TMPDIR/<bundle id>/ on macOS, %TEMP%\\<app>\\ on Windows, $TMPDIR (or /tmp) /<app>/ on Linux, the app's tmp/ on iOS, the app's cache folder on Android, in-memory /tmp on web. Created on first use. A relative path is joined to it; an absolute path is returned as is."
description.ja = "一時ファイル用のフォルダ。OS がいつ消してもよいもの。macOS は $TMPDIR/<bundle id>/、Windows は %TEMP%\\<app>\\、Linux は $TMPDIR（なければ /tmp）/<app>/、iOS はアプリの tmp/、Android はアプリのキャッシュフォルダ、web はメモリ上の /tmp。初回使用時に作られる。相対パスはこのフォルダにつなげ、絶対パスはそのまま返す"
description.ko = "임시 파일용 폴더. OS가 언제든 지울 수 있다. macOS는 $TMPDIR/<bundle id>/, Windows는 %TEMP%\\<app>\\, Linux는 $TMPDIR(없으면 /tmp)/<app>/, iOS는 앱의 tmp/, Android는 앱의 캐시 폴더, web은 메모리상의 /tmp. 처음 사용할 때 만들어진다. 상대 경로는 이 폴더에 이어 붙이고, 절대 경로는 그대로 반환"
related = ["getUserDataPath", "getDataPath"]

["getUserDataPath"]
category = "file"
keywords = ["save", "settings", "preferences", "writable", "application support", "appdata", "user folder"]
description.en = "Folder for files the app writes and keeps (settings, presets, logs, recordings): always the OS per-user app folder, in development and in a packaged app alike. macOS ~/Library/Application Support/<bundle id>/, Windows %LOCALAPPDATA%\\<app>\\, Linux $XDG_DATA_HOME/<app>/ (default ~/.local/share/<app>/), iOS the app's Library/Application Support/, Android the app's internal files folder; on web it is in memory and not kept. <app> is the executable name. Created on first use. A relative path is joined to it; an absolute path is returned as is. Write and read back through it: saveJson(j, getUserDataPath(\"settings.json\")) then loadJson(getUserDataPath(\"settings.json\")). setUserDataPathRoot() changes it."
description.ja = "アプリが書いて残すファイル（設定、プリセット、ログ、録画）用のフォルダ。開発中もパッケージ後も常に OS のユーザーごとのアプリフォルダ。macOS は ~/Library/Application Support/<bundle id>/、Windows は %LOCALAPPDATA%\\<app>\\、Linux は $XDG_DATA_HOME/<app>/（既定は ~/.local/share/<app>/）、iOS はアプリの Library/Application Support/、Android はアプリの内部ファイルフォルダ。web ではメモリ上にあり残らない。<app> は実行ファイル名。初回使用時に作られる。相対パスはこのフォルダにつなげ、絶対パスはそのまま返す。書くときも読み戻すときもこれを通す: saveJson(j, getUserDataPath(\"settings.json\")) の後 loadJson(getUserDataPath(\"settings.json\"))。setUserDataPathRoot() で変えられる"
description.ko = "앱이 쓰고 보관하는 파일(설정, 프리셋, 로그, 녹화)용 폴더. 개발 중이든 패키지 후든 항상 OS의 사용자별 앱 폴더. macOS는 ~/Library/Application Support/<bundle id>/, Windows는 %LOCALAPPDATA%\\<app>\\, Linux는 $XDG_DATA_HOME/<app>/(기본 ~/.local/share/<app>/), iOS는 앱의 Library/Application Support/, Android는 앱의 내부 파일 폴더. web에서는 메모리에 있고 남지 않는다. <app>은 실행 파일 이름. 처음 사용할 때 만들어진다. 상대 경로는 이 폴더에 이어 붙이고, 절대 경로는 그대로 반환. 쓸 때도 다시 읽을 때도 이것을 거친다: saveJson(j, getUserDataPath(\"settings.json\")) 후 loadJson(getUserDataPath(\"settings.json\")). setUserDataPathRoot()로 바꿀 수 있다"
related = ["setUserDataPathRoot", "getTempPath", "getDataPath", "saveJson"]
platform_note.en = "On the desktop the folder survives an uninstall; on iOS and Android it survives app updates but not an uninstall. Apple platforms only: a write whose path resolves inside the app bundle is refused by every core writer, with an error naming getUserDataPath(); during development (data folder outside a bundle) the first relative write into the data folder logs one notice. Folders macOS protects (Desktop, Documents, Downloads, removable or network volumes) ask the user once on first access; an unattended installation accepts that prompt during setup."
platform_note.ja = "デスクトップではアンインストール後もフォルダは残る。iOS と Android ではアプリ更新では残るがアンインストールで消える。Apple のみ: パスがアプリバンドル内に解決される書き込みは、どのコアの書き込み関数でも拒否され、getUserDataPath() を案内するエラーが出る。開発中（データフォルダがバンドル外）は、相対パスでデータフォルダに書いた最初の 1 回に notice を出す。macOS が保護するフォルダ（デスクトップ、書類、ダウンロード、リムーバブル / ネットワークボリューム）は初回アクセス時に一度ユーザーに許可を求める。無人のインストールでは設置時にその許可を済ませておく"
platform_note.ko = "데스크톱에서는 제거 후에도 폴더가 남는다. iOS와 Android에서는 앱 업데이트에는 남지만 제거하면 사라진다. Apple 전용: 경로가 앱 번들 안으로 해석되는 쓰기는 모든 코어 쓰기 함수에서 거부되며 getUserDataPath()를 안내하는 오류가 남는다. 개발 중(데이터 폴더가 번들 밖)에는 상대 경로로 데이터 폴더에 쓴 첫 1회에 notice를 남긴다. macOS가 보호하는 폴더(데스크톱, 문서, 다운로드, 이동식 / 네트워크 볼륨)는 처음 접근할 때 한 번 사용자에게 허락을 구한다. 무인 설치에서는 설치 시 그 허락을 미리 해 둔다"

