["ThreadChannel::receiveAll"]
keywords = ["drain", "batch", "swap", "snapshot", "take all"]
description.en = "Receive everything queued right now without blocking and return it as a std::vector<T> in FIFO order, e.g. for (auto& msg : channel.receiveAll()) handle(msg);. Under the lock it only swaps the queue with an empty one; the values are moved into the vector after the lock is released, so other threads wait only for the swap. Values sent afterwards stay queued for the next receive. Returns an empty vector if the channel is empty or closed."
description.ja = "今キューにあるものをブロックせずにすべて受け取り、FIFO 順の std::vector<T> で返す（例: for (auto& msg : channel.receiveAll()) handle(msg);）。ロック中はキューを空のキューと入れ替えるだけで、値を vector に移すのはロックを放した後なので、他のスレッドが待つのは入れ替えの間だけ。その後に send された値は次の受信まで残る。空またはチャンネルが閉じていれば空の vector を返す"
description.ko = "지금 큐에 있는 것을 블로킹 없이 모두 받아 FIFO 순서의 std::vector<T>로 반환(예: for (auto& msg : channel.receiveAll()) handle(msg);). 락 안에서는 큐를 빈 큐와 바꾸기만 하고, 값을 vector로 옮기는 것은 락을 놓은 뒤이므로 다른 스레드는 교체하는 동안만 기다림. 그 뒤에 send된 값은 다음 수신까지 남음. 비어 있거나 채널이 닫혀 있으면 빈 vector 반환"
related = ["ThreadChannel::tryReceive", "ThreadChannel::size"]

["ThreadChannel::send"]
description.en = "Send a value onto the queue (copy or move overload). Returns false if the channel is closed (with the move overload the value is invalidated even on failure)."
description.ja = "キューに値を送る（コピー版またはムーブ版オーバーロード）。チャンネルが閉じていれば false を返す（ムーブ版では失敗時でも値は無効化される）"
description.ko = "큐에 값을 보냄(복사 또는 이동 오버로드). 채널이 닫혀 있으면 false 반환(이동 오버로드에서는 실패 시에도 값이 무효화됨)"

["ThreadChannel::size"]
description.en = "Number of queued values. Takes the lock, so it is safe while other threads send; they may send or receive right after it returns."
description.ja = "キューに入っている値の数。ロックを取るので、他のスレッドが send している間でも安全に呼べる。戻った直後に他のスレッドが send / receive することはある"
description.ko = "큐에 들어 있는 값의 개수. 락을 잡으므로 다른 스레드가 send하는 동안에도 안전하게 호출할 수 있음. 반환 직후 다른 스레드가 send / receive할 수는 있음"

