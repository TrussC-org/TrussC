["TcpClient::connectAsync"]
description.en = "Start a cancellable connection attempt; the same pending target is a silent no-op, a different target replaces it"
description.ja = "キャンセル可能な接続を開始。接続中の同じ宛先は何もせず、別の宛先なら置き換える"
description.ko = "취소 가능한 연결 시작. 같은 대기 대상은 무시하고 다른 대상은 기존 시도를 대체"
details.en = "Uses a non-blocking TCP connect and short poll slices even with threads. Repeating the same host and port while isConnecting() is true does nothing, without a warning. Changing the target, disconnect() and destruction cancel the old TCP wait before joining its worker. The default TCP deadline is the OS deadline; setConnectTimeout() opts into a shorter one. DNS resolution and user listeners can still delay teardown. Without threads, call processNetwork() through the update event to advance the attempt and asynchronous sends."
details.ja = "スレッドありでも非ブロッキング TCP 接続を短い poll で待つ。isConnecting() が true の間は同じホストとポートへの再呼び出しは警告なしで何もしない。宛先変更、disconnect()、破棄は TCP 接続待ちをキャンセルしてからワーカーを join する。接続期限は既定では OS に任せ、setConnectTimeout() で短縮できる。DNS 解決やユーザーのリスナーを待つことはある。スレッドなしでは update イベントから processNetwork() を呼び、接続と非同期送信を進める。"
details.ko = "스레드 사용 시에도 비차단 TCP 연결을 짧은 poll로 기다린다. isConnecting()이 true이면 같은 호스트와 포트 재호출은 경고 없이 무시한다. 대상 변경, disconnect(), 소멸은 TCP 대기를 취소한 뒤 작업자를 join한다. 기본 연결 기한은 OS에 맡기며 setConnectTimeout()으로 단축할 수 있다. DNS 해석과 사용자 리스너는 종료를 지연시킬 수 있다. 스레드 없이 update 이벤트에서 processNetwork()을 호출해 연결과 비동기 전송을 진행한다."

