description.ja = "StrokeMesh による太いストローク (strokeWeight / Cap / Join 反映)、subpath 毎。1 ピクセル線は draw()。"
description.ko = "StrokeMesh로 두꺼운 stroke (strokeWeight / Cap / Join 적용), subpath 별. 1 픽셀 선은 draw()."

