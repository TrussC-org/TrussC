["TcpClient::onConnect"]
description.en = "Fired when the connection completes"
description.ja = "接続完了時に発火"
description.ko = "연결 완료 시 발생"
details.en = '''
`success` is true when the connection is up (for `TlsClient`, after the TLS
handshake) and false when an attempt failed. A failed attempt reports
`onConnect(false)` from [`connectAsync()`](#TcpClient::connectAsync), from a
pending connect without threads, and from a failed TLS handshake; a failed
blocking [`connect()`](#TcpClient::connect) returns false instead.

An attempt that a newer attempt has replaced does not report
`onConnect(false)`. When an [`onError`](#TcpClient::onError) listener calls
`connect()` for the failure, the failed attempt reports nothing more once the
client is connected or connecting again: only the newer attempt reports its
result. [`connect()`](#TcpClient::connect) itself still returns false for the
failed attempt, while [`isConnected()`](#TcpClient::isConnected) is true for
the newer one.
'''
details.ja = '''
`success` は接続できたとき（`TlsClient` では TLS ハンドシェイクの後）に true、
接続の試みが失敗したときに false。失敗を `onConnect(false)` で知らせるのは
[`connectAsync()`](#TcpClient::connectAsync)、スレッドなしで保留中だった接続、
TLS ハンドシェイクの失敗。ブロッキングの [`connect()`](#TcpClient::connect) は
失敗すると false を返す。

新しい試みに置き換えられた試みは `onConnect(false)` を知らせない。
[`onError`](#TcpClient::onError) のリスナーがその失敗に対して `connect()` を
呼び、クライアントがすでに接続済みか接続中なら、失敗した試みはそれ以上何も
知らせず、新しい試みだけが結果を知らせる。このとき失敗した試みの
[`connect()`](#TcpClient::connect) は false を返し、
[`isConnected()`](#TcpClient::isConnected) は新しい接続について true になる。
'''
details.ko = '''
`success`는 연결이 완료되면(`TlsClient`에서는 TLS 핸드셰이크 후) true, 연결
시도가 실패하면 false다. 실패를 `onConnect(false)`로 알리는 것은
[`connectAsync()`](#TcpClient::connectAsync), 스레드 없이 대기 중이던 연결,
TLS 핸드셰이크 실패다. 블로킹 [`connect()`](#TcpClient::connect)는 실패하면
false를 반환한다.

새 시도로 대체된 시도는 `onConnect(false)`를 알리지 않는다.
[`onError`](#TcpClient::onError) 리스너가 그 실패에 대해 `connect()`를 호출하여
클라이언트가 이미 연결되었거나 연결 중이면, 실패한 시도는 더 이상 아무것도
알리지 않고 새 시도만 결과를 알린다. 이때 실패한 시도의
[`connect()`](#TcpClient::connect)는 false를 반환하고,
[`isConnected()`](#TcpClient::isConnected)는 새 연결에 대해 true다.
'''

["TcpClient::onDisconnect"]
description.en = "Fired when the connection ends: the peer closed it, an error ended it, or disconnect() / connect() on a connected client (not from the destructor)"
description.ja = "接続が終わったときに発火：相手が閉じた、エラーで切れた、または disconnect() / 接続中の connect()（デストラクタでは発火しない）"
description.ko = "연결이 끝났을 때 발생: 상대가 닫음, 오류로 끊김, 또는 disconnect() / 연결 중 connect() (소멸자에서는 발생하지 않음)"
details.en = '''
[`TcpDisconnectEventArgs::reason`](#TcpDisconnectEventArgs::reason) says why:

- `"Connection closed by remote"` (`wasClean` true) — the peer closed the
  connection. Fires on the receive thread.
- `"Connection error"` (`wasClean` false; `TlsClient`: `"TLS error: ..."`) —
  an error ended it. Fires on the receive thread.
- `"Send failed"` (`wasClean` false) — a send failed or timed out. Fires
  on the writer thread, or inline without threads.
- `"Disconnected by client"` (`wasClean` true) — the app ended it, with
  [`disconnect()`](#TcpClient::disconnect) or with
  [`connect()`](#TcpClient::connect) on a connected client. Fires
  synchronously on the calling thread, before that call returns.

Without threads ([`setUseThread(false)`](#TcpClient::setUseThread), the
default on the web) the first two fire on the main thread instead, from the
update event.

The destructor disconnects without firing it. An auto-reconnect listener
should not reconnect on `"Disconnected by client"`, which is the app's own
doing:

```cpp
listener = client.onDisconnect.listen([&](TcpDisconnectEventArgs& e) {
    if (e.reason == "Disconnected by client") return;  // the app did it
    // e.wasClean: true if the peer closed it, false if an error did
    reconnectPending = true;  // reconnect from update(), on the main thread
});
```

A listener that reconnects with `connect()` from inside `connect()`'s own
disconnect anyway is overruled: `connect()` closes that connection again,
without another notification, and connects where it was asked to. With
threads, do not call [`connectAsync()`](#TcpClient::connectAsync) from such a
listener: the connect thread it starts runs `connect()` at the same time as the
outer `connect()`, which is unsupported. Without threads
`connectAsync()` is `connect()`, and is overruled the same way.

When the event fires on the receive thread, a plain (inline) listener that
calls `connect()` runs it on that thread, which cannot join itself. A
listener that calls `disconnect()` there is in the same position. The client
keeps that thread and joins it from another thread: the next `connect()` or
`disconnect()` returns only once the thread has ended (the rest of the
listener and of its receive loop), and so does the destructor. Do not run reentrant connection management from another thread until the
listener's connection call has returned.

A listener on the receive thread may also destroy the client (an owner that
replaces it, as `WebSocketClient::connect()` does). The destructor cannot
join the thread it runs on and detaches it; once the notification returns,
the thread sees that the client is gone and stops without reading it (#262).
Do not destroy the client from a listener on the connect thread of
`connectAsync()`: that thread returns into the destroyed client, which is
undefined behavior. Destroy it from another thread, or after the listener
has returned (for example from a `Deliver::Main` listener). `connect()`, `connectAsync()`, `disconnect()` and
the destructor can wait for a listener still running on one of the client's
threads. Do not call them while holding a lock that such a listener takes:
the call and the listener would wait for each other forever. Reconnecting
from the main thread, as above, avoids all of this.
'''
details.ja = '''
[`TcpDisconnectEventArgs::reason`](#TcpDisconnectEventArgs::reason) が理由を示す：

- `"Connection closed by remote"`（`wasClean` は true）— 相手が接続を閉じた。
  受信スレッドで発火する。
- `"Connection error"`（`wasClean` は false。`TlsClient` では
  `"TLS error: ..."`）— エラーで切れた。受信スレッドで発火する。
- `"Disconnected by client"`（`wasClean` は true）— アプリが
  [`disconnect()`](#TcpClient::disconnect) か、接続中の
  [`connect()`](#TcpClient::connect) で切った。呼び出し元のスレッドで、
  その呼び出しが返る前に同期で発火する。

スレッドなし（[`setUseThread(false)`](#TcpClient::setUseThread)、Web では既定）
のときは、最初の 2 つはメインスレッドで update イベントから発火する。

デストラクタは発火させずに切断する。自動再接続のリスナーは、アプリ自身が
切った `"Disconnected by client"` では再接続しないこと：

```cpp
listener = client.onDisconnect.listen([&](TcpDisconnectEventArgs& e) {
    if (e.reason == "Disconnected by client") return;  // アプリが切った
    // e.wasClean: 相手が閉じたなら true、エラーなら false
    reconnectPending = true;  // 再接続は update()（メインスレッド）で
});
```

それでも `connect()` 自身の切断の中からリスナーが `connect()` で再接続した
場合、その接続は `connect()` が通知なしで閉じ直し、頼まれた先へ接続する。
スレッドありのときは、このリスナーから
[`connectAsync()`](#TcpClient::connectAsync) を呼ばないこと：それが起こす接続
スレッドが、外側の `connect()` と同時に `connect()` を走らせ、`std::terminate`
に至り得るため未対応。スレッドなしでは `connectAsync()` は `connect()` と
同じで、同じように閉じ直される。

受信スレッドで発火したとき、そこで `connect()` を呼ぶ通常の（inline の）
リスナーは、その受信スレッドの上で動き、そのスレッドは自分自身を join
できない。そこで `disconnect()` を呼ぶリスナーも同じだ。クライアントは
そのスレッドを手元に置いておき、別のスレッドから join する：次の
`connect()` か `disconnect()` は、そのスレッドが終わってから（リスナーの
残りと受信ループを抜けるまで）戻り、デストラクタも同じように待つ。
リスナーの接続操作が返るまで、別スレッドから同時に
接続を操作しないこと。

受信スレッドのリスナーはクライアントを破棄してもよい（`WebSocketClient::connect()`
のように、持ち主がクライアントを置き換える場合）。デストラクタは自分が動いて
いるスレッドを join できないので detach する。通知が戻ると、そのスレッドは
クライアントがもうないことを確かめ、クライアントを読まずに止まる（#262）。
`connectAsync()` の接続スレッドのリスナーからは破棄しないこと：そのスレッドは
破棄済みのクライアントへ戻り、未定義動作になる。別のスレッドから、または
リスナーが返ったあと（たとえば `Deliver::Main` のリスナーから）破棄すること。`connect()`、`connectAsync()`、
`disconnect()`、デストラクタは、クライアントのスレッドの上でまだ動いている
リスナーを待つことがある。そのリスナーが取るロックを持ったまま、これらを
呼ばないこと：呼び出しとリスナーが互いを待ち続け、どちらも先へ進まなくなる。
上の例のようにメインスレッドで再接続すれば、どれも避けられる。
'''
details.ko = '''
[`TcpDisconnectEventArgs::reason`](#TcpDisconnectEventArgs::reason)가 이유를 알려 준다:

- `"Connection closed by remote"` (`wasClean`은 true) — 상대가 연결을 닫았다.
  수신 스레드에서 발생한다.
- `"Connection error"` (`wasClean`은 false, `TlsClient`에서는
  `"TLS error: ..."`) — 오류로 끊겼다. 수신 스레드에서 발생한다.
- `"Send failed"` (`wasClean`은 false) — 전송 실패 또는 기한 만료.
  전송 스레드에서, 스레드 없으면 호출한 스레드에서 발생한다.
- `"Disconnected by client"` (`wasClean`은 true) — 앱이
  [`disconnect()`](#TcpClient::disconnect) 또는 연결 중인
  [`connect()`](#TcpClient::connect)로 끊었다. 호출한 스레드에서, 그 호출이
  반환되기 전에 동기적으로 발생한다.

스레드 없이 동작할 때([`setUseThread(false)`](#TcpClient::setUseThread), 웹에서는
기본값)는 앞의 두 가지가 메인 스레드에서 update 이벤트로부터 발생한다.

소멸자는 이벤트를 발생시키지 않고 연결을 끊는다. 자동 재연결 리스너는 앱이
스스로 끊은 `"Disconnected by client"`에서는 재연결하지 않아야 한다:

```cpp
listener = client.onDisconnect.listen([&](TcpDisconnectEventArgs& e) {
    if (e.reason == "Disconnected by client") return;  // 앱이 끊었다
    // e.wasClean: 상대가 닫았으면 true, 오류면 false
    reconnectPending = true;  // 재연결은 update()(메인 스레드)에서
});
```

그래도 `connect()` 자신의 연결 해제 안에서 리스너가 `connect()`로 재연결하면,
`connect()`가 그 연결을 알림 없이 다시 닫고 요청받은 곳으로 연결한다.
스레드를 사용할 때는 이 리스너에서
[`connectAsync()`](#TcpClient::connectAsync)를 호출하지 말 것: 그것이 시작하는
연결 스레드가 바깥 `connect()`와 동시에 `connect()`를 실행하여
이런 동시 연결 관리는 지원하지 않는다. 스레드 없이는 `connectAsync()`가
`connect()`와 같으며, 같은 방식으로 다시 닫힌다.

수신 스레드에서 발생했을 때 그 자리에서 `connect()`를 호출하는 일반(inline)
리스너는 그 수신 스레드 위에서 실행되며, 그 스레드는 자기 자신을 join할 수
없다. 그 자리에서 `disconnect()`를 호출하는 리스너도 마찬가지다.
클라이언트는 그 스레드를 보관해 두었다가 다른 스레드에서 join한다: 다음
`connect()`나 `disconnect()`는 그 스레드가 끝난 뒤에(리스너의 나머지와 수신
루프를 빠져나올 때까지) 반환하며, 소멸자도 같은 방식으로 기다린다.
리스너의 연결 관리 호출이 반환되기 전에는 다른 스레드에서 동시에 연결을
관리하지 말 것.

수신 스레드의 리스너는 클라이언트를 파괴해도 된다(`WebSocketClient::connect()`
처럼 소유자가 클라이언트를 교체하는 경우). 소멸자는 자신이 실행 중인 스레드를
join할 수 없어 detach한다. 알림이 반환되면 그 스레드는 클라이언트가 이미
없음을 확인하고 클라이언트를 읽지 않고 멈춘다(#262). `connectAsync()`의 연결
스레드 위의 리스너에서는 파괴하지 말 것: 그 스레드는 이미 파괴된 클라이언트로
돌아가며, 이는 정의되지 않은 동작이다. 다른 스레드에서, 또는 리스너가 반환된
뒤에(예: `Deliver::Main` 리스너에서) 파괴할 것. `connect()`, `connectAsync()`, `disconnect()`와 소멸자는
클라이언트의 스레드 위에서 아직 실행 중인 리스너를 기다릴 수 있다. 그런
리스너가 잡는 락을 쥔 채로 이것들을 호출하지 말 것: 호출과 리스너가 서로를
영원히 기다리게 된다. 위 예처럼 메인 스레드에서 재연결하면 모두 피할 수 있다.
'''

