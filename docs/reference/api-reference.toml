["Sound::setPosition"]
category = "sound"
keywords = ["seek", "jump", "scrub", "playhead", "normalized"]
description.en = "Seek to a specific time in seconds. On streams the audio moves after the decoder seeks and the ring refills. Measured seek to first post-seek output callback on WASAPI/CoreAudio: about 1.5 audio callbacks on average, about 2 at p95 (13–16 ms mean with 10 ms callbacks). PulseAudio on main averaged 25.4 ms. These are callback-level timings, not speaker/DAC latency or silence duration; slow storage or an MP3 several hours long can take longer. See issue #550 for measurements. getPosition() reports the new position at once, the last of several calls wins, and a paused stream resumes from there. A stream whose length is unknown (getDuration() is 0) cannot seek: the call is ignored with a warning."
description.ja = "指定秒数にシーク。ストリームではデコーダのシークと ring の補充後に音が移る。シーク要求からシーク先の音を含む最初の出力コールバックまでの実測値は、WASAPI/CoreAudio で平均約 1.5 コールバック、p95 で約 2 コールバック (10 ms 間隔では平均 13–16 ms)。PulseAudio の main では平均 25.4 ms。これはコールバック単位の測定で、スピーカー/DAC までの遅延や無音時間ではない。遅いストレージや数時間の長さの MP3 ではもっとかかる。測定の詳細は issue #550 を参照。getPosition() は直後から新しい位置を返し、続けて呼んだ場合は最後の呼び出しが有効。一時停止中のストリームは再開時にそこから鳴る。長さが不明なストリーム (getDuration() が 0) はシークできず、呼び出しは警告を出して無視される"
description.ko = "지정 시간(초)으로 시크. 스트림은 디코더가 시크하고 링을 재충전한 뒤 소리가 옮겨짐. 시크 요청부터 새 위치의 오디오가 담긴 첫 출력 콜백까지의 측정값은 WASAPI/CoreAudio에서 평균 약 1.5 콜백, p95 약 2 콜백 (10 ms 간격에서 평균 13–16 ms). PulseAudio의 main에서는 평균 25.4 ms. 이는 콜백 단위 측정이며 스피커/DAC까지의 지연이나 무음 시간이 아님. 느린 저장소나 몇 시간 길이의 MP3에서는 더 걸릴 수 있음. 측정 상세는 issue #550 참조. getPosition()은 즉시 새 위치를 반환하고, 연속으로 호출하면 마지막 호출이 유효. 일시정지 중인 스트림은 재개할 때 그 위치부터 재생. 길이를 알 수 없는 스트림 (getDuration()이 0)은 시크할 수 없으며, 호출은 경고와 함께 무시됨"

