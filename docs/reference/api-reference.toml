["Mesh::markGpuDirty"]
category = "types_mesh"
keywords = ["upload", "invalidate"]
description.en = "Force a GPU re-upload on the next draw (bumps the data revision). Not needed after normal edits: every mutator and non-const getter already does this."
details.en = "If you retain a mutable getter reference across draws, call markGpuDirty() after later writes through it. Only fetching the reference marks the mesh changed."
details.ja = "非 const ゲッターの参照を描画をまたいで保持する場合、後からその参照経由で書き込んだ後に markGpuDirty() を呼ぶ。参照を取得するときだけメッシュが変更済みになる。"
details.ko = "non-const getter 참조를 여러 그리기에 걸쳐 유지한다면, 나중에 그 참조를 통해 쓴 후 markGpuDirty()를 호출한다. 참조를 가져올 때만 메시가 변경됨으로 표시된다."
description.ja = "次の描画で GPU への再アップロードを強制する（データリビジョンを進める）。通常の編集後は不要：すべての変更関数と非 const ゲッターが自動で行う。"
description.ko = "다음 그리기에서 GPU 재업로드를 강제한다(데이터 리비전을 올림). 일반적인 편집 후에는 필요 없다: 모든 변경 함수와 non-const getter가 이미 수행한다."
related = ["Mesh::uploadToGpu", "Mesh::getDataRevision"]

["Mesh::getDataRevision"]
category = "types_mesh"
keywords = ["revision", "dirty", "changed", "upload", "version"]
description.en = "Current data revision: changes whenever the mesh data changes (mutators, non-const getters, markGpuDirty). GPU buffers are re-uploaded when it differs from the revision they were uploaded from. Compare with != only."
description.ja = "現在のデータリビジョン。メッシュのデータが変わるたび（変更関数、非 const ゲッター、markGpuDirty）に変わる。GPU バッファはアップロード時のリビジョンと異なると再アップロードされる。比較は != のみで行う。"
description.ko = "현재 데이터 리비전. 메시 데이터가 바뀔 때마다(변경 함수, non-const getter, markGpuDirty) 바뀐다. GPU 버퍼는 업로드 당시의 리비전과 다르면 다시 업로드된다. 비교는 != 로만 한다."
related = ["Mesh::markGpuDirty", "Mesh::uploadToGpu", "Mesh::uploadPointsToGpu"]

