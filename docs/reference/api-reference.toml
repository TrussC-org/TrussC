details.en = '''
Directional lights have no position, so their shadow map is an orthographic box
centered on `center` with half-extent `radius`. Size it to enclose every caster
and receiver you want shadowed — anything outside the box renders unshadowed.
Ignored by Spot lights (they use the perspective projector frustum) and by Point
lights (which don't support shadows).
'''
details.ja = '''
directional lightは位置を持たないため、shadow mapは `center` を中心とし
half-extent `radius` の正射影ボックスになる。shadowを落としたいcasterと
receiverをすべて囲むサイズにする。ボックス外はshadowなしで描画される。
Spot lightでは無視され（perspective projector錐台を使う）、Point light
（shadow非対応）でも無視される。
'''
details.ko = '''
디렉셔널 라이트는 위치가 없으므로 섀도우 맵은 `center`를 중심으로 half-extent
`radius`인 직교 박스가 된다. 섀도우를 드리우려는 모든 캐스터와 리시버를 감싸는
크기로 설정한다. 박스 밖은 섀도우 없이 렌더링된다. 스포트 라이트에서는 무시되며
(퍼스펙티브 프로젝터 절두체를 사용), 포인트 라이트(섀도우 미지원)에서도 무시된다.
