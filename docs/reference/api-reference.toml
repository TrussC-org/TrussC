["Mesh::getColors"]
description.en = "Get all vertex colors"
description.ja = "全頂点カラーを取得"
description.ko = "모든 정점 색상을 얻음"
details.en = '''
The non-const overload marks the mesh changed, so writes through the returned
reference are uploaded on the next GPU (Points / PBR) draw. Reading through it
also re-uploads; to only read, use a `const Mesh&` (or `std::as_const(mesh)`).
'''
details.ja = '''
非 const 版はメッシュを変更済みにするので、返された参照経由の書き込みは次の GPU
（Points / PBR）描画でアップロードされる。読むだけでも再アップロードになるため、
読むだけなら `const Mesh&`（または `std::as_const(mesh)`）を使う。
'''
details.ko = '''
non-const 버전은 메시를 변경됨으로 표시하므로, 반환된 참조를 통한 쓰기는 다음 GPU
(Points / PBR) 그리기에서 업로드된다. 읽기만 해도 다시 업로드되므로, 읽기만 할
때는 `const Mesh&`(또는 `std::as_const(mesh)`)를 사용한다.
'''

["Mesh::getGpuIndexCount"]
category = "types_mesh"
keywords = ["gpu", "buffer", "interop"]
description.en = "Number of indices in the uploaded GPU list; pairs with getGpuIndexBuffer for custom rendering. TriangleStrip and TriangleFan expand to triangle lists; LineStrip and LineLoop expand to line lists. If the mesh has no indices, 0..N-1 (N = vertex count) supplies the source sequence, including for Points. Custom pipelines must draw triangle modes as triangle lists and line modes as line lists."
description.ja = "GPU にアップロードしたリストのインデックス数。自前描画では getGpuIndexBuffer と組で使う。TriangleStrip と TriangleFan は三角形リストに、LineStrip と LineLoop は線リストに展開する。元のインデックスが無ければ 0..N-1（N は頂点数）を入力列とし、Points でも同じ連番を使う。独自のパイプラインでは三角形モードを三角形リスト、線モードを線リストとして描画する。"
description.ko = "GPU에 업로드한 리스트의 인덱스 수. 커스텀 렌더링에서는 getGpuIndexBuffer와 함께 쓴다. TriangleStrip과 TriangleFan은 삼각형 리스트로, LineStrip과 LineLoop는 선 리스트로 확장한다. 원본 인덱스가 없으면 0..N-1(N은 정점 수)을 입력 시퀀스로 사용하며, Points에서도 같은 순차 인덱스를 사용한다. 커스텀 파이프라인에서는 삼각형 모드를 삼각형 리스트로, 선 모드를 선 리스트로 그려야 한다."
related = ["Mesh::uploadToGpu", "Mesh::getGpuIndexBuffer", "Mesh::getGpuVertexCount"]

["Mesh::getGpuVertexCount"]
