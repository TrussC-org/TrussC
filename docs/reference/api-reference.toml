["setLogLevel"]
category = "utility"
keywords = ["verbosity", "filter", "log level", "all outputs"]
description.en = "Set the console, file and system log levels at once (a later per-output call wins)"
description.ja = "コンソール・ファイル・システムのログレベルを一度に設定（後の出力ごとの呼び出しが優先）"
description.ko = "콘솔·파일·시스템 로그 레벨을 한 번에 설정 (이후의 출력별 호출이 우선)"
details.en = '''
Sets the console, file and system levels at once. It overwrites them when called; a later `setConsoleLogLevel()` / `setFileLogLevel()` / `setSystemLogLevel()` call wins. There is no `getLogLevel()`, since there is no single level to return. The levels of all outputs are explained under [`Logger`](#Logger).

```cpp
setLogLevel(LogLevel::Warning);       // console, file and system output: all Warning
setFileLogLevel(LogLevel::Verbose);   // then only the file goes down to Verbose
setSystemLogLevel(LogLevel::Silent);  // no OS log (os_log / OutputDebugString)
```
'''
details.ja = '''
コンソール・ファイル・システムのレベルを一度に設定する。呼んだ時点で上書きし、その後の `setConsoleLogLevel()` / `setFileLogLevel()` / `setSystemLogLevel()` が優先される。返すべき単一のレベルが無いので `getLogLevel()` は無い。各出力のレベルの全体像は [`Logger`](#Logger) を参照。

```cpp
setLogLevel(LogLevel::Warning);       // console, file and system output: all Warning
setFileLogLevel(LogLevel::Verbose);   // then only the file goes down to Verbose
setSystemLogLevel(LogLevel::Silent);  // no OS log (os_log / OutputDebugString)
```
'''
details.ko = '''
콘솔·파일·시스템 레벨을 한 번에 설정한다. 호출 시점에 덮어쓰고, 그 뒤의 `setConsoleLogLevel()` / `setFileLogLevel()` / `setSystemLogLevel()` 호출이 우선한다. 반환할 단일 레벨이 없으므로 `getLogLevel()`은 없다. 각 출력의 레벨 전체는 [`Logger`](#Logger) 참조.

```cpp
setLogLevel(LogLevel::Warning);       // console, file and system output: all Warning
setFileLogLevel(LogLevel::Verbose);   // then only the file goes down to Verbose
setSystemLogLevel(LogLevel::Silent);  // no OS log (os_log / OutputDebugString)
```
'''
related = ["LogLevel", "setConsoleLogLevel", "setFileLogLevel", "setSystemLogLevel", "Logger"]

["setMaxUpdateSteps"]
category = "window_system"
keywords = ["update cap", "catch up", "fixed step", "stall", "deterministic", "tick rate"]
description.en = "Set the most fixed-rate update steps run in one frame (setIndependentFps with an update rate) or in one runHeadlessApp loop pass. More are pending after a stall, when update() is slower than its own rate, or when the update rate is more than this many times the display rate; the time beyond the cap is dropped with a one-time warning instead of replayed. Default 10. 0 or less removes the cap so every step runs (e.g. a deterministic simulation), at the cost of a freeze while a long stall is replayed and of frames that keep growing while update() is slower than its rate"
description.ja = "1フレーム（update レートを指定した setIndependentFps）または runHeadlessApp のループ1周で回す固定レート update ステップの最大数を設定する。停止のあと、update() が自分のレートに追いつかないとき、update レートがディスプレイのレートのこの倍数を超えるときにステップが溜まり、上限を超えた分の時間は再実行せずに捨てられ、一度だけ警告が出る。既定は10。0以下にすると上限がなくなり全ステップを回す（決定的なシミュレーションなど）が、長い停止のあとは再実行の間止まり、update() がレートに追いつかない間はフレームが伸び続ける"
description.ko = "한 프레임(update 레이트를 지정한 setIndependentFps) 또는 runHeadlessApp 루프 1회에서 돌리는 고정 레이트 update 스텝의 최대 수를 설정한다. 정지 후, update()가 자신의 레이트를 따라가지 못할 때, update 레이트가 디스플레이 레이트의 이 배수를 넘을 때 스텝이 쌓이며, 상한을 넘는 시간은 다시 실행하지 않고 버려지고 경고가 한 번 출력된다. 기본값은 10. 0 이하로 하면 상한이 없어져 모든 스텝을 돌리지만(결정적 시뮬레이션 등), 긴 정지 후에는 재실행하는 동안 멈추고 update()가 레이트를 따라가지 못하는 동안에는 프레임이 계속 길어진다"
related = ["getMaxUpdateSteps", "setIndependentFps", "runHeadlessApp", "Node::callEveryCatchUp"]

