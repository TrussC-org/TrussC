description.ko = "클라이언트 연결 시 발생"

["TcpServer::onClientDisconnect"]
description.en = "Fired when a client disconnects"
description.ja = "クライアント切断時に発火"
description.ko = "클라이언트 연결 해제 시 발생"

["TcpServer::onError"]
description.en = "Fired on a server or per-client error"
description.ja = "サーバまたはクライアント単位のエラー時に発火"
description.ko = "서버 또는 클라이언트별 오류 시 발생"
details.en = "Server-level failures (accept() failing, a thread that cannot be started for a new client) fire on the accept thread, at most once every 5 seconds for each kind while they persist; the log counts the ones in between. An inline listener there may call stop() but not start(); stop() there closes the listening socket and returns before the clients are disconnected, which the accept thread does once the listener returns. Listen with Deliver::Main when the listener touches app state."
details.ja = "サーバ単位の失敗（accept() の失敗、新しいクライアント用のスレッドが起動できない）は accept スレッドで発火し、続いている間は種類ごとに 5 秒に 1 回まで。その間の回数はログが数える。そこでのインラインリスナーは stop() を呼べるが start() は呼べない。そこでの stop() は待ち受けソケットを閉じ、クライアントが切断される前に戻る（切断はリスナーが戻った後に accept スレッドが行う）。リスナーがアプリの状態に触れるなら Deliver::Main で listen する。"
details.ko = "서버 단위 실패(accept() 실패, 새 클라이언트용 스레드를 시작할 수 없음)는 accept 스레드에서 발생하며, 지속되는 동안 종류별로 5초에 한 번까지다. 그 사이의 횟수는 로그가 센다. 그곳의 인라인 리스너는 stop()은 호출할 수 있지만 start()는 호출할 수 없다. 그곳에서의 stop()은 대기 소켓을 닫고 클라이언트 연결이 해제되기 전에 반환한다(연결 해제는 리스너가 반환된 뒤 accept 스레드가 수행한다). 리스너가 앱 상태를 건드린다면 Deliver::Main으로 listen한다."

["TcpServer::onReceive"]
description.en = "Fired when data is received from a client"
description.ja = "クライアントからのデータ受信時に発火"
description.ko = "클라이언트로부터 데이터 수신 시 발생"

["TcpServer::onSendComplete"]
description.en = "Fired when a queued send finishes, successfully or not"
description.ja = "キュー済みの送信が完了した時に発火（成功・失敗どちらも）"
description.ko = "큐에 든 전송이 완료되면 발생 (성공/실패 모두)"
keywords = ["async", "send", "complete", "event"]
related = ["TcpServer::sendAsync", "TcpSendCompleteEventArgs"]
details = "Fires exactly once for every id sendAsync() returned, including payloads still on the queue when the client is disconnected or the server stops. It runs on that client's writer thread, so listen with Deliver::Main when the listener touches app state."

["TcpServer::send"]
description.en = "Send data to a specific client (blocking)"
description.ja = "指定クライアントへ送信（ブロッキング）"
description.ko = "특정 클라이언트로 전송 (블로킹)"
details = "Returns once the payload has been handed to the kernel. Internally it is sendAsync() plus a wait on that one id, so sync and async sends to the same client stay in order and share one timeout; the payload is lent to the queue rather than copied. A peer that stops reading blocks this call alone, not other clients or the accept loop. Use setSendTimeout() to bound the wait, or sendAsync() not to wait at all."

["TcpServer::sendAsync"]
description.en = "Queue data for a client and return at once, without waiting for it to be written"
description.ja = "クライアント宛てのデータをキューに入れて即座に返る（書き込み完了を待たない）"
description.ko = "클라이언트로 보낼 데이터를 큐에 넣고 즉시 반환 (기록 완료를 기다리지 않음)"
keywords = ["async", "non-blocking", "queue", "backpressure", "draw loop"]
related = ["TcpServer::onSendComplete", "SendResult", "TcpServer::setSendAsyncBufferSize", "TcpServer::broadcastAsync"]
details = "What send() cannot do from a draw loop: a peer that has stopped reading makes send() wait, and the frame waits with it. sendAsync() copies (or, with the vector&& overload, takes) the payload and hands it to that client's queue, where a writer thread drains it. A falsy SendResult means nothing was queued and error says why — QueueFull is back-pressure, not a broken connection, and the client stays connected. Everything that IS queued reports through onSendComplete exactly once."

["TcpServer::setSendTimeout"]
description.en = "Set how long a send may stall without progress before giving up, in seconds (0 = wait indefinitely)"
description.ja = "送信が無通信のまま何秒まで待つかを設定（0 = 無制限に待つ）"
description.ko = "전송이 진척 없이 몇 초까지 대기할지 설정 (0 = 무제한 대기)"
keywords = ["timeout", "blocking", "send"]
details = "The timeout measures silence, not the duration of the send: it restarts every time bytes are accepted, so a peer that keeps draining never trips it however large the payload or slow the link. What it catches is a peer that has stopped reading. Defaults to 60 seconds — long enough that no healthy peer reaches it, short enough that a dead one cannot hold a send open forever; pass 0 to wait indefinitely instead. Applies to every send that starts after the call, on every client. A timeout that fires mid-payload leaves the stream truncated, so the client is disconnected rather than left open for the next send() to splice a fresh message onto a partial one — that completion reports SendError::Disconnected, because the client really has gone. One that fires having written nothing leaves the connection intact and reports SendError::Timeout instead, so a listener can tell a slow peer from a lost one without reading the error message."

["TcpServer::setSendAsyncBufferSize"]
description.en = "Set the high-water mark for one client's send queue, in bytes (0 = unlimited). Defaults to 16 MB"
description.ja = "クライアント1つあたりの送信キューの高水位マークを設定（バイト、0 = 無制限）。既定は16MB"
description.ko = "클라이언트 하나당 송신 큐의 high-water mark를 바이트로 설정 (0 = 무제한). 기본값 16MB"
keywords = ["backpressure", "queue", "limit", "async", "high-water mark"]
related = ["TcpServer::sendAsync", "TcpServer::getSendAsyncPendingBytes"]
details = "A mark, not a cap: sendAsync() is refused with QueueFull only when the queue ALREADY holds this much, so a single message of any size still goes through on an empty queue and there is no separate \"message too large\" case — the queue overshoots the mark by at most one message. A full queue does not disconnect anyone; only the idle timeout does. send() waits for room instead of failing, which is why QueueFull is something only sendAsync() can return. The 16 MB default is chosen so a frame streamer learns about back-pressure after a frame or two rather than after a large buffer of latency has piled up; raising it only delays that news."

["TcpServer::setReceiveBufferSize"]
description.en = "Set the receive buffer size"
description.ja = "受信バッファサイズを設定"
description.ko = "수신 버퍼 크기를 설정"

["TcpServer::start"]
description.en = "Start listening on a port. maxClients caps the connected clients (0 = unlimited, the default)"
description.ja = "ポートで待ち受けを開始。maxClients で同時接続数に上限を付ける（0 = 無制限、既定）"
description.ko = "포트에서 수신 대기를 시작. maxClients로 동시 접속 수를 제한 (0 = 무제한, 기본값)"
keywords = ["listen", "port", "max clients", "connection limit"]
details.en = "With maxClients above 0, a connection that arrives while that many clients are connected is closed right away and a warning is logged, at most once every few seconds however many arrive; a slot frees up as soon as a client disconnects. The default of 0 accepts any number of clients. The listen backlog is a fixed value and does not depend on maxClients. The receive and writer threads of clients that leave are joined while the server runs, and a failing accept() is retried with a short back-off rather than in a tight loop. start() calls stop() first, which also joins any thread a listener's stop() left running, and when a stop() on another thread is still tearing the previous session down (waiting for the previous accept thread to end, disconnecting the clients or joining their threads), it waits for that stop() to finish too, so none of it reaches the restarted server. It cannot be called from an inline listener on one of the server's own threads: on the accept thread (onClientConnect, and onError or onClientDisconnect for server-level failures) or on a client's receive or writer thread (onReceive, onSendComplete, onClientDisconnect, onError from those threads) it logs an error and returns false without stopping anything."
details.ja = "maxClients が 0 より大きい場合、その数のクライアントが接続している間に届いた接続はすぐに閉じられ、警告がログに出る（何件届いても数秒に 1 回まで）。クライアントが切断すればすぐに枠が空く。既定の 0 ではクライアント数に上限はない。listen のバックログは固定値で、maxClients には依存しない。去ったクライアントの受信スレッドと送信スレッドはサーバの動作中に join され、失敗した accept() は間を置かずに繰り返すのではなく、短いバックオフを挟んで再試行される。start() は最初に stop() を呼び（リスナーの stop() が残したスレッドもここで join される）、別のスレッドの stop() が前のセッションをまだ片付けている（前の accept スレッドの終了を待っている、クライアントを切断している、またはそのスレッドを join している）なら、その stop() が終わるまで待つので、片付けが再開後のサーバに及ぶことはない。サーバ自身のスレッド上のインラインリスナーからは呼べない。accept スレッド上（onClientConnect、およびサーバ単位の失敗での onError や onClientDisconnect）や、クライアントの受信スレッド・送信スレッド上（onReceive、onSendComplete、onClientDisconnect、それらのスレッドからの onError）では、エラーをログに出して false を返し、何も停止しない。"
details.ko = "maxClients가 0보다 크면, 그 수만큼의 클라이언트가 접속해 있는 동안 도착한 연결은 즉시 닫히고 경고가 로그에 남는다(몇 개가 도착하든 몇 초에 한 번까지). 클라이언트가 연결을 끊으면 곧바로 자리가 빈다. 기본값 0은 클라이언트 수를 제한하지 않는다. listen 백로그는 고정값이며 maxClients에 의존하지 않는다. 떠난 클라이언트의 수신 스레드와 송신 스레드는 서버가 동작하는 동안 join되며, 실패한 accept()는 쉴 새 없이 반복하지 않고 짧은 백오프를 두고 재시도된다. start()는 먼저 stop()을 호출하며(리스너의 stop()이 남긴 스레드도 여기서 join된다), 다른 스레드의 stop()이 이전 세션을 아직 정리하고 있다면(이전 accept 스레드의 종료를 기다리거나, 클라이언트 연결을 해제하거나, 그 스레드를 join하는 중이라면) 그 stop()이 끝날 때까지 기다리므로, 그 정리가 다시 시작된 서버에 미치지 않는다. 서버 자신의 스레드에서 실행되는 인라인 리스너에서는 호출할 수 없다. accept 스레드(onClientConnect, 그리고 서버 단위 실패에 대한 onError나 onClientDisconnect)나 클라이언트의 수신 스레드·송신 스레드(onReceive, onSendComplete, onClientDisconnect, 그 스레드들에서의 onError)에서는 오류를 로그에 남기고 false를 반환하며, 아무것도 정지하지 않는다."

["TcpServer::stop"]
description.en = "Stop the server"
description.ja = "サーバを停止"
description.ko = "서버를 정지"
details.en = "Returns once the accept thread and every client thread have ended and every client is disconnected; the destructor waits for all of them the same way. The server must not be destroyed from one of its own listeners (on the accept, receive or writer thread): destroy it from another thread, or after the listener has returned (for example from a Deliver::Main listener). When two threads call stop() at once, only one of them waits for the accept thread. It may be called from any listener: in an inline listener on one of the server's own threads it waits for no thread and returns at once, since such a thread may be waiting for the caller in turn. On a client's receive or writer thread (onReceive, onSendComplete, onClientDisconnect, onError from those threads) it disconnects every client first. On the accept thread (onClientConnect, and onError or onClientDisconnect for server-level failures) it closes the listening socket, and the accept thread disconnects the clients once the listener returns. The threads are joined by the next stop() or start() on another thread, or by the destructor. isRunning() is false as soon as stop() is called."
details.ja = "accept スレッドと全クライアントのスレッドが終わり、全クライアントが切断されてから戻る。デストラクタも同じようにそれらすべてを待つ。サーバ自身のリスナー（accept スレッド、受信スレッド、送信スレッド上）でサーバを破棄してはならない。別のスレッドから、またはリスナーが戻った後に（たとえば Deliver::Main のリスナーから）破棄する。2 つのスレッドが同時に stop() を呼んだ場合、accept スレッドを待つのはその一方だけ。どのリスナーからでも呼べる。サーバ自身のスレッド上のインラインリスナーでは、どのスレッドも待たずにすぐ戻る。そのスレッドが逆に呼び出し元を待っていることがあるからだ。クライアントの受信スレッド・送信スレッド上（onReceive、onSendComplete、onClientDisconnect、それらのスレッドからの onError）では、先に全クライアントを切断する。accept スレッド上（onClientConnect、およびサーバ単位の失敗での onError や onClientDisconnect）では待ち受けソケットを閉じ、クライアントの切断はリスナーが戻った後に accept スレッドが行う。スレッドは別のスレッドでの次の stop() か start()、またはデストラクタが join する。isRunning() は stop() が呼ばれた時点で false になる。"
details.ko = "accept 스레드와 모든 클라이언트 스레드가 끝나고 모든 클라이언트 연결이 해제된 뒤에 반환한다. 소멸자도 같은 방식으로 그 전부를 기다린다. 서버 자신의 리스너(accept 스레드, 수신 스레드, 송신 스레드)에서 서버를 파괴해서는 안 된다. 다른 스레드에서, 또는 리스너가 반환된 뒤에(예를 들어 Deliver::Main 리스너에서) 파괴한다. 두 스레드가 동시에 stop()을 호출하면 accept 스레드를 기다리는 것은 그중 하나뿐이다. 어떤 리스너에서든 호출할 수 있다. 서버 자신의 스레드에서 실행되는 인라인 리스너에서는 어떤 스레드도 기다리지 않고 바로 반환한다. 그 스레드가 반대로 호출한 쪽을 기다리고 있을 수 있기 때문이다. 클라이언트의 수신 스레드·송신 스레드(onReceive, onSendComplete, onClientDisconnect, 그 스레드들에서의 onError)에서는 먼저 모든 클라이언트 연결을 해제한다. accept 스레드(onClientConnect, 그리고 서버 단위 실패에 대한 onError나 onClientDisconnect)에서는 대기 소켓을 닫고, 클라이언트 연결 해제는 리스너가 반환된 뒤 accept 스레드가 수행한다. 스레드들은 다른 스레드에서의 다음 stop()이나 start(), 또는 소멸자가 join한다. isRunning()은 stop()이 호출된 시점에 false가 된다."

