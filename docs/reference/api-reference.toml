["getElapsedTime"]
category = "time_elapsed"
keywords = ["seconds", "uptime", "runtime", "clock"]
description.en = "Elapsed seconds (double) since program start, on a steady clock (system clock changes don't affect it). The same clock as getElapsedTimef/Millis/Micros: resetElapsedTimeCounter() restarts all of them, so the difference of two readings is only a duration if nothing resets the counter in between. Keeps full precision where getElapsedTimef() loses it after long uptimes"
description.ja = "プログラム開始からの経過秒（double）。steady clock なのでシステム時刻の変更の影響を受けない。getElapsedTimef/Millis/Micros と同じクロックで、resetElapsedTimeCounter() でこれら全てが0から数え直すので、2回の値の差が経過時間になるのは間にリセットがない場合だけ。長時間稼働で精度が落ちる getElapsedTimef() と違い、精度を保つ"
description.ko = "프로그램 시작 이후 경과 초(double). steady clock이라 시스템 시각 변경의 영향을 받지 않는다. getElapsedTimef/Millis/Micros와 같은 시계이며 resetElapsedTimeCounter()로 이들 모두가 0부터 다시 세므로, 두 값의 차이가 경과 시간이 되는 것은 그 사이에 리셋이 없을 때뿐이다. 장시간 가동에서 정밀도가 떨어지는 getElapsedTimef()와 달리 정밀도를 유지한다"
related = ["getElapsedTimef", "getFrameElapsedTime", "resetElapsedTimeCounter", "getElapsedTimeMillis", "getElapsedTimeMicros"]

