details.en = "Frame APIs return 0 or do nothing when the rate is unknown on every platform, sharing one warning per player instance across reloads. Unloaded players and this getter itself do not warn. Use getPosition()/setPosition() and getDuration() for time-based control. HapPlayer derives its average rate from the file's video sample count and duration."
details.ja = "全プラットフォームで、レートが不明ならフレーム API は 0 を返すか何もせず、再ロードをまたいでインスタンスごとに一度だけ警告する。未ロード時とこの getter 自体は警告しない。時間ベースの制御には getPosition()/setPosition() と getDuration() を使う。HapPlayer はファイルの動画サンプル数と長さから平均レートを求める。"
details.ko = "모든 플랫폼에서 레이트를 알 수 없으면 프레임 API는 0을 반환하거나 아무 작업도 하지 않으며, 다시 로드해도 인스턴스당 한 번만 경고한다. 로드되지 않은 플레이어와 이 getter 자체는 경고하지 않는다. 시간 기반 제어에는 getPosition()/setPosition()과 getDuration()을 사용한다. HapPlayer는 파일의 비디오 샘플 수와 길이로 평균 레이트를 계산한다."
related = ["VideoPlayer::getFrameRate", "VideoPlayerBase::getCurrentFrame", "VideoPlayerBase::setPosition"]

