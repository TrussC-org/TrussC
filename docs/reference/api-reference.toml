keywords = ["gpu", "buffer", "interop"]
description.en = "Number of vertices currently uploaded to the GPU vertex buffer. Pairs with getGpuVertexBuffer (e.g. as the draw count for a custom pipeline)."
description.ja = "現在 GPU 頂点バッファにアップロードされている頂点数。getGpuVertexBuffer と組で使う（自前パイプラインの描画頂点数など）。"
description.ko = "현재 GPU 정점 버퍼에 업로드된 정점 수. getGpuVertexBuffer와 짝으로 쓴다(커스텀 파이프라인의 드로우 정점 수 등)."
related = ["Mesh::uploadToGpu", "Mesh::getGpuVertexBuffer", "Mesh::getGpuIndexCount"]

