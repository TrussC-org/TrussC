description.ko = "OS가 이 윈도우를 보이지 않는 상태로 보고하는지 여부. true인 동안에는 프레임을 그리지 않음 (다시 보일 때까지 update/draw가 멈춤). macOS는 최소화·완전히 가려짐·다른 Space, Windows는 최소화 또는 DXGI가 occluded로 보고, Linux (X11)는 최소화 또는 완전히 가려짐 (컴포지팅 매니저가 없을 때). 닫힌 윈도우에서는 false"
