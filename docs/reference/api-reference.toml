description.ko = "형식을 명시해 메모리에서 raw interleaved PCM(16-bit signed 또는 32-bit float)을 로드. 미지원 비트 심도, 1 미만의 채널 수, 프레임 단위로 나누어떨어지지 않는 데이터 크기, 버퍼에 담을 수 없는 샘플 수에서는 false 반환"

