["OnceGate"]
category = "utility"
keywords = ["warn once", "log once", "once", "rate limit", "throttle", "suppress", "repeat", "deduplicate"]
description.en = "Gate for a log line (or anything else): isFirstTime() is true the first time, and with an interval, again once that much time has passed since the last true"
description.ja = "ログ出力などのゲート：isFirstTime() は初回だけ true。間隔を指定すると、前回 true からその時間が経つと再び true"
description.ko = "로그 출력 등의 게이트: isFirstTime()은 처음에만 true. 간격을 지정하면 마지막 true 이후 그 시간이 지나면 다시 true"
details.en = '''
`static OnceGate warned; if (warned.isFirstTime()) logWarning("Fbo") << "...";`
logs the warning only the first time. Pass an interval in seconds to the
constructor to make it true again once that much time has passed since the
last true: `static OnceGate underrun{5.0};` logs at most once per 5 seconds.
The gate object is the key: a `static` one per call site, or a member for
once per object (`class Foo { OnceGate notWaitedWarned_; };`). Works with any
log level, since the caller writes the line, and nothing is built while the
gate is closed. Thread-safe and lock-free: when several threads call it at
once, exactly one gets true. constexpr-constructible and trivially
destructible, so a `static` gate still works during static destruction. Not
copyable, not movable. Use it instead of a `static bool warned` flag.
'''
details.ja = '''
`static OnceGate warned; if (warned.isFirstTime()) logWarning("Fbo") << "...";`
で警告を初回だけ出す。コンストラクタに秒数の間隔を渡すと、前回 true を返して
からその時間が経つと再び true になる：`static OnceGate underrun{5.0};` は最大
5秒に1回だけ出す。ゲートのオブジェクトそのものがキーになる。呼び出し箇所ごとに
`static` で1つ置くか、オブジェクトごとに1回ならメンバにする
（`class Foo { OnceGate notWaitedWarned_; };`）。ログ行は呼び出し側が書くので
どのログレベルにも使え、ゲートが閉じている間は何も組み立てない。スレッドセーフ
でロックを使わない：複数スレッドが同時に呼んでも true を受け取るのはちょうど
1つ。constexpr で構築でき、デストラクタは trivial なので、`static` のゲートは
静的オブジェクトの破棄中でも使える。コピーもムーブもできない。`static bool
warned` フラグの代わりに使う。
'''
details.ko = '''
`static OnceGate warned; if (warned.isFirstTime()) logWarning("Fbo") << "...";`
로 경고를 처음 한 번만 출력한다. 생성자에 초 단위 간격을 넘기면 마지막으로
true를 반환한 뒤 그 시간이 지나면 다시 true가 된다: `static OnceGate underrun{5.0};`
는 최대 5초에 한 번 출력한다. 게이트 객체 자체가 키다. 호출 위치마다 `static`
으로 하나 두거나, 객체마다 한 번이면 멤버로 둔다
(`class Foo { OnceGate notWaitedWarned_; };`). 로그 줄은 호출 측이 쓰므로 어떤
로그 레벨에도 쓸 수 있고, 게이트가 닫혀 있는 동안은 아무것도 만들지 않는다.
스레드 안전하며 락을 쓰지 않는다: 여러 스레드가 동시에 호출해도 true를 받는
것은 정확히 하나. constexpr로 생성할 수 있고 소멸자가 trivial하므로 `static`
게이트는 정적 객체 소멸 중에도 쓸 수 있다. 복사도 이동도 할 수 없다.
`static bool warned` 플래그 대신 사용한다.
'''
related = ["OnceGate::isFirstTime", "logWarning", "logError"]

