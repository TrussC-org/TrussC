["Logger::setConsoleLogLevel"]
description.en = "Set the minimum console log level"
description.ja = "コンソールの最小ログレベルを設定"
description.ko = "콘솔 최소 로그 레벨을 설정"
details.en = '''
Lines below this level are not printed to the console (stdout / stderr; `os_log` on iOS, logcat on Android). Default Notice; `LogLevel::Silent` turns the console off. The levels of all outputs are explained under [`Logger`](#Logger).

```cpp
Logger& logger = getLogger();
logger.setLogLevel(LogLevel::Warning);       // console, file and system output: all Warning
logger.setFileLogLevel(LogLevel::Verbose);   // then only the file goes down to Verbose
logger.setSystemLogLevel(LogLevel::Silent);  // no OS log (os_log / OutputDebugString)
```
'''
details.ja = '''
このレベル未満の行はコンソール（stdout / stderr。iOS は `os_log`、Android は logcat）に出ない。既定は Notice、`LogLevel::Silent` でコンソール出力が止まる。各出力のレベルの全体像は [`Logger`](#Logger) を参照。

```cpp
Logger& logger = getLogger();
logger.setLogLevel(LogLevel::Warning);       // console, file and system output: all Warning
logger.setFileLogLevel(LogLevel::Verbose);   // then only the file goes down to Verbose
logger.setSystemLogLevel(LogLevel::Silent);  // no OS log (os_log / OutputDebugString)
```
'''
details.ko = '''
이 레벨 미만의 줄은 콘솔(stdout / stderr. iOS는 `os_log`, Android는 logcat)에 나오지 않는다. 기본값 Notice, `LogLevel::Silent`면 콘솔 출력이 꺼진다. 각 출력의 레벨 전체는 [`Logger`](#Logger) 참조.

```cpp
Logger& logger = getLogger();
logger.setLogLevel(LogLevel::Warning);       // console, file and system output: all Warning
logger.setFileLogLevel(LogLevel::Verbose);   // then only the file goes down to Verbose
logger.setSystemLogLevel(LogLevel::Silent);  // no OS log (os_log / OutputDebugString)
```
'''

