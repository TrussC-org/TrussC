["beginLines"]
category = "graphics_shapes"
keywords = ["batch", "segments", "line list", "multiple lines"]
description.en = "Begin batch line drawing. Add vertex pairs with vertex(), then call endLines(). Each pair of vertices draws one independent line segment. Use setColor() between vertices for per-line colors."
description.ja = "バッチ線描画を開始。vertex()で頂点ペアを追加し、endLines()で描画。2頂点で1本の独立した線分。setColor()で頂点ごとに色を変更可能"
description.ko = "배치 선 그리기 시작. vertex()로 정점 쌍을 추가한 뒤 endLines()를 호출. 각 정점 쌍이 독립적인 선분 하나를 그림. 정점 사이에 setColor()로 선마다 색상 지정 가능"
related = ["endLines", "drawLine", "setColor", "beginStroke", "beginShape"]
details.en = '''
`beginLines()` opens a buffer that draws **independent line segments**. Add
points with [`vertex`](#vertex); they are consumed **in pairs** — vertices 0–1
are one segment, 2–3 the next, and so on. Nothing is drawn until
[`endLines`](#endLines) is called, and a trailing odd vertex is ignored. At
least two vertices are required.

Each vertex captures the current draw color at the moment its `vertex()` is
called, so set the color **between** vertices for per-segment (even
per-endpoint, gradient) colors:

```cpp
beginLines();
setColor(colors::red);    vertex(20, 20);
setColor(colors::blue);   vertex(200, 80);   // segment 1: red → blue
setColor(colors::lime);   vertex(20, 120);
setColor(colors::yellow); vertex(200, 180);  // segment 2: lime → yellow
endLines();
```

These are thin (1px) lines. For thick lines with caps and joins use
[`beginStroke`](#beginStroke); for a connected outline (line strip) use
[`beginShape`](#beginShape) with [`noFill`](#noFill).
'''
details.ja = '''
`beginLines()` は**独立した線分**を描くバッファを開く。[`vertex`](#vertex) で点を
追加すると **2 つずつペア**で消費される — 頂点 0–1 が 1 本目、2–3 が 2 本目…という
具合。[`endLines`](#endLines) を呼ぶまで描画されず、余った奇数番目の頂点は無視される。
最低 2 頂点が必要。

各頂点は `vertex()` を呼んだ時点の描画色を取り込むので、頂点の**間**で色を変えると
線分ごと（さらには端点ごと＝グラデーション）に色を付けられる:

```cpp
beginLines();
setColor(colors::red);    vertex(20, 20);
setColor(colors::blue);   vertex(200, 80);   // 線分1: red → blue
setColor(colors::lime);   vertex(20, 120);
setColor(colors::yellow); vertex(200, 180);  // 線分2: lime → yellow
endLines();
```

これは細い（1px）線。太さ・cap・join 付きの線は [`beginStroke`](#beginStroke)、
連続した輪郭（line strip）は [`beginShape`](#beginShape) ＋ [`noFill`](#noFill) を使う。
'''
details.ko = '''
`beginLines()`는 **독립적인 선분**을 그리는 버퍼를 연다. [`vertex`](#vertex)로 점을
추가하면 **두 개씩 쌍으로** 소비된다 — 정점 0–1이 첫 선분, 2–3이 다음 선분… 식이다.
[`endLines`](#endLines)를 호출하기 전에는 그려지지 않으며, 남는 홀수 번째 정점은
무시된다. 최소 2개의 정점이 필요하다.

각 정점은 `vertex()`를 호출하는 시점의 그리기 색을 담으므로, 정점 **사이에서** 색을
바꾸면 선분마다(나아가 끝점마다 = 그라데이션) 색을 줄 수 있다:

```cpp
beginLines();
setColor(colors::red);    vertex(20, 20);
setColor(colors::blue);   vertex(200, 80);   // 선분1: red → blue
setColor(colors::lime);   vertex(20, 120);
setColor(colors::yellow); vertex(200, 180);  // 선분2: lime → yellow
endLines();
```

이것은 가는(1px) 선이다. 두께·cap·join이 있는 선은 [`beginStroke`](#beginStroke),
연결된 윤곽(line strip)은 [`beginShape`](#beginShape) + [`noFill`](#noFill)를 사용한다.
'''

["beginShadowPass"]
category = "graphics_lighting"
keywords = ["depth pass", "shadow map", "light view", "multi light"]
description.en = "Begin shadow depth pass from the light's point of view (up to 4 shadow lights per frame)"
description.ja = "light視点のshadow depth passを開始（1フレームに最大4灯まで）"
description.ko = "조명 시점의 섀도우 뎁스 패스를 시작 (프레임당 최대 4개 조명)"
related = ["Light", "endShadowPass", "shadowDraw", "addLight"]
details.en = '''
Run one `beginShadowPass(light)` / [`endShadowPass`](#endShadowPass) cycle per
shadow-casting light, before the PBR pass. Up to 4 lights can cast shadows in
the same frame — each pass renders into its own layer of a shared shadow map
array. Passes beyond the limit are ignored with a one-time warning. All
layers share one resolution: the largest requested via `enableShadow()`.
'''
details.ja = '''
shadowを落とすlightごとに `beginShadowPass(light)` /
[`endShadowPass`](#endShadowPass) のサイクルをPBRパスの前に1回ずつ実行する。
1フレームに最大4灯までshadowを落とせる（各パスは共有shadow map配列の
専用レイヤーに描画される）。上限を超えたパスは一度だけ警告を出して無視される。
解像度は全レイヤー共通で、`enableShadow()` で要求された最大値になる。
'''
details.ko = '''
섀도우를 드리우는 조명마다 `beginShadowPass(light)` /
[`endShadowPass`](#endShadowPass) 사이클을 PBR 패스 전에 한 번씩 실행한다.
한 프레임에 최대 4개 조명이 섀도우를 드리울 수 있으며, 각 패스는 공유 섀도우 맵
배열의 전용 레이어에 렌더링된다. 한도를 넘는 패스는 한 번만 경고를 내고
무시된다. 해상도는 모든 레이어가 공유하며 `enableShadow()`로 요청된 최댓값이 된다.
'''

["beginShape"]
category = "graphics_shapes"
keywords = ["polygon", "path", "custom shape", "outline", "ofbeginshape"]
of = ["ofBeginShape"]
description.en = "Begin drawing a shape"
description.ja = "図形の描画を開始"
description.ko = "도형 그리기 시작"
related = ["endShape", "vertex", "beginStroke", "beginLines"]
details.en = '''
`beginShape()` opens a vertex buffer. Add corners with [`vertex`](#vertex)
(2D or 3D), then call [`endShape`](#endShape) to draw the result. Pass
`endShape(true)` to close the outline (connect the last vertex back to the
first).

```cpp
// Filled triangle, outline closed
beginShape();
vertex(100, 100);
vertex(200, 100);
vertex(150, 200);
endShape(true);   // close = link last vertex back to the first
```

Toggle fill vs. outline with [`fill`](#fill) / [`noFill`](#noFill) before
`endShape()`. The fill is a triangle fan, so it only renders **convex**
shapes correctly — for concave or holed fills, build a [`Path`](#Path) and
call [`drawFill`](#Path::drawFill) instead. The stroke here is
a thin (1px) line strip; for thick lines with caps and joins use
[`beginStroke`](#beginStroke). Curve helpers like [`appendArc`](#appendArc)
and [`appendCurve`](#appendCurve) push curved runs into the same buffer.

The whole shape is a single color — the current draw color at the moment
[`endShape`](#endShape) is called; calling [`setColor`](#setColor) between
[`vertex`](#vertex) calls has no effect. For per-vertex colors or a gradient
fill, build a [`Mesh`](#Mesh) and set a color per vertex with
[`Mesh::addColor`](#Mesh::addColor) (or use [`beginLines`](#beginLines) for
per-segment line colors) instead.
'''
details.ja = '''
`beginShape()` は頂点バッファを開く。[`vertex`](#vertex)（2D / 3D）で角を
追加し、[`endShape`](#endShape) で描画する。`endShape(true)` を渡すと輪郭を
閉じる（最後の頂点を最初の頂点に接続する）。

```cpp
// 塗りつぶした三角形、輪郭を閉じる
beginShape();
vertex(100, 100);
vertex(200, 100);
vertex(150, 200);
endShape(true);   // close = 最後の頂点を最初の頂点に繋ぐ
```

塗り / 輪郭の切り替えは `endShape()` の前に [`fill`](#fill) /
[`noFill`](#noFill) で行う。塗りは triangle fan なので **凸形状** しか正しく
描けない。凹形状や穴あき形状を塗るなら [`Path`](#Path) を作って
`drawFill()` を呼ぶ。ここでの stroke は細い（1px）line strip なので、太さ・
cap・join を付けた線が欲しければ [`beginStroke`](#beginStroke) を使う。
[`appendArc`](#appendArc) や [`appendCurve`](#appendCurve) などの curve
ヘルパーで、同じバッファに曲線の頂点列を流し込める。

図形全体は単色で塗られる（色は [`endShape`](#endShape) を呼んだ時点の現在の
描画色）。[`vertex`](#vertex) の間で [`setColor`](#setColor) しても反映されない。
頂点ごとの色やグラデーション塗りが欲しいときは、[`Mesh`](#Mesh) を作って
[`Mesh::addColor`](#Mesh::addColor) で頂点ごとに色を付ける（線なら
[`beginLines`](#beginLines) で線分ごとに色を付けられる）。
'''
details.ko = '''
`beginShape()`는 정점 버퍼를 연다. [`vertex`](#vertex)(2D/3D)로 모서리를
추가한 뒤 [`endShape`](#endShape)로 그린다. `endShape(true)`를 전달하면
윤곽을 닫는다(마지막 정점을 첫 정점에 연결).

```cpp
// 채워진 삼각형, 윤곽 닫기
beginShape();
vertex(100, 100);
vertex(200, 100);
vertex(150, 200);
endShape(true);   // close = 마지막 정점을 첫 정점에 연결
```

채움/윤곽 전환은 `endShape()` 전에 [`fill`](#fill) / [`noFill`](#noFill)로
한다. 채움은 triangle fan이라 **볼록(convex)** 도형만 정확히 그린다. 오목하거나
구멍이 있는 도형을 채우려면 [`Path`](#Path)를 만들어 `drawFill()`을 호출한다.
여기서의 stroke는 가는(1px) line strip이므로, 두께·cap·join이 있는 선이
필요하면 [`beginStroke`](#beginStroke)를 사용한다. [`appendArc`](#appendArc),
[`appendCurve`](#appendCurve) 같은 curve 헬퍼로 같은 버퍼에 곡선 정점열을
넣을 수 있다.

도형 전체는 단색으로 칠해진다(색은 [`endShape`](#endShape)를 호출하는 시점의
현재 그리기 색). [`vertex`](#vertex) 사이에서 [`setColor`](#setColor)를 호출해도
반영되지 않는다. 정점별 색이나 그라데이션 채움이 필요하면 [`Mesh`](#Mesh)를 만들어
[`Mesh::addColor`](#Mesh::addColor)로 정점마다 색을 지정한다(선이라면
[`beginLines`](#beginLines)로 선분별 색을 줄 수 있다).
'''

["beginStroke"]
category = "graphics_shapes"
keywords = ["thick line", "polyline", "outline", "path"]
description.en = "Begin drawing a stroke (uses StrokeMesh internally)"
description.ja = "ストローク描画を開始（内部でStrokeMeshを使用）"
description.ko = "stroke 그리기 시작 (내부적으로 StrokeMesh 사용)"
related = ["endStroke", "vertex", "beginShape", "setStrokeWeight", "setStrokeCap", "setStrokeJoin"]
details.en = '''
Unlike [`beginShape`](#beginShape)'s thin 1px line strip, `beginStroke()`
builds a real triangle mesh with **width, end caps and corner joins** (a
`StrokeMesh` internally). Set the look with [`setStrokeWeight`](#setStrokeWeight),
[`setStrokeCap`](#setStrokeCap) and [`setStrokeJoin`](#setStrokeJoin) before
the vertices, add points with [`vertex`](#vertex), then [`endStroke`](#endStroke).

```cpp
setStrokeWeight(8);
setStrokeCap(StrokeCap::Round);
setStrokeJoin(StrokeJoin::Round);
beginStroke();
vertex(50, 50);
vertex(150, 80);
vertex(250, 50);
endStroke();        // open polyline; pass true to close it into a loop
```

Each `vertex()` snapshots the **current** stroke weight and color, so calling
[`setStrokeWeight`](#setStrokeWeight) / [`setColor`](#setColor) between
vertices produces a tapered or gradient stroke along one path.
'''
details.ja = '''
[`beginShape`](#beginShape) の細い 1px line strip と違い、`beginStroke()` は
**太さ・端点 cap・角 join** を持つ本物の triangle mesh を作る（内部的に
`StrokeMesh`）。見た目は頂点の前に [`setStrokeWeight`](#setStrokeWeight)、
[`setStrokeCap`](#setStrokeCap)、[`setStrokeJoin`](#setStrokeJoin) で設定し、
[`vertex`](#vertex) で点を追加して [`endStroke`](#endStroke) で閉じる。

```cpp
setStrokeWeight(8);
setStrokeCap(StrokeCap::Round);
setStrokeJoin(StrokeJoin::Round);
beginStroke();
vertex(50, 50);
vertex(150, 80);
vertex(250, 50);
endStroke();        // 開いた線。true を渡すとループとして閉じる
```

各 `vertex()` は **その時点の** stroke weight と color をスナップショットする。
そのため頂点の間で [`setStrokeWeight`](#setStrokeWeight) /
[`setColor`](#setColor) を変えると、1本の線の中で太さやグラデーションが
変化する stroke を作れる。
'''
details.ko = '''
[`beginShape`](#beginShape)의 가는 1px line strip과 달리 `beginStroke()`는
**두께·끝 cap·모서리 join**을 가진 진짜 triangle mesh를 만든다(내부적으로
`StrokeMesh`). 모양은 정점 전에 [`setStrokeWeight`](#setStrokeWeight),
[`setStrokeCap`](#setStrokeCap), [`setStrokeJoin`](#setStrokeJoin)로 설정하고,
[`vertex`](#vertex)로 점을 추가한 뒤 [`endStroke`](#endStroke)로 마친다.

```cpp
setStrokeWeight(8);
setStrokeCap(StrokeCap::Round);
setStrokeJoin(StrokeJoin::Round);
beginStroke();
vertex(50, 50);
vertex(150, 80);
vertex(250, 50);
endStroke();        // 열린 선; true를 전달하면 루프로 닫는다
```

각 `vertex()`는 **그 시점의** stroke weight와 color를 스냅샷한다. 그래서
정점 사이에서 [`setStrokeWeight`](#setStrokeWeight) / [`setColor`](#setColor)를
바꾸면 한 선 안에서 두께나 그라데이션이 변하는 stroke를 만들 수 있다.
'''

