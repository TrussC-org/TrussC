["Window::close"]
keywords = ["close window", "request", "frame boundary", "self close"]
description.en = "Close the native window; the main window and other windows keep running. A request, like exitApp() for the main window: it returns at once and the window closes at its backend's next safe point (after the current run-loop pass on Linux / Windows, after the next main-window tick on macOS), through the same path as its close button. Until then isOpen() is true and getApp() / App::getWindow() still return the App and the window. Safe to call from the window's own App (update() / draw() / keyPressed()). Destroying the Window (its last shared_ptr) still closes it immediately"
description.ja = "ウィンドウを閉じる。メインウィンドウや他のウィンドウは動き続ける。メインウィンドウの exitApp() と同じくリクエスト: すぐに戻り、ウィンドウはバックエンドの次の安全な時点 (Linux / Windows は今回のランループの後、macOS は次のメインウィンドウ tick の後) に、閉じるボタンと同じ経路で閉じる。それまで isOpen() は true で、getApp() / App::getWindow() は今の App とウィンドウを返す。ウィンドウ自身の App (update() / draw() / keyPressed()) から呼んでも安全。Window を破棄したとき (最後の shared_ptr) はその場で閉じる"
description.ko = "윈도우를 닫음. 메인 윈도우와 다른 윈도우는 계속 실행됨. 메인 윈도우의 exitApp() 처럼 요청이다: 바로 반환되고, 윈도우는 백엔드의 다음 안전한 시점 (Linux / Windows 는 이번 런 루프 이후, macOS 는 다음 메인 윈도우 tick 이후) 에 닫기 버튼과 같은 경로로 닫힌다. 그때까지 isOpen() 은 true 이고 getApp() / App::getWindow() 는 현재 App 과 윈도우를 반환한다. 윈도우 자신의 App (update() / draw() / keyPressed()) 에서 호출해도 안전하다. Window 를 파괴하면 (마지막 shared_ptr) 즉시 닫힌다"

