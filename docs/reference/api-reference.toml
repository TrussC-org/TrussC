["Serial::onDisconnect"]
keywords = ["unplug", "disconnect", "reconnect", "device lost", "disconnect event"]
description.en = "Event fired once per open connection when it ends: on a detected device loss (wasClean = false) or on close() of an open port (wasClean = true)"
description.ja = "開いた接続1つにつき1回、接続が終わったときに発火するイベント。デバイスの消失を検出したとき（wasClean = false）と、開いているポートを close() したとき（wasClean = true）"
description.ko = "열린 연결 하나당 한 번, 연결이 끝날 때 발생하는 이벤트. 장치 소실을 감지했을 때(wasClean = false)와 열린 포트를 close()했을 때(wasClean = true)"
related = ["SerialDisconnectEventArgs", "Serial::isConnected", "Serial::close", "Serial::setup", "TcpClient::onDisconnect", "Deliver"]
details.en = '''
It fires for two reasons, each once per open connection:

- **Loss** (`wasClean = false`): [`available()`](#Serial::available),
  [`readBytes()`](#Serial::readBytes), [`readByte()`](#Serial::readByte) or
  [`writeBytes()`](#Serial::writeBytes) found the device gone. `reason` is the
  text of the warning they log, such as `"read: Input/output error"` or
  `"hangup"`.
- **Close** (`wasClean = true`): [`close()`](#Serial::close) closed an open
  port, directly or through [`setup()`](#Serial::setup), which closes the
  previous port first. `reason` is `"closed by close()"`.

`close()` on a port that is not open does not fire. Destroying a `Serial`, or
move-assigning another one over it, closes the port without firing, so a
listener never runs from a destructor. Neither does `setup()` when it closes a
port that a listener or another thread opened while it was closing the
previous one; it logs a warning instead.

Only those four I/O calls find a loss. A device that went away before
`close()` or `setup()` without one of them noticing ends as a close
(`wasClean = true`, `"closed by close()"`): the app ended the connection. On
Android, where the USB worker thread may have found the loss already, the
reason then goes on with `(the device had already been lost: <reason>)`, still
with `wasClean = true`.

**Thread.** It fires inline on the thread that made the call, normally the main
thread, after the call has released the `Serial`'s lock. On Android the USB
worker thread finds the loss but only records it: the event fires from the
next `available()`, `readBytes()`, `readByte()`, `writeBytes()`, `close()` or
`setup()` call on the app's thread, and `isConnected()` stays true until then.
A listener that must run on the main thread whichever thread uses the `Serial`
passes `Deliver::Main`: `serial.onDisconnect.listen(fn, Deliver::Main)`.

**Reconnecting.** When a listener runs, the port of the connection that ended
is closed and the lock is free, so a listener may call
`setup(e.portName, e.baudRate)`. Check `wasClean` first, or every `close()`
reopens the port. The call that found the loss still returns its error value
(`available()` returns 0) and leaves the new connection alone. Another thread
may call `setup()` in the meantime, so an app that also connects from other
threads checks `isConnected()` / `getDevicePath()` in the listener before it
reconnects.

```cpp
listener = serial.onDisconnect.listen([this](SerialDisconnectEventArgs& e) {
    logNotice() << e.portName << " (" << e.baudRate << " baud) closed: " << e.reason;
    if (!e.wasClean && !serial.setup(e.portName, e.baudRate)) {
        needReconnect = true;  // not back yet: retry from update()
    }
});
```

Listeners belong to the `Serial` they were added to; moving a `Serial` does not
carry them over.
'''
details.ja = '''
次の2つの理由で、それぞれ開いた接続1つにつき1回発火する。

- **消失**（`wasClean = false`）: [`available()`](#Serial::available)、
  [`readBytes()`](#Serial::readBytes)、[`readByte()`](#Serial::readByte)、
  [`writeBytes()`](#Serial::writeBytes) がデバイスの消失を見つけた。`reason` は
  それらがログに出す警告と同じ文字列で、`"read: Input/output error"` や
  `"hangup"` など。
- **クローズ**（`wasClean = true`）: [`close()`](#Serial::close) が開いている
  ポートを閉じた。直接の呼び出しでも、前のポートを先に閉じる
  [`setup()`](#Serial::setup) 経由でもよい。`reason` は `"closed by close()"`。

開いていないポートへの `close()` では発火しない。`Serial` の破棄や、別の `Serial`
のムーブ代入でもポートは閉じるが発火しないので、リスナーがデストラクタから
呼ばれることはない。`setup()` が前のポートを閉じている間にリスナーや別のスレッドが
開いたポートを、`setup()` が閉じるときも発火しない（代わりに警告をログに出す）。

消失を見つけるのは上の4つの I/O 呼び出しだけ。それらが気づかないうちに抜けた
デバイスを `close()` や `setup()` で閉じた場合は、クローズとして終わる
（`wasClean = true`、`"closed by close()"`）。接続を終えたのはアプリだから。
Android では USB ワーカースレッドがすでに消失を見つけていることがあり、その場合は
reason の後ろに `(the device had already been lost: <理由>)` が付く。
`wasClean` はこの場合も true。

**スレッド。** その呼び出しを行ったスレッドで、呼び出しが `Serial` のロックを
外した後にインラインで発火する（通常はメインスレッド）。Android では USB
ワーカースレッドが消失を見つけるが、記録するだけで、アプリのスレッドでの次の
`available()`、`readBytes()`、`readByte()`、`writeBytes()`、`close()`、`setup()` の
呼び出しから発火する。それまでは `isConnected()` も true のまま。`Serial` を
どのスレッドから使っていてもメインスレッドで動く必要のあるリスナーは
`Deliver::Main` を渡す: `serial.onDisconnect.listen(fn, Deliver::Main)`。

**再接続。** リスナーが呼ばれる時点で、終わった接続のポートは閉じていて、ロックも
外れているので、リスナーから `setup(e.portName, e.baudRate)` を呼んでよい。先に
`wasClean` を確認すること。そうしないと `close()` のたびにポートが開き直される。
消失を見つけた呼び出しは、それでも通常のエラー値を返し（`available()` は 0）、
新しい接続には手を触れない。その間に別のスレッドが `setup()` を呼ぶこともあるので、
ほかのスレッドからも接続するアプリは、再接続の前にリスナーの中で `isConnected()` /
`getDevicePath()` を確かめること。

```cpp
listener = serial.onDisconnect.listen([this](SerialDisconnectEventArgs& e) {
    logNotice() << e.portName << " (" << e.baudRate << " baud) closed: " << e.reason;
    if (!e.wasClean && !serial.setup(e.portName, e.baudRate)) {
        needReconnect = true;  // not back yet: retry from update()
    }
});
```

リスナーは追加した `Serial` に属し、`Serial` をムーブしても引き継がれない。
'''
details.ko = '''
다음 두 가지 이유로, 각각 열린 연결 하나당 한 번 발생한다.

- **소실**(`wasClean = false`): [`available()`](#Serial::available),
  [`readBytes()`](#Serial::readBytes), [`readByte()`](#Serial::readByte),
  [`writeBytes()`](#Serial::writeBytes)가 장치 소실을 발견했다. `reason`은
  이들이 로그로 남기는 경고와 같은 문자열로, `"read: Input/output error"`나
  `"hangup"` 등이다.
- **닫기**(`wasClean = true`): [`close()`](#Serial::close)가 열린 포트를 닫았다.
  직접 호출이든, 이전 포트를 먼저 닫는 [`setup()`](#Serial::setup)을 거친
  것이든 같다. `reason`은 `"closed by close()"`이다.

열려 있지 않은 포트에 대한 `close()`는 발생하지 않는다. `Serial`을 파괴하거나
다른 `Serial`을 이동 대입해도 포트는 닫히지만 발생하지 않으므로, 리스너가
소멸자에서 실행되는 일은 없다. `setup()`이 이전 포트를 닫는 동안 리스너나 다른
스레드가 연 포트를 `setup()`이 닫을 때도 발생하지 않는다(대신 경고를 로그로 남긴다).

소실을 찾는 것은 위의 네 I/O 호출뿐이다. 이들이 알아채기 전에 분리된 장치를
`close()`나 `setup()`으로 닫으면 닫기로 끝난다(`wasClean = true`,
`"closed by close()"`). 연결을 끝낸 것은 앱이기 때문이다. Android에서는 USB 워커
스레드가 이미 소실을 찾았을 수 있으며, 그때는 reason 뒤에
`(the device had already been lost: <사유>)`가 붙는다. 이 경우에도 `wasClean`은
true이다.

**스레드.** 그 호출을 한 스레드에서, 호출이 `Serial`의 락을 놓은 뒤에 인라인으로
발생한다(보통 메인 스레드). Android에서는 USB 워커 스레드가 소실을 찾지만 기록만
하며, 앱 스레드에서의 다음 `available()`, `readBytes()`, `readByte()`,
`writeBytes()`, `close()`, `setup()` 호출에서 발생한다. 그때까지는
`isConnected()`도 true로 남는다. `Serial`을 어느 스레드에서 쓰든 메인 스레드에서
실행되어야 하는 리스너는 `Deliver::Main`을 넘긴다:
`serial.onDisconnect.listen(fn, Deliver::Main)`.

**재연결.** 리스너가 실행될 때 끝난 연결의 포트는 닫혀 있고 락도 풀려 있으므로,
리스너에서 `setup(e.portName, e.baudRate)`를 호출해도 된다. 먼저 `wasClean`을
확인할 것. 그렇지 않으면 `close()`할 때마다 포트가 다시 열린다. 소실을 발견한
호출은 그래도 평소의 오류 값을 반환하며(`available()`은 0), 새 연결은 건드리지
않는다. 그 사이에 다른 스레드가 `setup()`을 호출할 수도 있으므로, 다른
스레드에서도 연결하는 앱은 재연결하기 전에 리스너 안에서 `isConnected()` /
`getDevicePath()`를 확인할 것.

```cpp
listener = serial.onDisconnect.listen([this](SerialDisconnectEventArgs& e) {
    logNotice() << e.portName << " (" << e.baudRate << " baud) closed: " << e.reason;
    if (!e.wasClean && !serial.setup(e.portName, e.baudRate)) {
        needReconnect = true;  // not back yet: retry from update()
    }
});
```

리스너는 추가한 `Serial`에 속하며, `Serial`을 이동해도 넘어가지 않는다.
'''

