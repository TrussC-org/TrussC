["enableDepthTest"]
category = "graphics_style"
keywords = ["depth", "z-buffer", "occlusion", "3d", "blend", "restore"]
description.en = "Re-enable depth test/write on the blend pipelines (compare LESS_EQUAL + depth write, same as the 3D pipeline). Use to restore depth after setBlendMode() mid-scene; persists like the blend mode (across frames and Fbo passes) until disableDepthTest()"
description.ja = "ブレンドパイプラインのデプステスト/書き込みを再有効化（LESS_EQUAL比較+デプス書き込み、3Dパイプラインと同じ設定）。シーン途中の setBlendMode() 後にデプスを復元するために使う。ブレンドモードと同様にフレームやFboパスをまたいで disableDepthTest() まで持続する"
description.ko = "블렌드 파이프라인의 깊이 테스트/쓰기를 다시 활성화 (LESS_EQUAL 비교 + 깊이 쓰기, 3D 파이프라인과 동일한 설정). 씬 도중 setBlendMode() 이후 깊이를 복원할 때 사용. 블렌드 모드처럼 프레임과 Fbo 패스를 넘어 disableDepthTest()까지 유지됨"
details = '''
Every setBlendMode() pipeline (Alpha, Add, even Disabled) normally has depth write/test OFF;
only the 3D pipeline (screen setup / EasyCam::begin()) writes depth. Changing the blend mode
inside a 3D scene therefore drops depth testing for everything drawn after it. enableDepthTest()
restores it without starting a new camera scope:

    cam.begin();
    drawSolidGeometry();              // depth-tested (3D pipeline)
    setBlendMode(BlendMode::Add);
    drawGlowEffects();                // additive, no depth by default
    resetBlendMode();
    enableDepthTest();
    drawMoreSolidGeometry();          // depth-tested again, correctly occluded
    cam.end();
    disableDepthTest();               // back to default before 2D overlays
'''
related = ["disableDepthTest", "isDepthTestEnabled", "setBlendMode"]

