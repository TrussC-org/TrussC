description.en = "Engine health snapshot (AudioStats): plays dropped since startup, in total and by reason; stream underrun frames, stalled callbacks and voices stopped by re-init; hard-clipped output samples; master peak / RMS; audio-thread CPU usage. Reads atomics and a steady clock, so it is cheap from any thread. The tc_get_audio_state MCP tool reports the same numbers."
description.ja = "エンジンの健全性スナップショット (AudioStats): 起動以降に捨てた再生の総数と理由別の数、ストリームの underrun フレーム数、コールバックの停止状態、再初期化で停止した再生数、クリップした出力サンプル数、マスターの peak / RMS、オーディオスレッドの CPU 使用率。atomic と単調時計を読むので、どのスレッドからでも軽い。MCP ツール tc_get_audio_state も同じ値を返す"
description.ko = "엔진 상태 스냅샷 (AudioStats): 시작 이후 버려진 재생의 총수와 이유별 수, 스트림 underrun 프레임 수, 콜백 정지 상태, 재초기화로 정지한 재생 수, 클리핑된 출력 샘플 수, 마스터 peak / RMS, 오디오 스레드 CPU 사용률. atomic 과 단조 시계를 읽으므로 어느 스레드에서든 가볍다. MCP 도구 tc_get_audio_state 도 같은 값을 보고한다"
related = ["AudioStats", "AudioEngine::getPlayingSounds", "Sound::play"]

["AudioEngine::init"]
category = "audioengine"
keywords = ["initialize", "start", "open", "device", "setup"]
description.en = "Initialize the engine, or re-initialize it with an AudioSettings override. init(settings) keeps the sample rate, channels, buffer size and polyphony even when it fails; init() with no arguments reuses the last ones (the defaults if init(settings) was never called) but always opens the system default device on AudioBackend::Default. Re-init on a running engine migrates active voices to the new settings. miniaudio reaches Null only when no real backend context can be created; if a context opens but its device cannot, init() returns false without switching backend. Set AudioSettings::backend = AudioBackend::Null for intentional silent operation (one Notice per init). getStats() retains the last init failure until a successful init. Returns true on success, false when no output device can be opened; the failure is logged through logError(\"AudioEngine\") with the requested device name. A failed re-init leaves the engine stopped: the running device is closed before the new one is tried. It may be called again later; each failed try opens the device and logs again, so retry on a timer (about once a second) or on a user action, not every frame. Sound::load*() calls init() while the engine is not initialized, so after a failed init(settings) it opens the system default device with those settings; call init(settings) again before loading sounds if you want the requested device."
description.ja = "エンジンを初期化する、または AudioSettings の上書きで再初期化する。init(settings) はサンプルレート、チャンネル、バッファサイズ、ポリフォニーを失敗しても保持し、引数なしの init() は直前のそれらを再利用する (init(settings) を一度も呼んでいなければデフォルト) が、バックエンドは常に AudioBackend::Default、デバイスはシステム既定を開く。動作中のエンジンで再初期化するとアクティブなボイスを新設定へ移行する。miniaudio が Null に到達するのは実バックエンドのコンテキストを作れない場合だけ。コンテキストが開いてもデバイスを開けなければ、バックエンドを切り替えず false を返す。意図的に無音で動かすには AudioSettings::backend = AudioBackend::Null を指定する (init ごとに Notice を 1 回)。getStats() は次の初期化成功まで最後の失敗を保持する。成功時 true、出力デバイスを開けないときは false を返す。失敗は要求したデバイス名とともに logError(\"AudioEngine\") でログに出る。再初期化が失敗するとエンジンは止まったままになる (新しいデバイスを試す前に動作中のデバイスを閉じるため)。後からもう一度呼んでよいが、失敗するたびにデバイスを開き直してログを出すので、毎フレームではなくタイマー (1 秒に 1 回程度) やユーザー操作で再試行すること。Sound::load*() はエンジンが未初期化なら init() を呼ぶので、init(settings) が失敗した後はその設定でシステム既定のデバイスが開かれる。要求したデバイスを使いたいならサウンドを読み込む前に init(settings) を呼び直すこと"
description.ko = "엔진을 초기화하거나 AudioSettings 오버라이드로 재초기화. init(settings) 는 샘플레이트, 채널, 버퍼 크기, 폴리포니를 실패해도 유지하고, 인수 없는 init() 은 마지막 값을 재사용하지만 (init(settings) 를 호출한 적이 없으면 기본값) 백엔드는 항상 AudioBackend::Default이며 시스템 기본 디바이스를 연다. 동작 중인 엔진에서 재초기화하면 활성 보이스를 새 설정으로 이전한다. miniaudio 는 실제 백엔드 컨텍스트를 만들 수 없을 때만 Null 에 도달한다. 컨텍스트가 열려도 디바이스를 열 수 없으면 백엔드를 바꾸지 않고 false 를 반환한다. 의도적인 무음 실행에는 AudioSettings::backend = AudioBackend::Null 을 지정한다 (init 마다 Notice 한 번). getStats() 는 다음 초기화 성공까지 마지막 실패를 유지한다. 성공 시 true, 출력 디바이스를 열 수 없으면 false 반환. 실패는 요청한 디바이스 이름과 함께 logError(\"AudioEngine\") 로 로그에 남는다. 재초기화가 실패하면 엔진은 멈춘 상태로 남는다 (새 디바이스를 시도하기 전에 동작 중인 디바이스를 닫기 때문). 나중에 다시 호출해도 되지만, 실패할 때마다 디바이스를 다시 열고 로그를 남기므로 매 프레임이 아니라 타이머(1초에 한 번 정도)나 사용자 조작으로 재시도할 것. Sound::load*() 는 엔진이 초기화되지 않았으면 init() 을 호출하므로, init(settings) 가 실패한 뒤에는 그 설정으로 시스템 기본 디바이스가 열린다. 요청한 디바이스를 쓰려면 사운드를 로드하기 전에 init(settings) 를 다시 호출할 것"
related = ["AudioSettings", "AudioEngine::audioDeviceChanged"]

