["Thread::waitForThread"]
description.en = "Wait (join) for the thread to finish. If callStopThread is true (default), calls stopThread() first. A subclass must call it in its own destructor. Never call it on the thread itself (e.g. from a destructor that runs inside threadedFunction()): joining itself throws std::system_error."
description.ja = "スレッドの終了を待つ（join）。callStopThread が true（デフォルト）なら先に stopThread() を呼ぶ。サブクラスは自分のデストラクタで必ずこれを呼ぶ。そのスレッド自身からは呼ばないこと（例: threadedFunction() の中で走るデストラクタ）: 自分自身の join は std::system_error を投げる"
description.ko = "스레드 종료를 대기(join). callStopThread가 true(기본값)이면 먼저 stopThread()를 호출. 서브클래스는 자신의 소멸자에서 반드시 이를 호출해야 함. 해당 스레드 자신에서는 호출하지 말 것(예: threadedFunction() 안에서 실행되는 소멸자): 자기 자신을 join하면 std::system_error를 던짐"

