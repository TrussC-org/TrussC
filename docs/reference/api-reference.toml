["getFrameElapsedTime"]
category = "time_elapsed"
keywords = ["time", "seconds", "animation", "per frame", "consistent", "clock"]
description.en = "Elapsed seconds (double) sampled once at the start of the current frame, so every update step and the draw of one frame see the same value (getElapsedTime() moves during the frame). Same clock and reset as getElapsedTime(). Sampled by the main loop and runHeadlessApp; in a secondary window it currently returns the live getElapsedTime()"
description.ja = "現在のフレーム開始時に1回だけ取った経過秒（double）。1フレーム内の全 update ステップと draw が同じ値を見る（getElapsedTime() はフレーム中も進む）。クロックとリセットは getElapsedTime() と同じ。メインループと runHeadlessApp が取得する。サブウィンドウでは今のところ getElapsedTime() の現在値を返す"
description.ko = "현재 프레임 시작 시 한 번만 샘플링한 경과 초(double). 한 프레임 안의 모든 update 스텝과 draw가 같은 값을 본다(getElapsedTime()은 프레임 중에도 진행). 시계와 리셋은 getElapsedTime()과 같다. 메인 루프와 runHeadlessApp이 샘플링한다. 보조 윈도우에서는 지금은 getElapsedTime()의 현재 값을 반환한다"
related = ["getElapsedTime", "getDeltaTime", "resetElapsedTimeCounter"]

["getFrameRate"]
category = "time_frame"
keywords = ["fps", "framerate", "speed", "refresh", "performance"]
of = ["ofGetFrameRate"]
description.en = "Measured update rate (updates per second over the last 10 frames). In fixed-Hz update mode and runHeadlessApp this is the measured rate, not the configured one: the fixed steps are counted by the time they consumed, so it reads steady when the rate isn't a multiple of the frame rate and drops when time is dropped. Recorded by the main loop and runHeadlessApp; in a secondary window each call currently adds the window's last delta and returns the average of the last 10 calls, so reading it once per second gives a ~10 s average"
description.ja = "実測の update レート（直近10フレームの1秒あたり update 回数）。固定Hz update モードと runHeadlessApp でも設定値ではなく実測値。固定ステップは消費した時間で数えるので、フレームレートの整数倍でないレートでも値が揺れず、時間が捨てられると下がる。メインループと runHeadlessApp が記録する。サブウィンドウでは今のところ、呼ぶたびにそのウィンドウの直近の delta を加えて直近10回の呼び出しの平均を返すので、1秒に1回読むと約10秒の平均になる"
description.ko = "실측 update 레이트(최근 10프레임의 초당 update 횟수). 고정 Hz update 모드와 runHeadlessApp에서도 설정값이 아닌 실측값. 고정 스텝은 소비한 시간으로 세므로 프레임레이트의 정수배가 아닌 레이트에서도 값이 흔들리지 않고, 시간이 버려지면 내려간다. 메인 루프와 runHeadlessApp이 기록한다. 보조 윈도우에서는 지금은 호출할 때마다 그 윈도우의 최근 delta를 더해 최근 10회 호출의 평균을 반환하므로, 1초에 한 번 읽으면 약 10초의 평균이 된다"
related = ["getFps", "getDeltaTime", "getFpsSettings"]

