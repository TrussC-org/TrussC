["TcpClient::notifyError"]
description.en = "Report an error (message + code) from a derived class."
description.ja = "派生クラスからエラー（メッセージ＋コード）を通知する。"
description.ko = "파생 클래스에서 에러(메시지 + 코드)를 통지한다."

["TcpClient::processNetworkStep"]
description.en = "processNetwork()'s work for derived classes and the receive thread. Returns false when the calling thread must stop without reading the client again: it reported the end of the connection, or a listener destroyed the client."
description.ja = "processNetwork() の処理本体（派生クラスと受信スレッド用）。呼び出し側スレッドがクライアントに二度と触れずに止まるべきとき false を返す: 接続の終了を通知した場合、またはリスナーがクライアントを破棄した場合。"
description.ko = "processNetwork()의 처리 본체(파생 클래스와 수신 스레드용). 호출한 스레드가 클라이언트를 다시 읽지 않고 멈춰야 할 때 false를 반환한다: 연결 종료를 통지했거나 리스너가 클라이언트를 파괴한 경우."
keywords = ["receive thread", "destroy", "listener", "lifetime"]

["ChipSoundBundle::Entry::note"]
description.en = "The chip-synth note for this bundle entry."
description.ja = "このバンドルエントリのチップシンセノート。"
description.ko = "이 번들 엔트리의 칩 신스 노트."

["ChipSoundBundle::Entry::time"]
description.en = "Start time of this note in seconds."
description.ja = "このノートの開始時刻（秒）。"
description.ko = "이 노트의 시작 시각(초)."

["Node::localMatrixChanged"]
description.en = "Event fired when this node's local matrix changes."
description.ja = "このノードのローカル行列が変化したときに発火するイベント。"
description.ko = "이 노드의 로컬 행렬이 변경될 때 발생하는 이벤트."

["Node::resolvePickRay"]
description.en = "Resolve this node's effective camera context and the global ray to hit-test it with."
description.ja = "このノードの有効なカメラコンテキストと、ヒットテストに使うグローバルレイを解決する。"
description.ko = "이 노드의 유효 카메라 컨텍스트와 히트 테스트에 쓸 글로벌 레이를 결정한다."

["Node::findHitNodeRecursive"]
description.en = "Recursive hit test in reverse draw order; override for clipping-aware picking."
description.ja = "描画逆順での再帰的ヒットテスト。クリッピング対応のためオーバーライドする。"
description.ko = "그리기 역순으로 재귀 히트 테스트. 클리핑 대응을 위해 재정의한다."

["Node::beginDraw"]
description.en = "Hook called before draw() and drawChildren(); override for clipping etc."
description.ja = "draw() と drawChildren() の前に呼ばれるフック。クリッピング等のためにオーバーライドする。"
description.ko = "draw()와 drawChildren() 전에 호출되는 훅. 클리핑 등을 위해 재정의한다."

["Node::endDraw"]
description.en = "Hook called after draw() and drawChildren()."
description.ja = "draw() と drawChildren() の後に呼ばれるフック。"
description.ko = "draw()와 drawChildren() 후에 호출되는 훅."

["Node::drawChildren"]
description.en = "Draw the child nodes (overridable, e.g. for clipping)."
description.ja = "子ノードを描画する（クリッピング等のためオーバーライド可能）。"
description.ko = "자식 노드를 그린다(클리핑 등을 위해 재정의 가능)."

["Node::hitTest"]
description.en = "Geometric hit-test predicate in local space; override to make a node pickable."
description.ja = "ローカル空間での幾何ヒットテスト述語。ノードをピック可能にするためオーバーライドする。"
description.ko = "로컬 공간 기하 히트 테스트 술어. 노드를 선택 가능하게 하려면 재정의한다."

["Node::onMousePress"]
description.en = "Handle a mouse press (event localized to this node); return true to consume."
description.ja = "マウス押下を処理する（イベントはこのノードにローカル化）。消費するなら true を返す。"
description.ko = "마우스 누름을 처리한다(이벤트는 이 노드에 로컬화). 소비하려면 true 반환."

["Node::onMouseRelease"]
description.en = "Handle a mouse release (event localized to this node); return true to consume."
description.ja = "マウス離しを処理する（イベントはこのノードにローカル化）。消費するなら true を返す。"
description.ko = "마우스 뗌을 처리한다(이벤트는 이 노드에 로컬화). 소비하려면 true 반환."

["Node::onMouseMove"]
description.en = "Handle mouse movement (event localized to this node); return true to consume."
description.ja = "マウス移動を処理する（イベントはこのノードにローカル化）。消費するなら true を返す。"
description.ko = "마우스 이동을 처리한다(이벤트는 이 노드에 로컬화). 소비하려면 true 반환."

["Node::onMouseDrag"]
description.en = "Handle a mouse drag (event localized to this node); return true to consume."
description.ja = "マウスドラッグを処理する（イベントはこのノードにローカル化）。消費するなら true を返す。"
description.ko = "마우스 드래그를 처리한다(이벤트는 이 노드에 로컬화). 소비하려면 true 반환."

["Node::onMouseScroll"]
description.en = "Handle a scroll event (event localized to this node); return true to consume."
description.ja = "スクロールイベントを処理する（イベントはこのノードにローカル化）。消費するなら true を返す。"
description.ko = "스크롤 이벤트를 처리한다(이벤트는 이 노드에 로컬화). 소비하려면 true 반환."

["Node::onKeyPress"]
description.en = "Handle a key press (broadcast to all nodes); return true to consume."
description.ja = "キー押下を処理する（全ノードへブロードキャスト）。消費するなら true を返す。"
description.ko = "키 누름을 처리한다(모든 노드에 브로드캐스트). 소비하려면 true 반환."

["Node::onKeyRelease"]
description.en = "Handle a key release (broadcast to all nodes); return true to consume."
description.ja = "キー離しを処理する（全ノードへブロードキャスト）。消費するなら true を返す。"
description.ko = "키 뗌을 처리한다(모든 노드에 브로드캐스트). 소비하려면 true 반환."

["Node::onMouseEnter"]
description.en = "Hook called when the pointer enters this node (hover begins)."
description.ja = "ポインタがこのノードに入ったとき（ホバー開始）に呼ばれるフック。"
description.ko = "포인터가 이 노드에 들어올 때(호버 시작) 호출되는 훅."

["Node::onMouseLeave"]
description.en = "Hook called when the pointer leaves this node (hover ends)."
description.ja = "ポインタがこのノードから出たとき（ホバー終了）に呼ばれるフック。"
description.ko = "포인터가 이 노드를 벗어날 때(호버 종료) 호출되는 훅."

["Node::onActiveChanged"]
description.en = "Callback invoked when the node's active state changes."
description.ja = "ノードのアクティブ状態が変化したときに呼ばれるコールバック。"
description.ko = "노드의 활성 상태가 변경될 때 호출되는 콜백."

["Node::onVisibleChanged"]
description.en = "Callback invoked when the node's visible state changes."
description.ja = "ノードの可視状態が変化したときに呼ばれるコールバック。"
description.ko = "노드의 표시 상태가 변경될 때 호출되는 콜백."

["Node::onLocalMatrixChanged"]
description.en = "Hook for custom behavior when the local matrix changes."
description.ja = "ローカル行列が変化したときのカスタム処理用フック。"
description.ko = "로컬 행렬이 변경될 때의 사용자 동작용 훅."

["Node::processTimers"]
description.en = "Count this node's timers (callAfter / callEvery) down by getDeltaTime() and fire the due ones, invoked within the update pass."
description.ja = "このノードのタイマー（callAfter / callEvery）を getDeltaTime() 分カウントダウンし、期限の来たものを実行する。更新パス内で呼ばれる。"
description.ko = "이 노드의 타이머(callAfter / callEvery)를 getDeltaTime()만큼 카운트다운하고 만기된 것을 실행한다. 업데이트 패스 내에서 호출."

["RectNode::findHitNodeRecursive"]
description.en = "Clipping-aware recursive hit test (overrides Node's to respect the rect bounds)."
description.ja = "クリッピング対応の再帰的ヒットテスト（矩形境界を尊重するため Node をオーバーライド）。"
description.ko = "클리핑을 고려한 재귀 히트 테스트(사각 경계를 따르기 위해 Node 재정의)."

["RectNode::beginDraw"]
description.en = "Begin the draw scope, pushing the rect's clip region."
description.ja = "描画スコープを開始し、矩形のクリップ領域をプッシュする。"
description.ko = "그리기 스코프를 시작하고 사각형의 클립 영역을 푸시한다."

["RectNode::endDraw"]
description.en = "End the draw scope, popping the clip region."
description.ja = "描画スコープを終了し、クリップ領域をポップする。"
description.ko = "그리기 스코프를 종료하고 클립 영역을 팝한다."

["RectNode::onMousePress"]
description.en = "Fire the mousePressed event and forward to the legacy simple-form hook. Returns true (consume); return false from an override to bubble the press to the parent chain — the consumer becomes the drag/release grab target."
description.ja = "mousePressed イベントを発火し、旧来の単純フォームのフックへ転送する。デフォルトは true（消費）。オーバーライドで false を返すと親へバブリングし、消費したノードがドラッグ/リリースのグラブ先になる。"
description.ko = "mousePressed 이벤트를 발생시키고 레거시 단순 폼 훅으로 전달한다. 기본은 true(소비). 오버라이드에서 false를 반환하면 부모로 버블링되며, 소비한 노드가 드래그/릴리스의 그랩 대상이 된다."

["RectNode::onMouseRelease"]
description.en = "Fire the mouseReleased event and forward to the legacy simple-form hook."
description.ja = "mouseReleased イベントを発火し、旧来の単純フォームのフックへ転送する。"
description.ko = "mouseReleased 이벤트를 발생시키고 레거시 단순 폼 훅으로 전달한다."

["RectNode::onMouseDrag"]
description.en = "Fire the mouseDragged event and forward to the legacy simple-form hook."
description.ja = "mouseDragged イベントを発火し、旧来の単純フォームのフックへ転送する。"
description.ko = "mouseDragged 이벤트를 발생시키고 레거시 단순 폼 훅으로 전달한다."

["RectNode::onMouseScroll"]
description.en = "Fire the scroll event; returns false to allow bubbling to a parent (e.g. ScrollContainer)."
description.ja = "スクロールイベントを発火する。false を返すと親（例: ScrollContainer）へバブリングできる。"
description.ko = "스크롤 이벤트를 발생시킨다. false를 반환하면 부모(예: ScrollContainer)로 버블링할 수 있다."

["RectNode::drawRectFill"]
description.en = "Helper that draws the rectangle filled."
description.ja = "矩形を塗りつぶしで描くヘルパー。"
description.ko = "사각형을 채워 그리는 헬퍼."

["RectNode::drawRectStroke"]
description.en = "Helper that draws the rectangle outline."
description.ja = "矩形の輪郭線を描くヘルパー。"
description.ko = "사각형 외곽선을 그리는 헬퍼."

["RectNode::drawRectFillAndStroke"]
description.en = "Helper that draws the rectangle with both fill and stroke."
description.ja = "矩形を塗りと輪郭線の両方で描くヘルパー。"
description.ko = "사각형을 채움과 외곽선 모두로 그리는 헬퍼."

["RectNode::onSizeChanged"]
description.en = "Callback invoked when the rect's size changes."
description.ja = "矩形のサイズが変化したときに呼ばれるコールバック。"
description.ko = "사각형 크기가 변경될 때 호출되는 콜백."

["RectNodeButton::onMousePress"]
description.en = "Set the pressed state, then fire the base RectNode press handling."
description.ja = "押下状態にして、基底 RectNode の押下処理を呼ぶ。"
description.ko = "눌림 상태로 만든 뒤 베이스 RectNode의 누름 처리를 호출한다."

["RectNodeButton::onMouseRelease"]
description.en = "Clear the pressed state, then fire the base RectNode release handling."
description.ja = "押下状態を解除し、基底 RectNode の離し処理を呼ぶ。"
description.ko = "눌림 상태를 해제한 뒤 베이스 RectNode의 뗌 처리를 호출한다."

["LayoutMod::setup"]
description.en = "Mod lifecycle: lay out the children once when attached."
description.ja = "Mod ライフサイクル：アタッチ時に一度子要素をレイアウトする。"
description.ko = "Mod 라이프사이클: 부착 시 한 번 자식을 배치한다."

["LayoutMod::earlyUpdate"]
description.en = "Mod lifecycle: early-update hook (relayout point)."
description.ja = "Mod ライフサイクル：早期更新フック（再レイアウトの地点）。"
description.ko = "Mod 라이프사이클: 조기 업데이트 훅(재배치 지점)."

["LayoutMod::isExclusive"]
description.en = "Return true: only one LayoutMod may attach per node."
description.ja = "true を返す：1 ノードに付けられる LayoutMod は 1 つだけ。"
description.ko = "true 반환: 노드당 LayoutMod는 하나만 부착 가능."

["LayoutMod::canAttachTo"]
description.en = "Restrict attachment to RectNode owners."
description.ja = "アタッチ先を RectNode 系に制限する。"
description.ko = "부착 대상을 RectNode 계열로 제한한다."

["ScrollContainer::onSizeChanged"]
description.en = "Recompute scroll bounds when the container's size changes."
description.ja = "コンテナのサイズ変化時にスクロール範囲を再計算する。"
description.ko = "컨테이너 크기 변경 시 스크롤 범위를 재계산한다."

["ScrollContainer::update"]
description.en = "Apply accumulated scroll deltas to the content position."
description.ja = "蓄積されたスクロール量をコンテンツ位置へ適用する。"
description.ko = "누적된 스크롤 양을 콘텐츠 위치에 적용한다."

["ScrollContainer::onMouseScroll"]
description.en = "Accumulate the scroll delta for processing in update(); consume if scrollable."
description.ja = "スクロール量を蓄積し update() で処理する。スクロール可能なら消費する。"
description.ko = "스크롤 양을 누적해 update()에서 처리한다. 스크롤 가능하면 소비한다."

["ScrollBar::updateVertical"]
description.en = "Size and position the bar for a vertical scroll container (or hide it)."
description.ja = "縦スクロールコンテナ用にバーのサイズと位置を更新する（不要なら非表示）。"
description.ko = "세로 스크롤 컨테이너에 맞게 바의 크기·위치를 갱신한다(필요 없으면 숨김)."

["ScrollBar::updateHorizontal"]
description.en = "Size and position the bar for a horizontal scroll container (or hide it)."
description.ja = "横スクロールコンテナ用にバーのサイズと位置を更新する（不要なら非表示）。"
description.ko = "가로 스크롤 컨테이너에 맞게 바의 크기·위치를 갱신한다(필요 없으면 숨김)."

["ScrollBar::draw"]
description.en = "Draw the scrollbar as a rounded-cap stroked slot."
description.ja = "丸キャップのストロークスロットとしてスクロールバーを描画する。"
description.ko = "둥근 캡 스트로크 슬롯으로 스크롤바를 그린다."

["ScrollBar::onMousePress"]
description.en = "Begin dragging the bar, recording the grab offset."
description.ja = "バーのドラッグを開始し、つかみオフセットを記録する。"
description.ko = "바 드래그를 시작하고 잡은 오프셋을 기록한다."

["ScrollBar::onMouseRelease"]
description.en = "End dragging the bar."
description.ja = "バーのドラッグを終了する。"
description.ko = "바 드래그를 종료한다."

["ScrollBar::onMouseDrag"]
description.en = "Translate a drag into a scroll position via the vertical or horizontal handler."
description.ja = "ドラッグを縦／横ハンドラ経由でスクロール位置へ反映する。"
description.ko = "드래그를 세로/가로 핸들러를 통해 스크롤 위치로 반영한다."

["ScrollBar::handleVerticalDrag"]
description.en = "Map a vertical drag position to the container's scrollY."
description.ja = "縦方向のドラッグ位置をコンテナの scrollY に対応付ける。"
description.ko = "세로 드래그 위치를 컨테이너의 scrollY에 매핑한다."

["ScrollBar::handleHorizontalDrag"]
description.en = "Map a horizontal drag position to the container's scrollX."
description.ja = "横方向のドラッグ位置をコンテナの scrollX に対応付ける。"
description.ko = "가로 드래그 위치를 컨테이너의 scrollX에 매핑한다."

["TweenMod::earlyUpdate"]
description.en = "Mod lifecycle: advance the tween each frame in the early-update phase."
description.ja = "Mod ライフサイクル：早期更新フェーズで毎フレーム、トゥイーンを進める。"
description.ko = "Mod 라이프사이클: 조기 업데이트 단계에서 매 프레임 트윈을 진행한다."

["ChipSoundBundle::Entry"]
keywords = ["note", "timeline", "schedule", "melody"]
description.en = "One scheduled note in a ChipSoundBundle: the note itself plus the time it starts at. `ChipSoundBundle::entries` is a vector of these, so a melody can be inspected or edited directly as well as built with add()."
description.ja = "ChipSoundBundle に並ぶ1音: 音符そのものと、その開始時刻。`ChipSoundBundle::entries` はこれの配列なので、add() で積むだけでなくメロディを直接読んだり書き換えたりもできる"
description.ko = "ChipSoundBundle에 놓인 한 음: 음표 자체와 시작 시각. `ChipSoundBundle::entries`가 이들의 배열이므로 add()로 쌓는 것 외에 멜로디를 직접 읽거나 고칠 수도 있다"
related = ["ChipSoundBundle", "ChipSoundNote"]

["ChipSoundNote::Wave"]
keywords = ["waveform", "chiptune", "oscillator", "square", "noise"]
description.en = "Waveform a ChipSoundNote is synthesised from. Also available unqualified as `Wave`."
description.ja = "ChipSoundNote を合成する波形。`Wave` という非修飾の別名でも使える"
description.ko = "ChipSoundNote를 합성하는 파형. `Wave`라는 비수식 별칭으로도 쓸 수 있다"
related = ["ChipSoundNote", "ChipSoundBundle"]
value_desc.Sin.en = "Sine — smooth, no harmonics (default)"
value_desc.Sin.ja = "サイン波 — 倍音のない滑らかな音（デフォルト）"
value_desc.Sin.ko = "사인파 — 배음이 없는 부드러운 소리(기본값)"
value_desc.Square.en = "Square — the classic chiptune lead"
value_desc.Square.ja = "矩形波 — チップチューンの定番リード"
value_desc.Square.ko = "구형파 — 칩튠의 대표적인 리드"
value_desc.Triangle.en = "Triangle — softer than square, often used for bass"
value_desc.Triangle.ja = "三角波 — 矩形波より柔らかく、ベースによく使う"
value_desc.Triangle.ko = "삼각파 — 구형파보다 부드러워 베이스에 자주 쓴다"
value_desc.Sawtooth.en = "Sawtooth — bright and buzzy"
value_desc.Sawtooth.ja = "ノコギリ波 — 明るくざらついた音"
value_desc.Sawtooth.ko = "톱니파 — 밝고 거친 소리"
value_desc.Noise.en = "White noise — percussion and effects"
value_desc.Noise.ja = "ホワイトノイズ — 打楽器や効果音に"
value_desc.Noise.ko = "화이트 노이즈 — 타악기와 효과음에"
value_desc.PinkNoise.en = "Pink noise — darker than white, 1/f spectrum"
value_desc.PinkNoise.ja = "ピンクノイズ — ホワイトより暗い 1/f スペクトル"
value_desc.PinkNoise.ko = "핑크 노이즈 — 화이트보다 어두운 1/f 스펙트럼"
value_desc.Silent.en = "Silence — occupies its duration without sounding, for rests"
value_desc.Silent.ja = "無音 — 長さだけ占めて鳴らない。休符に使う"
value_desc.Silent.ko = "무음 — 길이만 차지하고 소리내지 않는다. 쉼표용"

["ScrollBar::Direction"]
hide = true

["Font::setOversampling"]
keywords = ["oversampling", "supersample", "sharpness", "quality", "atlas"]
description.en = "Rasterize glyphs at N x N the target size and box-filter them down, trading N^2 atlas memory for sharper text under arbitrary transforms (1 = off)."
description.ja = "グリフを N x N 倍の解像度でラスタライズしてから縮小し、アトラスのメモリを N^2 倍払う代わりに任意の変換下で文字を鮮明にする（1 = 無効）。"
description.ko = "글리프를 N x N 배 해상도로 래스터화한 뒤 축소하여, 아틀라스 메모리를 N^2 배 쓰는 대신 임의의 변환에서도 글자를 또렷하게 만든다(1 = 끔)."

["Font::getOversampling"]
keywords = ["oversampling", "supersample", "quality"]
description.en = "Return the oversampling factor this font rasterizes with (1 = off)."
description.ja = "このフォントがラスタライズに使うオーバーサンプリング倍率を返す（1 = 無効）。"
description.ko = "이 폰트가 래스터화에 사용하는 오버샘플링 배수를 반환한다(1 = 끔)."

["Font::setDefaultOversampling"]
keywords = ["oversampling", "default", "global", "quality"]
description.en = "Set the oversampling factor newly loaded fonts start with; does not affect fonts already loaded."
description.ja = "以降に読み込むフォントの既定のオーバーサンプリング倍率を設定する。読み込み済みのフォントには影響しない。"
description.ko = "이후 로드하는 폰트의 기본 오버샘플링 배수를 설정한다. 이미 로드된 폰트에는 영향을 주지 않는다."

["Font::getDefaultOversampling"]
keywords = ["oversampling", "default", "global"]
description.en = "Return the oversampling factor newly loaded fonts start with."
description.ja = "以降に読み込むフォントの既定のオーバーサンプリング倍率を返す。"
description.ko = "이후 로드하는 폰트의 기본 오버샘플링 배수를 반환한다."

["Font::setMipmaps"]
keywords = ["mipmap", "minification", "shimmer", "scale", "quality"]
description.en = "Enable mipmapping of the glyph atlas so text stays stable when drawn much smaller than its loaded size (on by default; the chain is built lazily on the first minified draw)."
description.ja = "グリフアトラスのミップマップを有効にし、読み込みサイズよりかなり小さく描画してもテキストがちらつかないようにする（既定で有効。ミップ列は最初に縮小描画された時点で生成される）。"
description.ko = "글리프 아틀라스의 밉맵을 활성화하여 로드 크기보다 훨씬 작게 그려도 텍스트가 흔들리지 않게 한다(기본 활성화. 밉 체인은 첫 축소 렌더링 시점에 생성된다)."

["Font::getMipmaps"]
keywords = ["mipmap", "minification", "quality"]
description.en = "Return whether the glyph atlas is allowed to build mipmaps."
description.ja = "グリフアトラスがミップマップを生成してよいかどうかを返す。"
description.ko = "글리프 아틀라스가 밉맵을 생성해도 되는지 여부를 반환한다."

["Font::setGridFit"]
keywords = ["grid fit", "hinting", "baseline", "pixel grid", "sharpness"]
description.en = "Snap every baseline to a whole pixel at draw time so horizontal strokes stay sharp, at no memory cost and one rounding per line (on by default; automatically stands down when the transform is not 1:1, where rounding in model space would hurt instead)."
description.ja = "描画時に各行のベースラインを整数ピクセルにスナップして横画を鮮明に保つ。メモリコストはなく、行あたり丸め1回だけ（既定で有効。1:1 でない変換下ではモデル空間での丸めが逆効果になるため自動的に無効化される）。"
description.ko = "그리기 시점에 각 줄의 베이스라인을 정수 픽셀에 맞춰 가로획을 또렷하게 유지한다. 메모리 비용은 없고 줄당 반올림 한 번뿐이다(기본 활성화. 1:1이 아닌 변환에서는 모델 공간 반올림이 역효과이므로 자동으로 해제된다)."

["Font::getGridFit"]
keywords = ["grid fit", "hinting", "baseline"]
description.en = "Return whether vertical grid fit is enabled for this font."
description.ja = "このフォントで縦方向のグリッドフィットが有効かどうかを返す。"
description.ko = "이 폰트에 세로 그리드 피팅이 활성화되어 있는지 여부를 반환한다."

["Font::gridFitLands"]
description.en = "Report whether grid fit actually lands on the pixel grid, i.e. whether it is enabled and the current transform maps one model unit to one device pixel."
description.ja = "グリッドフィットが実際にピクセル境界に乗るかどうかを返す。有効であり、かつ現在の変換で1モデル単位が1デバイスピクセルに対応する場合のみ真。"
description.ko = "그리드 피팅이 실제로 픽셀 격자에 맞는지 여부를 반환한다. 활성화되어 있고 현재 변환이 1 모델 단위를 1 디바이스 픽셀로 매핑할 때만 참이다."

["Font::fitY"]
description.en = "Snap a baseline offset accumulated from the anchor to the pixel grid, or pass it through unchanged when grid fit does not land. Callers must accumulate first and round once: rounding the line height and stepping by it would compound into a whole-pixel layout drift."
description.ja = "アンカーからの累積ベースラインオフセットをピクセル境界にスナップする。グリッドフィットが働かない場合はそのまま返す。呼び出し側は必ず累積してから1回だけ丸めること。行の高さを丸めてから加算すると誤差が積み上がり、レイアウトが1ピクセル分ずれてしまう。"
description.ko = "앵커에서 누적된 베이스라인 오프셋을 픽셀 격자에 맞추고, 그리드 피팅이 유효하지 않으면 그대로 돌려준다. 호출자는 반드시 먼저 누적한 뒤 한 번만 반올림해야 한다. 줄 높이를 반올림해 더해 나가면 오차가 쌓여 레이아웃이 한 픽셀만큼 어긋난다."

["TcpClient::isConnecting"]
description.en = "Whether a TCP connection attempt or TLS handshake is in progress"
description.ja = "TCP 接続または TLS ハンドシェイクの進行中か"
description.ko = "TCP 연결 또는 TLS 핸드셰이크 진행 중인지"

["TcpClient::setConnectTimeout"]
description.en = "Set the TCP connect deadline in seconds; default 0 uses the OS deadline"
description.ja = "TCP 接続期限を秒で設定。既定の 0 は OS の期限に任せる"
description.ko = "TCP 연결 기한을 초로 설정. 기본 0은 OS 기한 사용"
details.en = "The deadline covers TCP connect, not DNS resolution or the TLS handshake. In installations, connect by IP address so nothing waits for DNS. Default 0 preserves the OS SYN timeout (roughly 21 seconds on Windows, 127 on Linux). For installations whose peer device may power off, setConnectTimeout(5) lets a reconnect loop attempt again sooner; waiting for the Linux OS deadline can delay recovery by about a minute. Cancellation works even with 0. Applies to the current pending connect as well as later attempts."
details.ja = "期限は TCP 接続だけに適用し、DNS 解決や TLS ハンドシェイクを含まない。展示では IP アドレスで接続し、DNS を待たないようにする。既定の 0 は OS の SYN タイムアウト（Windows 約21秒、Linux 約127秒）を保つ。相手機器の電源が切れる展示では setConnectTimeout(5) にすると次の再試行を早く始められる。Linux の OS の期限を待つと復旧が約1分遅れることがある。0 でもキャンセル可能。現在保留中の接続と次の試行に適用。"
details.ko = "기한은 TCP 연결에만 적용되며 DNS 해석이나 TLS 핸드셰이크는 포함하지 않는다. 설치 환경에서는 IP 주소로 연결하여 DNS를 기다리지 않도록 한다. 기본 0은 OS SYN 타임아웃(Windows 약21초, Linux 약127초)을 유지한다. 상대 장치가 꺼질 수 있는 설치에서는 setConnectTimeout(5)로 다음 재시도를 빨리 시작할 수 있다. Linux OS 기한을 기다리면 복구가 약1분 늦어질 수 있다. 0에서도 취소 가능. 현재 대기 연결과 이후 시도에 적용."

["TcpClient::setSendTimeout"]
description.en = "Set the idle send timeout in seconds; default 60, 0 waits forever"
description.ja = "送信に進捗がない時間の上限を秒で設定。既定 60、0 は無期限"
description.ko = "전송 진행 없는 시간 제한을 초로 설정. 기본 60, 0은 무기한"

["TcpClient::sendAsync"]
description.en = "Queue owned bytes without waiting; returns SendResult and reports once through onSendComplete"
description.ja = "データを所有するキューに待たずに追加。SendResult を返し onSendComplete で1回通知"
description.ko = "데이터를 소유하는 큐에 대기 없이 추가. SendResult 반환 및 onSendComplete로 한 번 알림"
details.en = "Shares the FIFO queue and idle deadline with send(). Pointer/string overloads copy; vector&& takes ownership. An empty queue accepts any payload size. Once pending bytes reach the high-water mark, further calls return QueueFull without disconnecting. With threads, completions run on the writer thread; without threads, processNetwork() drains the queue without waiting and emits completions inline. A send timeout closes this client, so completion reports Disconnected (onError describes the timeout), following SendError's existing connection-state vocabulary. Do not call send() inline from a send completion/error listener; use sendAsync()."
details.ja = "send() と FIFO キューおよび無進捗の期限を共有。ポインターと文字列はコピー、vector&& は所有権を移す。空のキューは任意のサイズを受け入れ、高水位に達したあとの呼び出しは切断せず QueueFull を返す。スレッドありの完了通知は送信スレッド上、なしでは processNetwork() が待たずにキューを進めてその場で通知する。送信期限が切れると接続を閉じるため、完了は Disconnected（onError はタイムアウトを説明）となる。送信の完了・エラーリスナーから send() をその場で呼ばず sendAsync() を使う。"
details.ko = "send()와 FIFO 큐 및 무진행 기한을 공유. 포인터/문자열은 복사하고 vector&&는 소유권 이동. 빈 큐는 모든 크기를 받으며 기준에 도달한 뒤에는 연결을 끊지 않고 QueueFull 반환. 스레드 사용 시 완료는 전송 스레드에서, 없으면 processNetwork()이 대기 없이 진행하고 즉시 알린다. 전송 기한 만료 시 연결을 닫으므로 완료는 Disconnected이며 onError가 타임아웃을 설명한다. 전송 완료/오류 리스너에서 send() 대신 sendAsync() 사용."

["TcpClient::onSendComplete"]
description.en = "A queued send completed; clientId is -1, sendId identifies the payload"
description.ja = "キュー済みの送信の完了。clientId は -1、sendId がデータを識別"
description.ko = "큐에 든 전송 완료. clientId는 -1, sendId가 데이터를 식별"
details.en = "Every queued id completes once while the client is alive, including pending sends cancelled by disconnect(). With threads it fires on the writer; without threads it fires from processNetwork(), send() or disconnect(). Destruction stops workers and wakes blocked senders without firing new events."
details.ja = "クライアントが生存している間、キュー済み id は disconnect() でのキャンセルを含め1回完了を通知する。スレッドありでは送信スレッド上、なしでは processNetwork()、send()、disconnect() から通知。破棄は新たなイベントを出さずにワーカーを停止し、待機中の送信元を起こす。"
details.ko = "클라이언트가 살아 있는 동안 큐 id는 disconnect() 취소를 포함해 한 번 완료를 알린다. 스레드 사용 시 전송 스레드에서, 없으면 processNetwork(), send(), disconnect()에서 발생. 소멸은 새 이벤트 없이 작업자를 멈추고 대기 송신자를 깨운다."

["TcpClient::setSendAsyncBufferSize"]
description.en = "Set the send queue high-water mark; default 16 MB, 0 unlimited"
description.ja = "送信キューの高水位を設定。既定 16 MB、0 は無制限"
description.ko = "전송 큐의 상한 기준 설정. 기본 16 MB, 0은 무제한"

["TcpClient::getSendAsyncBufferSize"]
description.en = "Get the send queue high-water mark in bytes"
description.ja = "送信キューの高水位をバイト数で取得"
description.ko = "전송 큐의 상한 기준을 바이트로 가져오기"

["TcpClient::getSendAsyncPendingBytes"]
description.en = "Bytes queued but not yet completed"
description.ja = "キュー済みで未完了のバイト数"
description.ko = "큐에 있고 아직 완료되지 않은 바이트 수"

