description.ja = "リングバッファ溢れで失われたフレーム数（通常は0。非0はライタースレッドの遅延を意味する）"
description.ko = "링 버퍼 오버플로로 손실된 프레임 수(정상 동작에서는 0, 0이 아니면 라이터 스레드 지연을 의미)"

["AudioRecorder::getPath"]
category = "sound"
keywords = ["file", "output", "where"]
description.en = "Resolved path of the file being written"
description.ja = "書き込み中ファイルの解決済みパス"
description.ko = "기록 중인 파일의 확정된 경로"

["AudioSettings"]
keywords = ["audio config", "sample rate", "buffer size", "channels", "init options"]
description.en = "Configuration passed to AudioEngine::init() to override engine defaults (sample rate, channels, buffer size, polyphony, device). Empty deviceName selects the system default playback device."
description.ja = "AudioEngine::init() に渡してエンジンのデフォルト (サンプルレート、チャンネル、バッファサイズ、ポリフォニー、デバイス) を上書きする設定。deviceName が空ならシステム既定の再生デバイスを選択する"
description.ko = "AudioEngine::init() 에 전달하여 엔진 기본값 (샘플레이트, 채널, 버퍼 크기, 폴리포니, 디바이스) 을 오버라이드하는 설정. deviceName 이 비어 있으면 시스템 기본 재생 디바이스를 선택"
related = ["AudioEngine::init", "AudioEngine", "AudioDeviceInfo"]

["AudioSettings::bufferSize"]
description.en = "Requested device buffer size in frames; 0 = let miniaudio choose"
description.ja = "要求するデバイスバッファサイズ (フレーム単位)、0 = miniaudio に任せる"
description.ko = "요청하는 디바이스 버퍼 크기 (프레임 단위), 0 = miniaudio 가 선택"

["AudioSettings::channels"]
description.en = "Output channel count (1 = mono, 2 = stereo; default 2)"
description.ja = "出力チャンネル数 (1 = モノラル、2 = ステレオ、デフォルト 2)"
description.ko = "출력 채널 수 (1 = 모노, 2 = 스테레오, 기본값 2)"

["AudioSettings::deviceName"]
description.en = "Playback device name; empty = system default. Use AudioEngine::listDevices() to enumerate."
description.ja = "再生デバイス名、空 = システム既定。列挙には AudioEngine::listDevices() を使う"
description.ko = "재생 디바이스 이름, 비어 있으면 시스템 기본값. 열거에는 AudioEngine::listDevices() 사용"

["AudioSettings::maxPolyphony"]
description.en = "Max simultaneously-playing Sound voices (default 32)"
description.ja = "同時再生可能な Sound ボイスの最大数 (デフォルト 32)"
description.ko = "동시 재생 가능한 Sound 보이스 최대 수 (기본값 32)"

["AudioSettings::sampleRate"]
description.en = "Engine output sample rate in Hz (0 = the engine default, 48000)"
description.ja = "エンジン出力サンプルレート (Hz、0 = エンジンのデフォルト 48000)"
description.ko = "엔진 출력 샘플레이트 (Hz, 0 = 엔진 기본값 48000)"

["AudioStats"]
keywords = ["audio diagnostics", "dropped plays", "clipping", "cpu usage", "cpu load", "meter", "underrun", "stall", "re-init"]
description.en = "Audio engine health counters and meters, returned by AudioEngine::getStats(). Counters are cumulative since the process started (they survive re-init); peak / rms / cpuUsage describe the recent output."
description.ja = "AudioEngine::getStats() が返すオーディオエンジンの健全性カウンタとメーター。カウンタはプロセス起動からの累計 (再初期化でも消えない)。peak / rms / cpuUsage は直近の出力を表す"
description.ko = "AudioEngine::getStats() 가 반환하는 오디오 엔진 상태 카운터와 미터. 카운터는 프로세스 시작 이후 누계 (재초기화해도 유지). peak / rms / cpuUsage 는 최근 출력을 나타낸다"
related = ["AudioEngine::getStats", "PlayingSoundInfo"]

["AudioStats::underrunFrames"]
description.en = "Cumulative silent output frames per streaming voice because the decoder fell behind. A new voice's wait before its first decoded frame, pauses, pending seeks, refill waits after an applied seek and a normal end are excluded. Warnings are aggregated on the main thread at most once per two seconds, with remaining counts flushed at exit."
description.ja = "デコーダーが遅れてストリーム再生が無音になった出力フレーム数の累計 (再生インスタンスごと)。新しい再生の最初のデコード待ち、一時停止、処理待ちのシーク、シーク適用後のデータ補充待ち、正常な終端は含まない。警告はメインスレッドで2秒に最大1回集約し、終了時に残りを報告する"
description.ko = "디코더가 늦어 스트림 재생이 무음이 된 출력 프레임 수 누계 (재생 인스턴스별). 새 재생의 첫 디코딩 대기, 일시 정지, 처리 대기 중인 탐색, 탐색 적용 후 데이터 보충 대기, 정상 종료는 제외한다. 경고는 메인 스레드에서 2초에 최대 한 번 집계하며 종료 시 나머지를 보고한다"

["AudioStats::stalled"]
description.en = "True while the engine is running but no mix callback has finished for max(250 ms, four granted device periods). Master meters, CPU usage meters and playing-sound levels read zero while stalled. Clears when a callback finishes or the device stops; the main thread reports stall episodes with rate-limited warnings."
description.ja = "エンジン動作中にミックスコールバックが max(250 ms, デバイスが実際に与えた4周期) の間完了しなければ true。停止状態ではマスターメーター、CPU 使用率メーター、再生インスタンスのレベルは0。コールバックの完了またはデバイス停止で解除される。メインスレッドが停止の発生を間隔制限付きの警告で報告する"
description.ko = "엔진 동작 중 믹스 콜백이 max(250 ms, 디바이스가 실제 부여한 4주기) 동안 완료되지 않으면 true. 이 상태에서는 마스터 미터, CPU 사용률 미터, 재생 인스턴스 레벨이 0이다. 콜백 완료 또는 디바이스 정지로 해제되며 메인 스레드가 발생을 간격 제한 경고로 보고한다"

["AudioStats::voicesStoppedByReinit"]
description.en = "Cumulative streaming voices stopped because a live sample-rate re-init could not reopen their decoder. Separate from droppedPlays: these voices had already started successfully. Each failure keeps the existing warning with its file path and decoder result on the thread calling init(); this counter adds no summary warning."
description.ja = "動作中のサンプルレート再初期化でデコーダーを開き直せず停止したストリーム再生インスタンスの累計。再生開始は成功していたため droppedPlays とは別に数える。各失敗は init() を呼んだスレッドでファイルパスとデコーダーの結果値を含む既存の警告を出す。このカウンタによる集約警告は追加しない"
description.ko = "동작 중 샘플 레이트 재초기화에서 디코더를 다시 열 수 없어 정지한 스트림 재생 인스턴스 누계. 재생 시작은 성공했으므로 droppedPlays 와 별도로 센다. 각 실패는 init() 을 호출한 스레드에서 파일 경로와 디코더 결과 값을 포함하는 기존 경고를 남긴다. 이 카운터는 요약 경고를 추가하지 않는다"

["AudioStats::clippedSamples"]
description.en = "Output samples beyond +/-1.0 that the final clamp cut off (counted per channel sample)."
description.ja = "最終クランプで切り落とされた ±1.0 を超える出力サンプル数 (チャンネルごとのサンプル単位)"
description.ko = "최종 클램프에서 잘린 ±1.0 을 넘는 출력 샘플 수 (채널별 샘플 단위)"

["AudioStats::cpuUsage"]
keywords = ["cpu usage", "cpu load", "audio thread", "dropout", "overrun"]
description.en = "Fraction of audio-thread time: time spent mixing the playing sounds and audioOut listeners divided by the audio time produced, averaged over ~0.5 s of audio. 1.0 means the callback took as long as the audio it produced (0.25 = a quarter of the time budget). 0 while the engine is not running or callbacks are stalled."
description.ja = "オーディオスレッドの時間の割合: 再生中のサウンドと audioOut リスナーのミックスにかかった時間 ÷ 生成した音の時間。約 0.5 秒分の音の平均。1.0 はコールバックが生成した音と同じだけの時間がかかったことを表す (0.25 = 時間予算の 4 分の 1)。エンジン停止中、またはコールバックが停止状態なら 0"
description.ko = "오디오 스레드 시간의 비율: 재생 중인 사운드와 audioOut 리스너 믹스에 걸린 시간 ÷ 생성한 오디오 시간. 약 0.5 초 분량의 오디오 평균. 1.0 은 콜백이 생성한 오디오만큼의 시간이 걸렸다는 뜻 (0.25 = 시간 예산의 4 분의 1). 엔진 또는 콜백이 정지 상태면 0"
related = ["AudioStats::cpuUsagePeak"]

["AudioStats::cpuUsagePeak"]
keywords = ["cpu usage", "peak", "dropout", "overrun"]
description.en = "CPU usage of the worst single callback in the same window; above 1 the callback took longer than the audio it produced (a dropout). 0 while the engine is not running or callbacks are stalled."
description.ja = "同じ区間で最も重かったコールバック 1 回の CPU 使用率。1 を超えたらコールバックが生成した音より長くかかった (音切れ)。エンジン停止中、またはコールバックが停止状態なら 0"
description.ko = "같은 구간에서 가장 무거웠던 콜백 한 번의 CPU 사용률. 1 을 넘으면 콜백이 생성한 오디오보다 오래 걸린 것 (끊김). 엔진 또는 콜백이 정지 상태면 0"
related = ["AudioStats::cpuUsage"]

["AudioStats::droppedDecoderError"]
description.en = "Plays refused because a stream's file could not be reopened for the new playback (moved, deleted or unreadable)."
description.ja = "ストリームのファイルを新しい再生用に開き直せず (移動・削除・読めない) 捨てた再生の数"
description.ko = "스트림 파일을 새 재생용으로 다시 열 수 없어 (이동·삭제·읽기 불가) 버려진 재생 수"

["AudioStats::droppedNotRunning"]
description.en = "Plays refused because no output device was running (init failed, or after shutdown())."
description.ja = "出力デバイスが動いていなかった (init 失敗、または shutdown() 後) ために捨てた再生の数"
description.ko = "출력 디바이스가 동작하지 않아 (init 실패 또는 shutdown() 이후) 버려진 재생 수"

["AudioStats::droppedPlays"]
description.en = "Plays AudioEngine::play() refused since startup (Sound::play() returned false), all reasons: the sum of the four dropped* fields."
