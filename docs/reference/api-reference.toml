["TAU"]
keywords = ["two pi", "circle", "radians", "full turn", "6.28"]
description.en = "Ratio of circumference to radius; the radian measure of one full turn. ≈ 6.28318."
description.ja = "円周と半径の比。一周（full turn）に対応する radian。約 6.28318。"
description.ko = "원주와 반지름의 비. 한 바퀴(full turn)에 해당하는 라디안. 약 6.28318."
details.en = '''
π was one of the greatest constants humankind has ever found. Tracing back to Archimedes in the 3rd century BC, geometry, analysis, and physics have been built on this single letter for nearly two thousand years — an unquestionable achievement.

But just one thing, truly just one, was an unfortunate first design choice: defining the circle by its diameter. That was where all the seams began.

The essence of a circle is the set of points equidistant from a center. That equal distance — the radius — is what defines a circle; the diameter is merely a by-product. Yet π was defined as `circumference / diameter`.

That single mismatch scatters a stray factor of `2π` across formulas the world over.

- Circumference is `2πr` — somehow a `2` is needed.
- One turn is `2π` radians; a half turn `π`, a quarter `π/2`.
- Fourier transforms, the normal distribution, rotation — `2π` shows up almost everywhere.

Everyone is made to write a quarter turn as `π/2`, and a coder always pauses for a moment to ask "where did this `2` come from?"

The small stress that piles up in practice is real — but more than that, you have to notice it leaves a single smudge on the expression of something beautiful.

Even Euler's identity, often called the most beautiful equation, becomes a more symmetric expression when written with τ:

```
e^(iτ) = 1
```

"Go around once, return to where you started." It speaks to the essence of rotation more directly than `e^(iπ) = -1`, which flips at a half turn.

So TrussC, with the utmost respect for π, moves past it. The rotation and angle APIs treat [`TAU`](#TAU) (= 2π) as the first-class constant.

In the hope that one day `TAU` takes the lead.

## In TrussC

`PI` is defined for compatibility and mathematical correctness, but for half a turn you should use `HALF_TAU`, and for a quarter `QUARTER_TAU` — that states the idea explicitly.

```cpp
// Discouraged: a quarter turn. Why divide by 2? — you pause for a moment
rotate(PI / 2);

// Preferred: a quarter turn, no second-guessing
rotate(QUARTER_TAU);
rotate(TAU / 4);
```
'''
details.ja = '''
π は人類が手にした最も偉大な定数のひとつだった。紀元前 3 世紀のアルキメデスに端を発し、約 2000 年にわたって幾何学・解析学・物理学がこの一文字の上に積み上げられてきた。疑いようのない偉業だ。

ただ、本当にひとつだけ、最初の設計判断が惜しかった。円を「直径」基準で定義してしまったこと。これがすべての綻びの始まりだった。

円という図形の本質は、中心から等距離にある点の集合だ。その「等距離」、つまり半径 (radius) こそが円を定義する量であって、直径 (diameter) はその副産物にすぎない。にもかかわらず π は `円周 / 直径` として定義された。

このたった一つのボタンの掛け違いが、後の世界中の数式に `2π` という余分な係数をばらまくことになる。

- 円周は `2πr`。なぜか `2` が要る。
- 1 回転は `2π` radian。半回転で `π`、1/4 回転で `π/2`。
- Fourier 変換にも、正規分布にも、回転にも、ほぼ必ず `2π` が顔を出す。

誰もが「1/4 回転」を `π/2` と書かされ、コーダーが「この `2` はどこから来た？」といつも一瞬考える。

実利面で小さく積もるストレスも無視できないが、それよりも美しさの表現に1点の曇りを与えてしまっているということに気づかなければならない。

世界で一番美しいと言われるオイラーの公式も、τで書く方がより対称性の高い表現に変わる。

```
e^(iτ) = 1
```

「一周まわると元に戻る」。Euler の等式が `e^(iπ) = -1`（半周で裏返る）よりも、回転の本質を直接的に語っている。

だから TrussC は、π への最大限の敬意を払ったうえで、その先へ進む。回転と角度の API は [`TAU`](#TAU) (= 2π) を第一級の定数として扱う。

将来 `TAU` が主役になる日が来ることを願って。

## TrussC での扱い

`PI` は互換性と数学的な正しさのために定義しているが、半周を表すなら `HALF_TAU` 、1/4周なら `QUARTER_TAU` を使うべきだ。そのほうが「半周」という概念を明示的に表現できる。

```cpp
// 非推奨: 一周の 1/4。なぜ 2 で割る？と一瞬止まる
rotate(PI / 2);

// 推奨: 考える余地なく、一周の 1/4
rotate(QUARTER_TAU);
rotate(TAU / 4);  
```
'''
details.ko = '''
π는 인류가 손에 넣은 가장 위대한 상수 중 하나였다. 기원전 3세기 아르키메데스에서 비롯되어, 약 2000년에 걸쳐 기하학·해석학·물리학이 이 한 글자 위에 쌓여 왔다. 의심할 여지 없는 위업이다.

다만 정말로 한 가지, 최초의 설계 판단이 아쉬웠다. 원을 "지름" 기준으로 정의한 것. 이것이 모든 어긋남의 시작이었다.

원이라는 도형의 본질은 중심에서 같은 거리에 있는 점들의 집합이다. 그 "같은 거리", 즉 반지름(radius)이야말로 원을 정의하는 양이고, 지름(diameter)은 그 부산물에 불과하다. 그럼에도 π는 `원주 / 지름`으로 정의되었다.

이 단 한 번의 어긋남이 이후 세계의 수식에 `2π`라는 군더더기 계수를 흩뿌린다.

- 원주는 `2πr` — 어째서인지 `2`가 필요하다.
- 한 바퀴는 `2π` 라디안. 반 바퀴는 `π`, 1/4 바퀴는 `π/2`.
- 푸리에 변환에도, 정규분포에도, 회전에도 거의 반드시 `2π`가 등장한다.

누구나 1/4 회전을 `π/2`로 쓰게 되고, 코더는 "이 `2`는 어디서 왔지?"라며 늘 잠시 멈춘다.

실용적으로 조금씩 쌓이는 스트레스도 무시할 수 없지만, 그보다 아름다움의 표현에 한 점의 흐림을 더한다는 사실을 알아차려야 한다.

가장 아름답다고 일컬어지는 오일러의 공식도 τ로 쓰면 더 대칭적인 표현으로 바뀐다:

```
e^(iτ) = 1
```

"한 바퀴 돌면 제자리로 돌아온다." 반 바퀴에서 뒤집히는 `e^(iπ) = -1`보다 회전의 본질을 더 직접적으로 말해준다.

그래서 TrussC는 π에 최대한의 경의를 표하면서 그다음으로 나아간다. 회전과 각도 API는 [`TAU`](#TAU) (= 2π)를 일급 상수로 다룬다.

언젠가 `TAU`가 주역이 되는 날이 오기를 바라며.

## TrussC에서의 취급

`PI`는 호환성과 수학적 정확성을 위해 정의해 두었지만, 반 바퀴를 나타낸다면 `HALF_TAU`, 1/4 바퀴라면 `QUARTER_TAU`를 쓰는 편이 좋다. 그래야 개념을 명시적으로 표현할 수 있다.

```cpp
// 비권장: 한 바퀴의 1/4. 왜 2로 나누지? 하고 잠시 멈춘다
rotate(PI / 2);

// 권장: 생각할 여지 없이 한 바퀴의 1/4
rotate(QUARTER_TAU);
rotate(TAU / 4);
```
'''
related = ["PI", "HALF_TAU", "QUARTER_TAU", "rotate", "sin", "cos"]

