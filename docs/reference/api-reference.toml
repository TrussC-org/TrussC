["App::getWindow"]
keywords = ["multi window", "second window", "own window", "attach"]
description.en = "The Window this App is attached to via Window::setApp(), or nullptr when it is not attached — including the main App started by runApp() and an App whose window was closed. `close()` only requests closure; the window remains available until teardown begins. Already nullptr during teardown: inside this App's own exit() / cleanup() and in the window's events().exit listeners, because the native window is destroyed first. Read what you need (title, size, fullscreen) before calling close(), or keep it up to date in update(). Resolved from the App itself, so subApp->getWindow() returns the right window from any window's callbacks"
description.ja = "Window::setApp() でこのAppが載っているWindow。載っていなければ nullptr (runApp() で起動したメインAppと、ウィンドウが閉じられたAppを含む)。close() は終了要求のみで、破棄が始まるまではウィンドウを取得できる。破棄中はすでに nullptr になる: このApp自身の exit() / cleanup() の中と、そのウィンドウの events().exit リスナーの中。ネイティブウィンドウが先に破棄されるため。必要な情報 (タイトル、サイズ、フルスクリーン) は close() を呼ぶ前に読むか、update() で更新しておく。App自身から引くので、どのウィンドウのコールバックから subApp->getWindow() を呼んでも正しいウィンドウが返る"
description.ko = "Window::setApp()으로 이 App이 연결된 Window. 연결되어 있지 않으면 nullptr (runApp()으로 시작한 메인 App과 윈도우가 닫힌 App 포함). close()는 닫기를 요청할 뿐이며 실제 정리가 시작되기 전까지 윈도우를 얻을 수 있음. 정리 중에는 이미 nullptr: 이 App 자신의 exit() / cleanup() 안과 그 윈도우의 events().exit 리스너 안. 네이티브 윈도우가 먼저 파괴되기 때문. 필요한 정보 (제목, 크기, 전체 화면)는 close()를 호출하기 전에 읽거나 update()에서 갱신해 둘 것. App 자체에서 조회하므로 어느 윈도우의 콜백에서 subApp->getWindow()를 호출해도 올바른 윈도우가 반환됨"
