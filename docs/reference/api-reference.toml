["VideoErrorEventArgs"]
description.en = "Runtime video error event payload."
description.ja = "動画の再生時エラーのイベント引数。"
description.ko = "동영상 재생 오류 이벤트 인자."

["VideoErrorEventArgs::message"]
description.en = "Backend error message."
description.ja = "バックエンドのエラーメッセージ。"
description.ko = "백엔드 오류 메시지."

["VideoErrorEventArgs::errorCode"]
description.en = "Backend-specific error code; zero when unavailable. Codes are not portable between backends."
description.ja = "バックエンド固有のエラーコード。取得できない場合は 0。バックエンド間で共通の値ではない。"
description.ko = "백엔드별 오류 코드. 코드가 없으면 0이며 백엔드 간 공통 값이 아니다."

["VideoPlayerBase::onError"]
description.en = "Runtime failure event, delivered once per error stop by update() on the main thread. Playback stops without unloading, rewinding, or replacing the last frame. The app may seek, play again, or reload; there is no automatic retry. Keep calling update() on the main thread to receive errors. Normal EOF and stalls alone are not errors. Isolated invalid packets/frames are warned and skipped. onError listeners are not moved."
description.ja = "再生時エラーによる停止ごとに一度、メインスレッドの update() から通知する。読み込み状態・位置・最後のフレームを保持して停止する。アプリ側でシーク・再生再開・再読み込みを選択でき、自動再試行はしない。通知を受け取るにはメインスレッドで update() を呼び続ける。正常な EOF や単なる停滞はエラーではない。単独の破損パケット・フレームは警告して読み飛ばす。onError リスナーはムーブされない。"
description.ko = "재생 오류로 정지할 때마다 메인 스레드의 update()에서 한 번 알린다. 로드 상태, 위치, 마지막 프레임을 유지한다. 앱이 탐색, 재생 재개, 다시 로드를 선택하며 자동 재시도는 없다. 오류를 받으려면 메인 스레드에서 update()를 계속 호출한다. 정상 EOF나 단순 정체는 오류가 아니다. 개별 손상 패킷/프레임은 경고 후 건너뛴다. onError 리스너는 이동되지 않는다."

["VideoPlayerBase::hasError"]
description.en = "Whether update() has delivered a runtime playback failure. Cleared by a successful load() or close(), retained through seek and play()."
description.ja = "update() が再生時エラーを通知済みかを返す。成功した load() または close() で解除し、シークや play() では保持する。"
description.ko = "update()가 재생 오류를 전달했는지 반환한다. load() 성공 또는 close()로 초기화하며 탐색과 play()에서는 유지한다."

["VideoPlayerBase::getErrorMessage"]
description.en = "Last runtime error message, or an empty string when there is no error. Query on the main thread after update()."
description.ja = "最後の再生時エラーメッセージ。エラーがなければ空文字列。メインスレッドで update() 後に参照する。"
description.ko = "마지막 재생 오류 메시지. 오류가 없으면 빈 문자열. 메인 스레드에서 update() 후 조회한다."

["VideoPlayerBase::reportPlaybackError"]
description.en = "Subclass hook: enqueue a backend failure from any thread; coalesces pending reports until update dispatches them."
description.ja = "派生クラス用：任意スレッドからバックエンドの失敗をキューに入れる。update() が通知するまでの重複をまとめる。"
description.ko = "파생 클래스용: 임의 스레드에서 백엔드 오류를 큐에 넣는다. update() 전달 전 중복 보고를 합친다."

["VideoPlayerBase::dispatchPlaybackError"]
description.en = "Subclass hook: call from update() on the main thread outside backend locks. Pause the backend, retain the frame, set error state and notify. Return immediately when true, since a listener may close or reload the player."
description.ja = "派生クラス用：メインスレッドの update() でバックエンドのロック外から呼ぶ。バックエンドを一時停止してフレームを保持し、エラー状態を設定して通知する。リスナーが close/load できるため、true なら直ちに戻る。"
description.ko = "파생 클래스용: 메인 스레드의 update()에서 백엔드 잠금 밖에서 호출한다. 백엔드를 일시정지하고 프레임을 유지하며 오류 상태를 설정해 알린다. 리스너가 close/load할 수 있으므로 true이면 즉시 반환한다."

["VideoPlayerBase::clearPlaybackError"]
description.en = "Subclass hook: clear pending and delivered errors on successful load and close."
description.ja = "派生クラス用：load 成功時と close 時に通知待ちと通知済みのエラーを解除する。"
description.ko = "파생 클래스용: load 성공 및 close 시 대기 중인 오류와 전달된 오류를 초기화한다."

["VideoPlayerBase::movePlaybackErrorFrom"]
description.en = "Subclass hook: transfer pending and delivered error state when moving a player. Event listeners stay with their original object."
description.ja = "派生クラス用：ムーブ時に通知待ちと通知済みのエラー状態を移す。イベントリスナーは元のオブジェクトに残る。"
description.ko = "파생 클래스용: 이동 시 대기 중인 오류와 전달된 오류 상태를 옮긴다. 이벤트 리스너는 원래 객체에 남는다."

["AudioBackend"]
category = "sound"
description.en = "Audio backend selection: Default uses the platform backend order; Null explicitly runs the real mixer silently without a device."
description.ja = "オーディオバックエンドの選択。Default はプラットフォームの順序、Null はデバイスなしで実際のミキサーを無音で動かす。"
description.ko = "오디오 백엔드 선택. Default 는 플랫폼 순서, Null 은 디바이스 없이 실제 믹서를 무음으로 실행한다."

["AudioSettings::backend"]
category = "sound"
description.en = "Backend to open (Default by default). Set Null and call init(settings) before loading sounds for headless use. Enumeration and native MicInput follow the engine backend; before init, enumeration uses real backends. Zero-argument init() uses Default."
description.ja = "開くバックエンド (既定 Default)。ヘッドレス実行では Null を指定してサウンド読込前に init(settings) を呼ぶ。列挙とネイティブ MicInput はエンジンのバックエンドに従う。init 前の列挙は実バックエンドを使う。引数なしの init() は Default を使う。"
description.ko = "열 백엔드 (기본 Default). 헤드리스 실행에는 Null 을 지정하고 사운드 로드 전에 init(settings) 를 호출한다. 열거와 네이티브 MicInput 은 엔진 백엔드를 따른다. init 전 열거는 실제 백엔드를 사용한다. 인수 없는 init() 은 Default 를 사용한다."

["AudioInitFailure"]
category = "sound"
description.en = "Initialization failure stage: None, NoBackend (context creation), DeviceOpen, or DeviceStart."
description.ja = "初期化失敗の段階: None、NoBackend (コンテキスト作成)、DeviceOpen、DeviceStart。"
description.ko = "초기화 실패 단계: None, NoBackend (컨텍스트 생성), DeviceOpen, DeviceStart."

["AudioStats::initFailure"]
category = "sound"
description.en = "Last init failure, retained through shutdown and cleared by successful init. tc_get_audio_state includes initFailure with reason, result, backend and requested device only while a failure is recorded."
description.ja = "最後の初期化失敗。shutdown 後も保持し、init 成功でクリアする。tc_get_audio_state は失敗記録があるときだけ reason、result、backend、要求デバイス名を含む initFailure を返す。"
description.ko = "마지막 초기화 실패. shutdown 후에도 유지하며 init 성공 시 지운다. tc_get_audio_state 는 실패 기록이 있을 때만 reason, result, backend, 요청 디바이스 이름을 담은 initFailure 를 반환한다."

["AudioStats::initFailureResult"]
category = "sound"
description.en = "miniaudio result code of the last failed init (for example -401 for a device open failure); 0 when no failure is recorded."
description.ja = "最後の初期化失敗の miniaudio 結果コード (例: デバイスを開けない場合 -401)。失敗記録がなければ 0。"
description.ko = "마지막 초기화 실패의 miniaudio 결과 코드 (예: 디바이스 열기 실패 -401). 실패 기록이 없으면 0."

["AudioStats::initFailureBackend"]
category = "sound"
description.en = "Static backend name resolved from the atomic failure snapshot. Empty when no backend context opened or no failure is recorded."
description.ja = "atomic な失敗スナップショットから解決する静的なバックエンド名。コンテキストが開かなかった場合や失敗記録がない場合は空。"
description.ko = "atomic 실패 스냅샷에서 해석한 정적 백엔드 이름. 컨텍스트를 열지 못했거나 실패 기록이 없으면 비어 있다."
