["EaseFunction"]
category = "animation"
keywords = ["easing", "custom", "curve", "function", "lambda", "tween"]
description.en = "User-defined easing curve: std::function mapping normalized time t (0-1) to progress"
description.ja = "ユーザー定義イージングカーブ：正規化時間 t (0-1) を進捗に写す std::function"
description.ko = "사용자 정의 이징 곡선: 정규화 시간 t (0-1)를 진행도로 사상하는 std::function"
details.en = '''
Alias for `std::function<float(float)>`. Pass to [`Tween::ease`](#Tween::ease) /
`TweenMod::ease` or the free functions [`easeIn`](#easeIn) / [`easeOut`](#easeOut) /
[`easeInOut`](#easeInOut). The function may capture state (a lambda closing over a
live-edited curve object, a functor with members) — it is invoked every frame, so
edits to the captured state take effect immediately. Return values outside 0-1 are
allowed and produce overshoot (Back/Elastic-style). The function is treated as an
ease-in base curve: Out/InOut variants are derived by the standard reflection. A
null function falls back to Linear. See the `customEaseExample`.
'''
details.ja = '''
`std::function<float(float)>` のエイリアス。[`Tween::ease`](#Tween::ease) /
`TweenMod::ease` や自由関数 [`easeIn`](#easeIn) / [`easeOut`](#easeOut) /
[`easeInOut`](#easeInOut) に渡す。関数は状態をキャプチャできる（ライブ編集中の
カーブオブジェクトを閉じ込めたラムダ、メンバを持つファンクタなど）。毎フレーム
呼ばれるため、キャプチャした状態の変更は即座に反映される。0-1 の範囲外の戻り値も
許され、オーバーシュート（Back/Elastic 的な動き）になる。関数は ease-in 基準
カーブとして扱われ、Out/InOut は標準の変換で導出される。null はリニアに
フォールバック。`customEaseExample` を参照。
'''
details.ko = '''
`std::function<float(float)>`의 별칭. [`Tween::ease`](#Tween::ease) /
`TweenMod::ease` 또는 자유 함수 [`easeIn`](#easeIn) / [`easeOut`](#easeOut) /
[`easeInOut`](#easeInOut)에 전달한다. 함수는 상태를 캡처할 수 있으며(라이브 편집
중인 곡선 객체를 담은 람다, 멤버를 가진 펑터 등) 매 프레임 호출되므로 캡처한
상태의 변경이 즉시 반영된다. 0-1 범위 밖의 반환값도 허용되며 오버슈트
(Back/Elastic 스타일)가 된다. 함수는 ease-in 기준 곡선으로 취급되어 Out/InOut은
표준 변환으로 도출된다. null은 Linear로 폴백. `customEaseExample` 참조.
'''
related = ["EaseType", "EaseMode", "Tween<T>", "easeIn", "easeOut", "easeInOut"]

