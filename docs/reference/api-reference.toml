Draw state for [`PrimitiveMode`](#PrimitiveMode)`::Points` meshes, the point-cloud
analogue of [`setStrokeWeight`](#setStrokeWeight). The unit is **logical pixels**
(like `strokeWeight`), so it stays the same apparent size across DPIs. Affects the
`Square` and `Round` [`PointStyle`](#PointStyle) splats; `Pixel` is a true 1px
point and ignores it. Saved/restored by [`pushStyle`](#pushStyle) /
[`popStyle`](#popStyle).
'''
details.ja = '''
[`PrimitiveMode`](#PrimitiveMode)`::Points` メッシュの描画ステートで、点群版の
[`setStrokeWeight`](#setStrokeWeight)。単位は **論理ピクセル**（`strokeWeight` と
同じ）なので、DPI が変わっても見た目のサイズは一定。`Square` と `Round` の
[`PointStyle`](#PointStyle) スプラットに効き、`Pixel` は本物の 1px 点なので無視
される。[`pushStyle`](#pushStyle) / [`popStyle`](#popStyle) で保存・復元される。
