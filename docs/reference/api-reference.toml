details.en = """
Replaces the old `bool` returns of the load APIs (v0.7). `explicit operator bool()`
keeps `if (img.load(...))` working unchanged; assigning to a plain bool needs
`.ok()`. The error taxonomy is deliberately coarse and will grow richer without
breaking compatibility.
"""

