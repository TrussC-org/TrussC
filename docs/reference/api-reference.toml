["Logger::setLogLevel"]
description.en = "Set the console, file and system log levels at once (a later per-output call wins)"
description.ja = "コンソール・ファイル・システムのログレベルを一度に設定（後の出力ごとの呼び出しが優先）"
description.ko = "콘솔·파일·시스템 로그 레벨을 한 번에 설정 (이후의 출력별 호출이 우선)"
details.en = '''
Sets the console, file and system levels at once. It overwrites them when called; a later `setConsoleLogLevel()` / `setFileLogLevel()` / `setSystemLogLevel()` call wins. There is no `getLogLevel()`, since there is no single level to return. The levels of all outputs are explained under [`Logger`](#Logger).

```cpp
Logger& logger = getLogger();
logger.setLogLevel(LogLevel::Warning);       // console, file and system output: all Warning
logger.setFileLogLevel(LogLevel::Verbose);   // then only the file goes down to Verbose
logger.setSystemLogLevel(LogLevel::Silent);  // no OS log (os_log / OutputDebugString)
```
'''
details.ja = '''
コンソール・ファイル・システムのレベルを一度に設定する。呼んだ時点で上書きし、その後の `setConsoleLogLevel()` / `setFileLogLevel()` / `setSystemLogLevel()` が優先される。返すべき単一のレベルが無いので `getLogLevel()` は無い。各出力のレベルの全体像は [`Logger`](#Logger) を参照。

```cpp
Logger& logger = getLogger();
logger.setLogLevel(LogLevel::Warning);       // console, file and system output: all Warning
logger.setFileLogLevel(LogLevel::Verbose);   // then only the file goes down to Verbose
logger.setSystemLogLevel(LogLevel::Silent);  // no OS log (os_log / OutputDebugString)
```
'''
details.ko = '''
콘솔·파일·시스템 레벨을 한 번에 설정한다. 호출 시점에 덮어쓰고, 그 뒤의 `setConsoleLogLevel()` / `setFileLogLevel()` / `setSystemLogLevel()` 호출이 우선한다. 반환할 단일 레벨이 없으므로 `getLogLevel()`은 없다. 각 출력의 레벨 전체는 [`Logger`](#Logger) 참조.

```cpp
Logger& logger = getLogger();
logger.setLogLevel(LogLevel::Warning);       // console, file and system output: all Warning
logger.setFileLogLevel(LogLevel::Verbose);   // then only the file goes down to Verbose
logger.setSystemLogLevel(LogLevel::Silent);  // no OS log (os_log / OutputDebugString)
```
'''

["Logger::setLogFile"]
description.en = "Open a file to receive log output (append mode). A relative path resolves against the data folder (getDataPath), and a missing parent folder is created. On failure it logs an error and returns false, and the current log file stays open (the error line lands in it). After a successful call, getLogFilePath() returns the resolved path"
description.ja = "ログ出力を受けるファイルを開く（追記モード）。相対パスはデータフォルダ（getDataPath）で解決し、親フォルダがなければ作る。失敗時はエラーをログに出して false を返し、今のログファイルは開いたまま残る（エラー行もそこに入る）。成功後の getLogFilePath() は解決済みのパスを返す"
description.ko = "로그 출력을 받을 파일을 엶 (추가 모드). 상대 경로는 데이터 폴더(getDataPath)로 해석하고, 상위 폴더가 없으면 만든다. 실패하면 오류를 로그에 남기고 false를 반환하며, 현재 로그 파일은 열린 채로 남는다 (오류 줄도 거기에 기록됨). 성공 후 getLogFilePath()는 해석된 경로를 반환"

["Logger::setSystemLogLevel"]
description.en = "Set the minimum system (OS log) level: os_log on macOS, OutputDebugStringW on Windows"
description.ja = "システム（OS ログ）の最小レベルを設定：macOS は os_log、Windows は OutputDebugStringW"
description.ko = "시스템(OS 로그) 최소 레벨을 설정: macOS는 os_log, Windows는 OutputDebugStringW"
details.en = '''
Lines below this level are not written to the OS log: `os_log` on macOS (Console.app), `OutputDebugStringW` on Windows (Visual Studio output window, DebugView). Default Notice; `LogLevel::Silent` turns it off. No effect on iOS and Android (the OS log is the console output there; use `setConsoleLogLevel()`) or on Linux and web (no OS log output). The levels of all outputs are explained under [`Logger`](#Logger).

```cpp
Logger& logger = getLogger();
logger.setLogLevel(LogLevel::Warning);       // console, file and system output: all Warning
logger.setFileLogLevel(LogLevel::Verbose);   // then only the file goes down to Verbose
logger.setSystemLogLevel(LogLevel::Silent);  // no OS log (os_log / OutputDebugString)
```
'''
details.ja = '''
このレベル未満の行は OS ログに書かれない。macOS は `os_log`（Console.app）、Windows は `OutputDebugStringW`（Visual Studio の出力ウィンドウ、DebugView）。既定は Notice、`LogLevel::Silent` で止まる。iOS と Android では効かず（OS ログがコンソール出力なので `setConsoleLogLevel()` を使う）、Linux と web にも OS ログ出力は無い。各出力のレベルの全体像は [`Logger`](#Logger) を参照。

```cpp
Logger& logger = getLogger();
logger.setLogLevel(LogLevel::Warning);       // console, file and system output: all Warning
logger.setFileLogLevel(LogLevel::Verbose);   // then only the file goes down to Verbose
logger.setSystemLogLevel(LogLevel::Silent);  // no OS log (os_log / OutputDebugString)
```
'''
details.ko = '''
이 레벨 미만의 줄은 OS 로그에 기록되지 않는다. macOS는 `os_log`(Console.app), Windows는 `OutputDebugStringW`(Visual Studio 출력 창, DebugView). 기본값 Notice, `LogLevel::Silent`면 꺼진다. iOS와 Android에서는 효과가 없고(OS 로그가 콘솔 출력이므로 `setConsoleLogLevel()` 사용), Linux와 web에는 OS 로그 출력이 없다. 각 출력의 레벨 전체는 [`Logger`](#Logger) 참조.

```cpp
Logger& logger = getLogger();
logger.setLogLevel(LogLevel::Warning);       // console, file and system output: all Warning
logger.setFileLogLevel(LogLevel::Verbose);   // then only the file goes down to Verbose
logger.setSystemLogLevel(LogLevel::Silent);  // no OS log (os_log / OutputDebugString)
```
'''

