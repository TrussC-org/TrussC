["setConsoleLogLevel"]
category = "utility"
keywords = ["verbosity", "filter"]
description.en = "Set the minimum log level printed to the console"
description.ja = "コンソールに出力する最小ログレベルを設定"
description.ko = "콘솔에 출력할 최소 로그 레벨을 설정"
details.en = '''
Lines below this level are not printed to the console (stdout / stderr; `os_log` on iOS, logcat on Android). Default Notice; `LogLevel::Silent` turns the console off. The levels of all outputs are explained under [`Logger`](#Logger).

```cpp
setLogLevel(LogLevel::Warning);       // console, file and system output: all Warning
setFileLogLevel(LogLevel::Verbose);   // then only the file goes down to Verbose
setSystemLogLevel(LogLevel::Silent);  // no OS log (os_log / OutputDebugString)
```
'''
details.ja = '''
このレベル未満の行はコンソール（stdout / stderr。iOS は `os_log`、Android は logcat）に出ない。既定は Notice、`LogLevel::Silent` でコンソール出力が止まる。各出力のレベルの全体像は [`Logger`](#Logger) を参照。

```cpp
setLogLevel(LogLevel::Warning);       // console, file and system output: all Warning
setFileLogLevel(LogLevel::Verbose);   // then only the file goes down to Verbose
setSystemLogLevel(LogLevel::Silent);  // no OS log (os_log / OutputDebugString)
```
'''
details.ko = '''
