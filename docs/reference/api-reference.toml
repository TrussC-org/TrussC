["Serial::isConnected"]
keywords = ["unplug", "disconnect", "reconnect", "device lost", "connected"]
description.en = "Whether the port is open and working; turns false after close() or when a read/write call finds the device gone"
description.ja = "ポートが開いていて使えるか。close() 後や、読み書きの呼び出しがデバイスの消失を検出すると false になる"
description.ko = "포트가 열려 있고 사용 가능한지. close() 후나 읽기/쓰기 호출이 장치 소실을 감지하면 false가 됨"
related = ["Serial::setup", "Serial::available", "Serial::readBytes", "Serial::writeBytes", "Serial::onDisconnect", "TcpClient::isConnected"]
details.en = '''
An unplugged USB-serial device (or a hub power loss, a driver reset) is noticed
by [`available()`](#Serial::available), [`readBytes()`](#Serial::readBytes),
[`readByte()`](#Serial::readByte) and [`writeBytes()`](#Serial::writeBytes): the
call closes the port, logs one warning, fires
[`onDisconnect`](#Serial::onDisconnect) and returns its error value
(`available()` returns 0), and `isConnected()` is false from then on. A loop
that checks `isConnected()` and calls [`setup()`](#Serial::setup) again
reconnects once the device is back (see `serialExample`). A quiet device that
sends nothing is not a loss. `isConnected()` itself does not probe the device,
so an app that never reads or writes does not notice an unplug.

Reconnecting re-asserts DTR, which resets auto-reset boards such as most
Arduinos. On Windows, any failure of the underlying ClearCommError / ReadFile /
WriteFile counts as a loss. On Android the flag also turns true after `setup()`
returned false, once the user grants USB permission, and after an unplug it
stays true until one of those calls reports the loss (the USB worker thread
that finds it only records it).

One `Serial` may be used from several threads. Its I/O calls (`available()`,
`readBytes()`, `readByte()`, `writeBytes()`, the flush calls, `drain()`) share
its port lock; receive calls also share a buffer mutex. Opening and closing
(`setup()`, `close()`, closing a lost
port, the destructor, the moves) wait until the I/O calls in progress have
returned, so no call ever uses a closed port, and new I/O calls wait behind
them. `isConnected()` and [`getDevicePath()`](#Serial::getDevicePath) wait
for neither: they answer with the state at that moment. Which thread reads or
writes what, and in which order, is still up to the app. So a long
`writeBytes()` (Windows, Android; see [`writeBytes()`](#Serial::writeBytes))
or `drain()` delays a `setup()` / `close()` on another thread, not the other
I/O calls. Closing also stops the receive worker (desktop polling interval:
50 ms; Android USB read timeout: 250 ms). Desktop moves transfer the worker
with the connection. Windows uses overlapped reads and writes.

A [Logger](#Logger) listener that runs inline may call this `Serial`. One
exception, on Android: the USB worker thread logs too (permission timeout,
connected, lost connection, RX overflow, open errors). A listener running
inline on that thread must not call an I/O call, `setup()` or `close()` on
the `Serial`, nor destroy it. `setup()` and `close()` stop a USB worker and
wait for it, which a worker must not do: on any `Serial`'s USB worker thread
they are refused at once, before they take the lock, with one error log per
thread, and do nothing. Closing a lost port is refused there too: an I/O call
there (on any `Serial`) that finds the device gone neither closes the port
nor fires `onDisconnect`, and `isConnected()` stays true until the next call
on another thread reports the loss. The destructor and a move cannot refuse.
Destroying the `Serial` on its own worker leaves the connection to that
worker, which releases it when it stops. Destroying or moving a `Serial` on a
worker is only safe while no other thread uses that `Serial`: they take its
lock first, and a `close()` / `setup()` on another thread holds it while it
waits for the worker. On another `Serial`'s worker, the destructor also
waits for the destroyed `Serial`'s own worker, and a move assignment for the
worker of the `Serial` it assigns over (that one's previous connection); a
move construction waits for no worker. A worker waited for this way must not
be waiting for this thread in turn (for example, by destroying this worker's
`Serial`, or assigning over it, at the same time). An I/O call there may
deadlock the same way. `isConnected()` and
`getDevicePath()` are safe there. Listen with `Deliver::Main` to run on the
main thread instead.
'''
details.ja = '''
USB シリアル機器の抜去（ハブの電源断、ドライバのリセットなども）は
[`available()`](#Serial::available)、[`readBytes()`](#Serial::readBytes)、
[`readByte()`](#Serial::readByte)、[`writeBytes()`](#Serial::writeBytes) が検出する。
その呼び出しがポートを閉じ、警告を1回ログに出し、
[`onDisconnect`](#Serial::onDisconnect) を発火してエラー値を返し（`available()` は
0）、以後 `isConnected()` は false になる。`isConnected()` を見て
[`setup()`](#Serial::setup) を呼び直すループなら、機器が戻れば再接続できる
（`serialExample` 参照）。何も送ってこないだけの機器は消失とみなさない。
`isConnected()` 自体は機器を調べないので、読み書きを一切しないアプリは抜去に
気づかない。

再接続では DTR が再びアサートされ、多くの Arduino のような自動リセット付きボードは
リセットされる。Windows では下位の ClearCommError / ReadFile / WriteFile の失敗は
すべて消失として扱う。Android では、`setup()` が false を返した後でもユーザーが
USB 許可を与えた時点で true になる。また抜去後は、上の呼び出しのどれかが消失を
報告するまで true のままになる（消失を見つける USB ワーカースレッドは記録するだけ）。

1つの `Serial` を複数のスレッドから使ってよい。I/O の呼び出し（`available()`、
`readBytes()`、`readByte()`、`writeBytes()`、flush 系、`drain()`）はポートのロックを
共有する。受信側の呼び出しはバッファの mutex も共有する。開閉（`setup()`、`close()`、抜けたポートを閉じる処理、デストラクタ、
ムーブ）は、実行中の I/O 呼び出しが戻るのを待ってからポートを触るので、閉じた
ポートを使う呼び出しは起きない。新しい I/O 呼び出しはその後ろで待つ。
`isConnected()` と [`getDevicePath()`](#Serial::getDevicePath) はどちらも待たず、
その時点の状態を返す。どのスレッドが何をどの順に読み書きするかは、アプリ側で
決める必要がある。つまり時間のかかる `writeBytes()`（Windows、Android。
[`writeBytes()`](#Serial::writeBytes) 参照）や `drain()` が遅らせるのは、別スレッドの
`setup()` / `close()` で、ほかの I/O 呼び出しではない。閉じる際は受信ワーカーも
停止する（デスクトップの poll 間隔は 50 ms、Android の USB 読み取りタイムアウトは
250 ms）。デスクトップのムーブではワーカーを接続と一緒に移す。
Windows の読み書きはオーバーラップ I/O を使う。

インラインで動く [Logger](#Logger) のリスナーから、この `Serial` を呼んでよい。
例外は Android で、USB ワーカースレッドもログを出す（許可のタイムアウト、接続、
接続の喪失、受信バッファのあふれ、オープンのエラー）。そのスレッド上でインラインに
動くリスナーから、`Serial` の I/O 呼び出し、`setup()`、`close()` を呼んだり、
`Serial` を破棄したりしてはいけない。`setup()` と `close()` は USB ワーカーを止めて
その終了を待つが、ワーカーがそれをしてはいけない。どの `Serial` の USB ワーカー
スレッド上でも、この2つはロックを取る前にすぐ拒否され、スレッドごとに1回エラーを
ログに出して何もしない。失われたポートを閉じるのもそこでは拒否される。そこで
（どの `Serial` でも）I/O 呼び出しが機器の喪失を見つけても、ポートは閉じられず
`onDisconnect` も発火せず、別スレッドでの次の呼び出しが喪失を報告するまで
`isConnected()` は true のまま。デストラクタとムーブは拒否できない。自分のワーカー上で
`Serial` を破棄すると、接続の後始末はそのワーカーに任され、ワーカーが止まるときに
解放される。ワーカー上での `Serial` の破棄やムーブが安全なのは、ほかのスレッドが
その `Serial` を使っていないときだけ。どちらも先にロックを取るが、別スレッドの
`close()` / `setup()` はロックを持ったままワーカーを待つからだ。別の `Serial` の
ワーカー上では、デストラクタは破棄する `Serial` 自身のワーカーの終了も待ち、
ムーブ代入は代入先の `Serial` のワーカー（その前の接続のもの）の終了も待つ。
ムーブ構築はどのワーカーも待たない。こうして待つワーカーがこのスレッドを待って
いてはいけない（たとえば同時にこのワーカーの `Serial` を破棄したり、それに
ムーブ代入したりしている場合）。そこでの I/O 呼び出しも
同じ理由でデッドロックしうる。`isConnected()` と `getDevicePath()` はそこでも安全。
メインスレッドで動かすには `Deliver::Main` で listen する。
'''
details.ko = '''
USB 시리얼 장치의 분리(허브 전원 차단, 드라이버 리셋 등 포함)는
[`available()`](#Serial::available), [`readBytes()`](#Serial::readBytes),
[`readByte()`](#Serial::readByte), [`writeBytes()`](#Serial::writeBytes)가 감지한다.
해당 호출이 포트를 닫고 경고를 한 번 로그로 남기고
[`onDisconnect`](#Serial::onDisconnect)를 발생시킨 뒤 오류 값을 반환하며
(`available()`은 0), 이후 `isConnected()`는 false가 된다. `isConnected()`를 확인하고
[`setup()`](#Serial::setup)을 다시 호출하는 루프라면 장치가 돌아왔을 때 재연결된다
(`serialExample` 참조). 아무것도 보내지 않을 뿐인 장치는 소실로 보지 않는다.
`isConnected()` 자체는 장치를 조사하지 않으므로, 읽기/쓰기를 전혀 하지 않는 앱은
분리를 알아채지 못한다.

재연결 시 DTR이 다시 어서트되어 대부분의 Arduino 같은 자동 리셋 보드는 리셋된다.
Windows에서는 하위 ClearCommError / ReadFile / WriteFile의 실패를 모두 소실로
취급한다. Android에서는 `setup()`이 false를 반환한 뒤에도 사용자가 USB 권한을
허용하면 true가 되며, 분리 후에는 위 호출 중 하나가 소실을 보고할 때까지 true로
남는다(소실을 찾는 USB 워커 스레드는 기록만 한다).

하나의 `Serial`을 여러 스레드에서 사용해도 된다. I/O 호출(`available()`,
`readBytes()`, `readByte()`, `writeBytes()`, flush 계열, `drain()`)은 포트 락을
공유하며 수신 호출은 버퍼 mutex도 공유한다. 열기와 닫기(`setup()`, `close()`, 소실된 포트를 닫는 처리, 소멸자,
이동)는 진행 중인 I/O 호출이 반환될 때까지 기다린 뒤 포트를 다루므로, 닫힌 포트를
쓰는 호출은 생기지 않는다. 새 I/O 호출은 그 뒤에서 기다린다. `isConnected()`와
[`getDevicePath()`](#Serial::getDevicePath)는 어느 쪽도 기다리지 않고 그 시점의
상태를 반환한다. 어느 스레드가 무엇을 어떤 순서로 읽고 쓸지는 앱이 정해야 한다.
즉 오래 걸리는 `writeBytes()`(Windows, Android. [`writeBytes()`](#Serial::writeBytes)
참조)나 `drain()`이 늦추는 것은 다른 스레드의 `setup()` / `close()`이며, 다른 I/O
호출이 아니다. 닫을 때 수신 워커도 멈춘다(데스크톱 poll 간격: 50 ms,
Android USB 읽기 타임아웃: 250 ms). 데스크톱 이동은 워커와 연결을 함께 옮긴다.
Windows 읽기와 쓰기는 오버랩 I/O를 사용한다.

인라인으로 실행되는 [Logger](#Logger) 리스너에서 이 `Serial`을 호출해도 된다. 예외는
Android로, USB 워커 스레드도 로그를 남긴다(권한 타임아웃, 연결, 연결 소실, 수신
버퍼 넘침, 열기 오류). 그 스레드에서 인라인으로 실행되는 리스너는 `Serial`의 I/O
호출, `setup()`, `close()`를 호출하거나 `Serial`을 파괴해서는 안 된다. `setup()`과
`close()`는 USB 워커를 멈추고 끝나기를 기다리는데, 워커가 그렇게 해서는 안 된다.
어느 `Serial`의 USB 워커 스레드에서든 이 둘은 락을 잡기 전에 바로 거부되며,
스레드마다 한 번 오류를 로그로 남기고 아무것도 하지 않는다. 잃어버린 포트를 닫는
것도 거기서는 거부된다. 거기서 (어느 `Serial`이든) I/O 호출이 장치의 소실을
발견해도 포트를 닫지 않고 `onDisconnect`도 발생하지 않으며, 다른 스레드의 다음
호출이 소실을 보고할 때까지 `isConnected()`는 true로 남는다. 소멸자와 이동은 거부할
수 없다. 자기 워커에서 `Serial`을 파괴하면 연결의 정리는 그 워커에 맡겨져 워커가
멈출 때 해제된다. 워커에서 `Serial`을 파괴하거나 이동하는 것은 다른 스레드가 그
`Serial`을 사용하지 않을 때만 안전하다. 둘 다 먼저 락을 잡는데, 다른 스레드의
`close()` / `setup()`은 락을 잡은 채 워커를 기다리기 때문이다. 다른 `Serial`의
워커에서는 소멸자가 파괴되는 `Serial` 자신의 워커도 기다리고, 이동 대입은 대입
대상 `Serial`의 워커(그 이전 연결의 것)도 기다린다. 이동 생성은 어떤 워커도
기다리지 않는다. 이렇게 기다리는 워커가 이 스레드를 기다리고 있어서는 안 된다
(예를 들어 동시에 이 워커의 `Serial`을 파괴하거나 거기에 이동 대입하는 경우).
거기서의 I/O 호출도
같은 이유로 교착될 수 있다. `isConnected()`와 `getDevicePath()`는 거기서도 안전하다.
메인 스레드에서 실행하려면 `Deliver::Main`으로 listen한다.
'''

