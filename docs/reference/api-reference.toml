["Node::callAfter"]
category = "timers"
keywords = ["timer", "delay", "timeout", "schedule", "later"]
description.en = "Run callback once after delay seconds. A frame timer fired from the update loop: the delay counts down by getDeltaTime() on each update of this node, so it pauses while the node is inactive and resetElapsedTimeCounter() doesn't affect it. Only time after the call counts: it starts with the next update, and in the main window nothing before the call is charged (the earlier part of a long update or setup(), an idle gap or a stall before an event handler or draw() made it). In VSYNC / setFps modes it fires on the first update that starts at least delay after the call. In fixed-Hz update mode it counts step time (1 / updateFps per step): when a frame runs several steps (after a stall, or when updateFps is above the display rate: callAfter(1.0 / 120) made in the first step of a frame at a fixed 120 Hz on a 60 Hz display fires on the next step of that frame) it can fire within that frame, before delay has passed in wall time, and time the loop drops (beyond setMaxUpdateSteps() steps per frame) is not counted, so it fires that much later in wall time. A runtime setFps() / setIndependentFps() that switches the update into a measured mode (VSYNC / setFps) between updates (a key handler, draw()) drops the time since the last update, so the timer fires that much later: under a frame in the usual modes, long only after an idle like EVENT_DRIVEN. Called inside an update, the time counts from that update's start. Changing only the draw rate drops nothing, but switching between synced (setFps) and independent (setIndependentFps) update counts as an update-mode change even at the same rate (setFps(VSYNC) to setIndependentFps(VSYNC, 30) drops up to a frame). Entering a fixed update rate restarts with one step, which can count more or less than the time since the last update (144 Hz display to a fixed 60: the step is ~9.7 ms longer than the 1/144 s since the last update). A node moved during an update, before that update reached it, under a parent the update has already traversed misses that update's countdown (one delta late); a node that moves itself from its own update() is not delayed. In a secondary window, until #307, a timer created in or between its ticks counts the window's whole next delta, time before the call included (after a 3 s setup(), callAfter(2.0) fires about one frame later). Returns a timer id."
description.ja = "delay秒後にcallbackを1回実行。更新ループから発火するフレームタイマーで、このノードの update ごとに getDeltaTime() ずつカウントダウンする。ノードが非アクティブの間は止まり、resetElapsedTimeCounter() の影響は受けない。数えるのは呼び出し後の時間だけで、次の update から数え始め、メインウィンドウでは呼び出し前の時間（長い update や setup() の前半、イベントハンドラや draw() で作る前の待機や停止）は数えない。VSYNC / setFps モードでは、呼び出しから delay 以上経ってから始まる最初の update で発火する。固定Hz update モードではステップ時間（1ステップあたり 1 / updateFps）で数えるので、1フレームで複数のステップを回すとき（停止のあとや、updateFps が表示のレートより高いとき。60Hz の表示で 120Hz 固定なら、フレームの最初のステップで作った callAfter(1.0 / 120) は同じフレームの次のステップで発火する）は、そのフレームの中で、実時間で delay が経つ前に発火しうる。またループが捨てた時間（1フレーム setMaxUpdateSteps() ステップを超える分）は数えられず、実時間ではその分遅れて発火する。実行中の setFps() / setIndependentFps() で update を計測モード（VSYNC / setFps）に切り替えるとき、update の外（イベントハンドラや draw()）で呼ぶと前回の update からの時間は捨てられ、その分遅れて発火する。普段のモードなら1フレーム未満で、長く捨てるのは EVENT_DRIVEN のアイドルのように前のモードで update が長く来なかったときだけ。update の中で呼んだ場合は、その update の開始から数える。draw のレートだけを変えるなら何も捨てない。ただし同期（setFps）と独立（setIndependentFps）の update の切り替えは、レートが同じでも update のモードの変化として扱う（setFps(VSYNC) から setIndependentFps(VSYNC, 30) で最大1フレーム捨てる）。固定の update レートに入るときは1ステップ分で再開するので、前回の update からの時間より多くも少なくも数えうる（144Hz の表示から 60 固定で、そのステップは前回の update からの 1/144 秒より約 9.7 ms 長い）。update 中に、その update がまだ届く前に、すでに巡回した親の下へ移したノードは、その回のカウントダウンを逃してタイマーが1 delta 遅れる。自分の update() で自分を移したノードは遅れない。サブウィンドウでは #307 までは、ティック内やティックの間で作ったタイマーは呼び出し前の時間も含めてそのウィンドウの次の delta を丸ごと数える（3秒かかる setup() のあとの callAfter(2.0) は約1フレーム後に発火する）。タイマーidを返す"
description.ko = "delay초 후 callback을 한 번 실행. 업데이트 루프에서 실행되는 프레임 타이머로, 이 노드의 update마다 getDeltaTime()만큼 카운트다운한다. 노드가 비활성인 동안에는 멈추고 resetElapsedTimeCounter()의 영향을 받지 않는다. 호출 이후의 시간만 센다: 다음 update부터 세기 시작하며, 메인 윈도우에서는 호출 전의 시간(긴 update나 setup()의 앞부분, 이벤트 핸들러나 draw()에서 만들기 전의 대기나 정지)은 세지 않는다. VSYNC / setFps 모드에서는 호출 후 delay 이상 지나서 시작하는 첫 update에서 실행된다. 고정 Hz update 모드에서는 스텝 시간(스텝당 1 / updateFps)으로 세므로, 한 프레임에 여러 스텝을 돌릴 때(정지 후, 또는 updateFps가 표시 레이트보다 높을 때. 60Hz 표시에서 120Hz 고정이면 프레임의 첫 스텝에서 만든 callAfter(1.0 / 120)은 같은 프레임의 다음 스텝에서 실행된다)는 그 프레임 안에서 실제 시간으로 delay가 지나기 전에 실행될 수 있고, 루프가 버린 시간(프레임당 setMaxUpdateSteps() 스텝을 넘는 분)은 세지 않아 실제 시간으로는 그만큼 늦게 실행된다. 실행 중 setFps() / setIndependentFps()로 update를 계측 모드(VSYNC / setFps)로 전환할 때 update 밖(이벤트 핸들러, draw())에서 호출하면 직전 update 이후의 시간이 버려져 그만큼 늦게 실행된다. 평소 모드라면 1프레임 미만이며, 길게 버려지는 것은 EVENT_DRIVEN 대기처럼 이전 모드에서 update가 오래 오지 않았을 때뿐이다. update 안에서 호출하면 그 update의 시작부터 센다. draw 레이트만 바꾸면 아무것도 버려지지 않는다. 단, 동기(setFps)와 독립(setIndependentFps) update 사이의 전환은 레이트가 같아도 update 모드의 변화로 다룬다(setFps(VSYNC)에서 setIndependentFps(VSYNC, 30)으로 바꾸면 최대 1프레임이 버려진다). 고정 update 레이트로 들어갈 때는 1스텝으로 다시 시작하므로 직전 update 이후의 시간보다 많거나 적게 셀 수 있다(144Hz 표시에서 60 고정으로 바꾸면 그 스텝은 직전 update 이후의 1/144초보다 약 9.7 ms 길다). update 중에, 그 update가 아직 닿기 전에 이미 순회한 부모 아래로 옮긴 노드는 그 회의 카운트다운을 놓쳐 타이머가 1 delta 늦어진다. 자신의 update()에서 자신을 옮긴 노드는 늦어지지 않는다. 보조 윈도우에서는 #307까지는 틱 안이나 틱 사이에서 만든 타이머가 호출 전의 시간까지 포함해 그 윈도우의 다음 delta를 통째로 센다(3초 걸리는 setup() 뒤의 callAfter(2.0)은 약 1프레임 뒤에 실행된다). 타이머 id를 반환"
related = ["Node::callAfterAsync", "Node::callEvery", "Node::cancelTimer"]

["Node::callAfterAsync"]
category = "timers"
keywords = ["timer", "delay", "thread", "precise", "background"]
description.en = "Like callAfter, but fired by a precise background scheduler thread (no frame jitter). The callback runs OFF the main thread: guard shared state with a mutex, never draw from it, and don't cancel while holding that mutex. Native only (uses a real thread). Returns a timer id."
description.ja = "callAfterの精密版。バックグラウンドのスケジューラスレッドが正確な時刻に発火（フレームジッタなし）。コールバックはメインスレッド外で走る：共有状態はmutexで保護、描画は禁止、そのmutexを保持したままcancelしない。ネイティブ専用（実スレッド使用）。タイマーidを返す"
description.ko = "callAfter의 정밀 버전. 백그라운드 스케줄러 스레드가 정확한 시각에 실행(프레임 지터 없음). 콜백은 메인 스레드 밖에서 실행됨: 공유 상태는 mutex로 보호, 그리기 금지, 해당 mutex를 들고 cancel하지 말 것. 네이티브 전용(실제 스레드 사용). 타이머 id를 반환"
related = ["Node::callEveryAsync", "Node::cancelAsyncTimer", "Node::callAfter"]

["Node::callEvery"]
category = "timers"
keywords = ["timer", "interval", "repeat", "schedule", "periodic"]
description.en = "Run callback repeatedly every interval seconds. A frame timer counted down by getDeltaTime() like callAfter. Keeps its phase (next due = previous due + interval); when an update comes more than a whole interval late it fires once, not once per missed interval (callEveryCatchUp does that). Like callAfter, a runtime setFps() / setIndependentFps() that switches the update into a measured mode between updates drops the time since the last update (under a frame in the usual modes; see callAfter). Returns a timer id."
description.ja = "interval秒ごとにcallbackを繰り返し実行。callAfter と同じく getDeltaTime() でカウントダウンするフレームタイマー。位相を保つ（次の予定 = 前回の予定 + interval）。update がインターバル1つ分以上遅れたときは、取りこぼした回数分ではなく1回だけ発火する（回数分呼ぶのは callEveryCatchUp）。callAfter と同じく、実行中の setFps() / setIndependentFps() で update を計測モードに切り替えるとき、update の外で呼ぶと前回の update からの時間は捨てられる（普段のモードなら1フレーム未満。callAfter を参照）。タイマーidを返す"
description.ko = "interval초마다 callback을 반복 실행. callAfter처럼 getDeltaTime()으로 카운트다운하는 프레임 타이머. 위상을 유지한다(다음 예정 = 이전 예정 + interval). update가 인터벌 하나 이상 늦으면 놓친 횟수만큼이 아니라 한 번만 실행된다(횟수만큼 호출하는 것은 callEveryCatchUp). callAfter처럼 실행 중 setFps() / setIndependentFps()로 update를 계측 모드로 전환할 때 update 밖에서 호출하면 직전 update 이후의 시간이 버려진다(평소 모드라면 1프레임 미만. callAfter 참조). 타이머 id를 반환"
related = ["Node::callEveryCatchUp", "Node::callEveryAsync", "Node::callAfter", "Node::cancelTimer"]

["Node::callEveryAsync"]
category = "timers"
keywords = ["timer", "interval", "clock", "scheduler", "background"]
description.en = "Like callEvery, but fired by a precise background scheduler thread with no drift (reschedules at absolute times). Ideal for sequencer clocks and LED/MIDI output timing. Same threading rules as callAfterAsync. Native only. Returns a timer id."
description.ja = "callEveryの精密版。バックグラウンドのスケジューラスレッドがドリフトなく発火（絶対時刻で再スケジュール）。シーケンサのクロックやLED/MIDI出力のタイミングに最適。スレッドの注意点はcallAfterAsyncと同じ。ネイティブ専用。タイマーidを返す"
description.ko = "callEvery의 정밀 버전. 백그라운드 스케줄러 스레드가 드리프트 없이 실행(절대 시각으로 재예약). 시퀀서 클럭이나 LED/MIDI 출력 타이밍에 적합. 스레드 주의사항은 callAfterAsync와 동일. 네이티브 전용. 타이머 id를 반환"
related = ["Node::callAfterAsync", "Node::cancelAsyncTimer", "Node::callEvery"]

["Node::callEveryCatchUp"]
category = "timers"
keywords = ["timer", "interval", "repeat", "catch up", "missed", "late", "fixed rate"]
description.en = "Like callEvery, but calls back once for every interval that came due, at most maxCatchUp times per update (maxCatchUp has no default; 0 or -1, any value <= 0, means no limit), e.g. to keep a counter or a simulation in step after a late update. Past the limit the remaining due intervals are dropped and the phase is kept. Cancelling the timer from the callback stops the remaining calls. Without a limit, a long stall in a VSYNC or setFps() loop (or an idle stretch in EVENT_DRIVEN mode) makes it fire that many times at once. In fixed-Hz update mode it counts step time, so time the loop drops beyond its step cap (setMaxUpdateSteps) is not counted. Returns a timer id."
description.ja = "callEvery と同じだが、期限の来たインターバル1つにつき1回ずつ呼ぶ。1回の update で呼ぶのは最大 maxCatchUp 回（maxCatchUp は省略できない。0 や -1 など 0 以下なら上限なし）。update が遅れたあとでもカウンタやシミュレーションを予定どおりに進めたいとき用。上限を超えた分のインターバルは捨て、位相は保つ。コールバック内でこのタイマーをキャンセルすると残りの呼び出しは止まる。上限なしだと、VSYNC / setFps() のループで長く止まったとき（EVENT_DRIVEN モードで長く待機したときも）その回数分を一度に呼ぶ。固定Hz update モードではステップ時間で数えるので、ループがステップ上限（setMaxUpdateSteps）を超えて捨てた時間は数えない。タイマーidを返す"
description.ko = "callEvery와 같지만, 만기된 인터벌 하나마다 한 번씩 호출한다. 한 번의 update에서 호출하는 것은 최대 maxCatchUp회(maxCatchUp은 생략할 수 없다. 0이나 -1 등 0 이하이면 제한 없음). update가 늦은 뒤에도 카운터나 시뮬레이션을 예정대로 진행시키고 싶을 때 쓴다. 제한을 넘는 인터벌은 버리고 위상은 유지한다. 콜백 안에서 이 타이머를 취소하면 남은 호출은 멈춘다. 제한이 없으면 VSYNC / setFps() 루프가 오래 멈췄을 때(EVENT_DRIVEN 모드에서 오래 대기했을 때도) 그 횟수만큼 한꺼번에 호출한다. 고정 Hz update 모드에서는 스텝 시간으로 세므로, 루프가 스텝 상한(setMaxUpdateSteps)을 넘어 버린 시간은 세지 않는다. 타이머 id를 반환"
related = ["Node::callEvery", "Node::cancelTimer", "setMaxUpdateSteps"]

