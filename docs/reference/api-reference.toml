["Thread"]
keywords = ["background", "worker", "async", "concurrent", "ofthread"]
description.en = "Base class for background threads (ofThread compatible). Subclass it, override the protected pure-virtual threadedFunction() with a while (isThreadRunning()) { ... } loop, then control it with startThread()/stopThread()/waitForThread(). A protected mutex dataMutex_ is available for sharing data. A subclass must call waitForThread() in its own destructor: the base destructor also stops and joins, but only after the subclass members are destroyed, and logs a warning if threadedFunction() is still running. A subclass that does not wait may be destroyed before its worker has called threadedFunction() (e.g. right after startThread()), and then it depends on when the worker makes that call: while the subclass destructor runs, the real threadedFunction() runs and may use members that are already destroyed (undefined behaviour, usually without an abort); at about the moment ~Thread() starts, it can still end in \"pure virtual method called\"; after that, threadedFunction() is skipped and the base destructor warns and joins. Only waiting in the subclass destructor (waitForThread()) rules out all three. Hold subclasses via unique_ptr / shared_ptr (moving a Thread is deprecated: it does not move the running thread)."
description.ja = "バックグラウンドスレッドの基底クラス（ofThread 互換）。サブクラス化して protected の純粋仮想 threadedFunction() を while (isThreadRunning()) { ... } ループでオーバーライドし、startThread()/stopThread()/waitForThread() で制御する。データ共有用に protected の mutex dataMutex_ が利用できる。サブクラスは自分のデストラクタで必ず waitForThread() を呼ぶこと: 基底のデストラクタも停止して join するが、それはサブクラスのメンバが破棄された後になる。threadedFunction() がまだ動いていれば警告をログに出す。待機しないサブクラスは、ワーカーが threadedFunction() を呼ぶ前に破棄されうる（例: startThread() の直後）。その場合はワーカーがその呼び出しに達するタイミング次第になる: サブクラスのデストラクタ実行中なら本物の threadedFunction() が走り、破棄済みのメンバを使いうる（未定義動作で、たいてい異常終了もしない）。~Thread() の開始とほぼ同時なら \"pure virtual method called\" で強制終了しうる。それより後なら threadedFunction() はスキップされ、基底のデストラクタが警告を出して join する。3つすべてを防げるのは、サブクラスのデストラクタで待つ（waitForThread()）ことだけ。サブクラスは unique_ptr / shared_ptr で保持する（Thread のムーブは非推奨: 実行中のスレッドは移らない）"
description.ko = "백그라운드 스레드의 기반 클래스(ofThread 호환). 서브클래싱하여 protected 순수 가상 threadedFunction()을 while (isThreadRunning()) { ... } 루프로 오버라이드한 뒤 startThread()/stopThread()/waitForThread()로 제어. 데이터 공유용 protected mutex dataMutex_가 제공됨. 서브클래스는 자신의 소멸자에서 반드시 waitForThread()를 호출해야 함: 기반 소멸자도 정지 후 join하지만 서브클래스 멤버가 파괴된 뒤에 실행됨. threadedFunction()이 아직 실행 중이면 경고를 로그로 남김. 대기하지 않는 서브클래스는 워커가 threadedFunction()을 호출하기 전에 파괴될 수 있음(예: startThread() 직후). 그 경우 워커가 그 호출에 도달하는 시점에 따라 달라짐: 서브클래스 소멸자 실행 중이면 실제 threadedFunction()이 실행되어 이미 파괴된 멤버를 사용할 수 있음(정의되지 않은 동작이며, 대개 비정상 종료도 없음). ~Thread() 시작과 거의 같은 순간이면 \"pure virtual method called\"로 강제 종료될 수 있음. 그 이후라면 threadedFunction()은 건너뛰고 기반 소멸자가 경고를 남긴 뒤 join함. 세 경우를 모두 막는 방법은 서브클래스 소멸자에서 대기(waitForThread())하는 것뿐임. 서브클래스는 unique_ptr / shared_ptr로 보유(Thread 이동은 deprecated: 실행 중인 스레드는 옮겨지지 않음)"
related = ["ThreadChannel<T>", "isMainThread"]

