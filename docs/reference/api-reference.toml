details.en = '''
Opens the port as 8N1 without flow control and returns false when it cannot
be opened or configured. Any rate the driver supports works: on macOS and Linux,
rates without a termios B-constant (250000, 74880, 921600 on macOS, ...) are set
with `IOSSIOSPEED` (macOS) or `termios2` (Linux); on Windows the rate goes to
the driver unchanged. A rate the driver rejects makes `setup()` log an error
and return false, instead of opening at another speed. A Linux driver may
instead replace any rate, with or without a B-constant, by another one (often
9600, for example an FTDI chip asked for more than its maximum): `setup()`
reads the rate back and fails when it is more than 2% off, and accepts a
closer one (the driver's nearest divisor) with a warning that names it. A
driver that applies no rate at all (a USB gadget's `/dev/ttyGS*`,
`usb_serial_generic`, xHCI DbC) keeps its old rate whatever is asked; `setup()`
tells it apart by trying one more standard rate, and then succeeds with a
warning that the rate has no effect there.

Calling `setup()` again, for example to reconnect after
[`isConnected()`](#Serial::isConnected) turned false, closes the previous port
first; when it was still open, that fires
[`onDisconnect`](#Serial::onDisconnect) with `wasClean = true`. Opening
re-asserts DTR, which resets auto-reset boards such as most Arduinos.
'''
details.ja = '''
8N1・フロー制御なしでポートを開き、開けない・設定できないときは false を返す。
ドライバが対応するレートなら何でも使える。macOS / Linux では termios に
B 定数が無いレート（250000、74880、macOS の 921600 など）を `IOSSIOSPEED`（macOS）
または `termios2`（Linux）で設定する。Windows ではレートをそのままドライバに渡す。
ドライバが拒否したレートでは、別の速度で開くのではなく、エラーをログに出して
false を返す。Linux のドライバはレートを拒否せず、B 定数の有無にかかわらず
別のレート（多くは 9600。たとえば FTDI チップに上限を超えるレートを指定したとき）に
置き換えることがある。`setup()` は適用されたレートを読み戻し、要求と 2% を超えて
違えば失敗する。それより近いレート（ドライバが出せる最も近い値）は、
そのレートを示す警告を出して受け入れる。レートをまったく適用しないドライバ
（USB ガジェットの `/dev/ttyGS*`、`usb_serial_generic`、xHCI DbC）は、何を指定しても
元のレートのままになる。`setup()` は別の標準レートをもう1つ試してこれを見分け、
その場合は「レートは効かない」という警告を出して成功する。

[`isConnected()`](#Serial::isConnected) が false になった後の再接続などで
`setup()` を呼び直すと、先に前のポートを閉じる。そのポートがまだ開いていれば
[`onDisconnect`](#Serial::onDisconnect) が `wasClean = true` で発火する。
開くと DTR が再びアサートされ、多くの Arduino のような自動リセット付きボードは
リセットされる。
'''
details.ko = '''
8N1, 흐름 제어 없음으로 포트를 열며, 열 수 없거나 설정할 수 없으면 false를 반환한다.
드라이버가 지원하는 속도라면 무엇이든 쓸 수 있다. macOS / Linux에서는 termios에
B 상수가 없는 속도(250000, 74880, macOS의 921600 등)를 `IOSSIOSPEED`(macOS) 또는
`termios2`(Linux)로 설정한다. Windows에서는 속도를 그대로 드라이버에 전달한다.
드라이버가 거부한 속도라면 다른 속도로 여는 대신 오류를 로그로 남기고 false를
반환한다. Linux 드라이버는 속도를 거부하지 않고, B 상수가 있든 없든 다른 속도
(대개 9600. 예를 들어 FTDI 칩에 최대치를 넘는 속도를 지정했을 때)로 바꿔 적용하기도
한다. `setup()`은 적용된 속도를 다시 읽어 요청과 2%를 넘게 다르면 실패하고,
그보다 가까운 속도(드라이버가 낼 수 있는 가장 가까운 값)는 그 속도를 알리는 경고와
함께 받아들인다. 속도를 전혀 적용하지 않는 드라이버(USB 가젯의 `/dev/ttyGS*`,
`usb_serial_generic`, xHCI DbC)는 무엇을 지정해도 이전 속도를 유지한다. `setup()`은
다른 표준 속도를 하나 더 시도해 이를 구별하고, 그 경우 속도가 효과가 없다는 경고와
함께 성공한다.

[`isConnected()`](#Serial::isConnected)가 false가 된 뒤 재연결하는 경우 등
`setup()`을 다시 호출하면 이전 포트를 먼저 닫는다. 그 포트가 아직 열려 있었으면
[`onDisconnect`](#Serial::onDisconnect)가 `wasClean = true`로 발생한다. 열 때 DTR이
다시 어서트되어 대부분의 Arduino 같은 자동 리셋 보드는 리셋된다.
'''

["Serial::writeByte"]
description.en = "Write a single byte; true on success"
description.ja = "1バイト書く。成功でtrue"
description.ko = "1바이트를 씀. 성공 시 true"

["Serial::writeBytes"]
description.en = "Write bytes; returns actual count or -1 on error (a lost device also closes the port and fires onDisconnect)"
description.ja = "バイトを書く。実際の書き込み数、エラー時-1を返す（デバイスの消失を検出するとポートを閉じ、onDisconnect も発火）"
description.ko = "바이트를 씀. 실제 쓴 수 또는 오류 시 -1 반환 (장치 소실을 감지하면 포트를 닫고 onDisconnect도 발생)"
related = ["Serial::isConnected", "Serial::onDisconnect"]
details.en = '''
How long it may take depends on the platform:

- **macOS / Linux:** never blocks (the port is non-blocking). It may write
  fewer bytes than asked, or return -1 while the output buffer is full; the
  port stays open.
- **Windows:** waits until the driver has taken every byte, but at most 4
  times the time the bytes take on the wire at the port's rate (10 bits per
  byte, rounded up to whole ms per byte) plus 5 s. At 9600 baud that is
  5 ms per byte (64 KB in about 5.5 min), at 40000 baud and up 1 ms per byte
  (64 KB in about 70 s). A native USB device ignores the rate, so this is
  only a generous ceiling. On a timeout it returns the bytes written so far
  (possibly 0) and logs one warning per connection; the port stays open and
  `onDisconnect` does not fire. A failed write still counts as a loss.
- **Android:** sends the data in chunks of up to 16 KB and waits for the
  device to take each one, at most the Windows rule above applied to the
  chunk: 16 KB at 9600 baud gets about 87 s, at 115200 baud about 21 s. On a
  timeout it returns the bytes of the chunks that completed (possibly 0) and
  logs one warning per connection; the port stays open. Android does not
  report how much of a timed-out chunk went out, so some bytes past the
  returned count may have reached the device too.

A write that must never stall the app goes on a thread of its own: receive
calls do not wait for it.
'''
details.ja = '''
どれだけ時間がかかりうるかはプラットフォームによる。

- **macOS / Linux:** ブロックしない（ポートはノンブロッキング）。指定より少ない
  バイト数しか書けないことや、出力バッファがいっぱいの間は -1 を返すことがある。
  ポートは開いたまま。
- **Windows:** ドライバが全バイトを受け取るまで待つ。ただし上限は、そのポートの
  ボーレートでバイト列が線上にかかる時間の4倍（1バイトを10ビットとし、1バイト
  あたり整数 ms に切り上げ）に 5 秒を足した時間。9600 baud なら1バイト 5 ms
  （64 KB で約 5.5 分）、40000 baud 以上なら1バイト 1 ms（64 KB で約 70 秒）。
  ネイティブ USB の機器はレートを無視するので、これは余裕のある上限にすぎない。
  タイムアウトすると、それまでに書けたバイト数（0 もありうる）を返し、接続ごとに
  1回だけ警告をログに出す。ポートは開いたままで、`onDisconnect` も発火しない。
  書き込みが失敗した場合は、今までどおり消失として扱う。
- **Android:** データを最大 16 KB ずつに分けて送り、機器がそれぞれを受け取るのを
  待つ。上限は上の Windows の規則をその塊に当てはめた時間で、16 KB なら 9600 baud
  で約 87 秒、115200 baud で約 21 秒。タイムアウトすると、送り終えた塊のバイト数
  （0 もありうる）を返し、接続ごとに1回だけ警告をログに出す。ポートは開いたまま。
  タイムアウトした塊がどこまで送れたかは Android が報告しないので、返した数より
  先のバイトも機器に届いていることがある。

アプリを止めたくない書き込みは、専用のスレッドから行う。ほかの I/O 呼び出しは
それを待たない。
'''
details.ko = '''
얼마나 걸릴 수 있는지는 플랫폼에 따라 다르다.

- **macOS / Linux:** 블록되지 않는다(포트가 논블로킹). 요청보다 적은 바이트만 쓰거나,
  출력 버퍼가 가득 찬 동안 -1을 반환할 수 있다. 포트는 열린 채로 남는다.
- **Windows:** 드라이버가 모든 바이트를 받을 때까지 기다린다. 단 상한은 그 포트의
  보드레이트로 바이트열이 선로에서 걸리는 시간의 4배(1바이트를 10비트로 보고,
  1바이트당 정수 ms로 올림)에 5초를 더한 시간이다. 9600 baud라면 1바이트 5 ms
  (64 KB에 약 5.5분), 40000 baud 이상이면 1바이트 1 ms(64 KB에 약 70초). 네이티브
  USB 장치는 속도를 무시하므로 이는 여유 있는 상한일 뿐이다. 타임아웃되면 그때까지
  쓴 바이트 수(0일 수도 있음)를 반환하고, 연결마다 한 번만 경고를 로그로 남긴다.
  포트는 열린 채로 남고 `onDisconnect`도 발생하지 않는다. 쓰기가 실패하면 기존대로
  소실로 취급한다.
- **Android:** 데이터를 최대 16 KB씩 나누어 보내고, 장치가 각각을 받기를
  기다린다. 상한은 위의 Windows 규칙을 그 덩어리에 적용한 시간으로, 16 KB라면
  9600 baud에서 약 87초, 115200 baud에서 약 21초. 타임아웃되면 다 보낸 덩어리의
  바이트 수(0일 수도 있음)를 반환하고, 연결마다 한 번만 경고를 로그로 남긴다.
  포트는 열린 채로 남는다. 타임아웃된 덩어리가 어디까지 보내졌는지는 Android가
  알려 주지 않으므로, 반환한 수보다 뒤의 바이트도 장치에 도달했을 수 있다.

앱을 멈추게 하면 안 되는 쓰기는 전용 스레드에서 한다. 다른 I/O 호출은 그것을
기다리지 않는다.
'''

