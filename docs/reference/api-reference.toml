description.ko = "AudioRecorder::start()에 전달하는 설정. 샘플 포맷(S16/F32)과 채널 맵(생략 가능)"
related = ["AudioRecorder", "Sound"]

["AudioRecordSettings::SampleFormat"]
category = "sound"
keywords = ["s16", "f32", "float", "pcm", "bit depth"]
description.en = "WAV sample format: S16 = 16-bit PCM (default), F32 = 32-bit IEEE float (headroom survives, no clipping in the file)"
description.ja = "WAVのサンプルフォーマット。S16 = 16bit PCM（デフォルト）、F32 = 32bit IEEE float（ヘッドルームが残りファイル内でクリップしない）"
description.ko = "WAV 샘플 포맷. S16 = 16bit PCM(기본값), F32 = 32bit IEEE float(헤드룸이 유지되어 파일에서 클리핑되지 않음)"
value_desc.S16.en = "16-bit PCM (default)"
value_desc.F32.en = "32-bit IEEE float"

["AudioRecordSettings::format"]
category = "sound"
keywords = ["s16", "f32", "bit depth"]
description.en = "Sample format written to the file (SampleFormat::S16 default)"
description.ja = "ファイルに書き込むサンプルフォーマット（デフォルト SampleFormat::S16）"
description.ko = "파일에 기록할 샘플 포맷 (기본 SampleFormat::S16)"

["AudioRecordSettings::channelMap"]
category = "sound"
keywords = ["routing", "downmix", "mono", "stereo", "matrix"]
description.en = "Channel routing, same structure as Sound::setChannelMap(): outer index = file channel, inner list = engine channels summed into it (unnormalized; clipping is the caller's choice). Empty = auto: 1ch engine to mono, 2ch to stereo, 3ch+ to averaged mono"
description.ja = "チャンネルルーティング。Sound::setChannelMap() と同じ構造で、外側=ファイル側ch、内側=そこへ合算するエンジン側chのリスト（正規化なし・クリップは呼び出し側の裁量）。空=自動: エンジン1ch→モノ、2ch→ステレオ、3ch以上→平均ダウンミックスのモノ"
description.ko = "채널 라우팅. Sound::setChannelMap()과 같은 구조로, 바깥쪽=파일 채널, 안쪽=그 채널로 합산할 엔진 채널 목록(비정규화, 클리핑은 호출자의 선택). 비어 있으면 자동: 엔진 1ch→모노, 2ch→스테레오, 3ch 이상→평균 다운믹스 모노"
related = ["Sound"]

["AudioRecorder"]
category = "sound"
keywords = ["record", "wav", "capture", "master", "mix", "tap", "bounce"]
description.en = "Records the engine's master output (everything the speakers get, Sounds and audioOut synthesis alike) to a WAV file. Taps audioOut at Monitor priority; file IO runs on a background thread, the audio thread never blocks. Every file has a 36-byte JUNK chunk after the RIFF header, so the samples start at byte 80 (S16) or 92 (F32). A take over 4 GiB of samples (about 3.1 h of 48 kHz stereo F32) is written as RF64 (EBU Tech 3306); older readers without RF64 support can't open it"
description.ja = "エンジンのマスター出力（Sound再生もaudioOut合成も含む、スピーカーに出る音そのもの）をWAVファイルに録音する。audioOutをMonitor優先度でタップし、ファイルIOはバックグラウンドスレッドで行う（オーディオスレッドはブロックしない）。どのファイルも RIFF ヘッダの後に 36 バイトの JUNK チャンクを持つので、サンプルは 80 バイト目 (S16) か 92 バイト目 (F32) から始まる。サンプルが 4 GiB を超えるテイク (48 kHz ステレオ F32 で約 3.1 時間) は RF64 (EBU Tech 3306) で書かれ、RF64 に対応していない古いリーダーでは開けない"
description.ko = "엔진의 마스터 출력(스피커로 나가는 소리 그대로, Sound 재생과 audioOut 합성 포함)을 WAV 파일로 녹음. audioOut을 Monitor 우선순위로 탭하고 파일 IO는 백그라운드 스레드에서 수행(오디오 스레드는 블록되지 않음). 모든 파일은 RIFF 헤더 뒤에 36바이트 JUNK 청크를 가지므로 샘플은 80바이트째(S16) 또는 92바이트째(F32)부터 시작한다. 샘플이 4 GiB를 넘는 테이크(48 kHz 스테레오 F32로 약 3.1시간)는 RF64(EBU Tech 3306)로 기록되며, RF64를 지원하지 않는 오래된 리더에서는 열 수 없다"
related = ["AudioRecordSettings", "AudioEngine", "ScreenRecorder"]

["AudioRecorder::start"]
category = "sound"
keywords = ["begin", "record", "wav"]
description.en = "Start recording the master mix into a WAV file (relative paths resolve via getDataPath). The audio engine must already be initialized; returns false otherwise or when the file cannot be opened. A path inside the app bundle (macOS / iOS) is refused: an error naming getUserDataPath() is logged and false returned."
description.ja = "マスターミックスのWAV録音を開始（相対パスは getDataPath で解決）。オーディオエンジンが初期化済みであること。未初期化またはファイルが開けない場合は false。アプリバンドル内のパス（macOS / iOS）は拒否され、getUserDataPath() を案内するエラーをログに出して false を返す"
description.ko = "마스터 믹스의 WAV 녹음을 시작(상대 경로는 getDataPath로 해석). 오디오 엔진이 초기화되어 있어야 하며, 아니면(또는 파일을 열 수 없으면) false 반환. 앱 번들 안의 경로(macOS / iOS)는 거부되며, getUserDataPath()를 안내하는 오류를 로그에 남기고 false 반환"

["AudioRecorder::stop"]
category = "sound"
keywords = ["end", "finalize", "close"]
description.en = "Stop and finalize the file (patches the WAV header sizes; a take over 4 GiB of samples becomes RF64, logged as a notice; a failed file write, such as a full disk, is logged as an error instead); the buffer a capture was still copying is included. Safe to call when not recording; also runs automatically on destruction. Waits on AudioEngine::waitForAudioCallbacks(): for every audioOut / audioIn listener running at that moment, not only the recorder's (usually well under one buffer). Don't call it while holding a lock that such a listener takes: it would wait up to one second and the audio drops out meanwhile"
description.ja = "録音を停止しファイルを確定する（WAVヘッダのサイズを書き戻す。サンプルが 4 GiB を超えたテイクは RF64 にして notice ログを出す。ディスクが一杯などでファイル書き込みが失敗していたら、代わりに error ログを出す）。取り込み途中だったバッファも含まれる。未録音時に呼んでも安全。デストラクタでも自動実行される。AudioEngine::waitForAudioCallbacks() で待つので、レコーダーの分だけでなく、その時点で動いている audioOut / audioIn のリスナーすべてを待つ (通常はバッファ 1 つ分より短い)。そうしたリスナーが取るロックを持ったまま呼ばないこと。最大 1 秒止まり、その間は音が途切れる"
description.ko = "녹음을 정지하고 파일을 마무리(WAV 헤더 크기를 기록. 샘플이 4 GiB를 넘은 테이크는 RF64로 만들고 notice 로그를 남긴다. 디스크가 가득 차는 등으로 파일 쓰기가 실패했다면 대신 error 로그를 남긴다). 캡처 도중이던 버퍼도 포함된다. 녹음 중이 아닐 때 호출해도 안전하며 소멸자에서도 자동 실행됨. AudioEngine::waitForAudioCallbacks() 로 기다리므로 레코더 것만이 아니라 그 시점에 실행 중인 audioOut / audioIn 리스너 전부를 기다린다 (보통 버퍼 하나 분량보다 짧다). 그런 리스너가 잡는 락을 쥔 채로 호출하지 말 것. 최대 1 초 멈추고 그동안 소리가 끊긴다"

["AudioRecorder::isRecording"]
category = "sound"
keywords = ["state", "active", "status"]
description.en = "True while recording"
description.ja = "録音中なら true"
description.ko = "녹음 중이면 true"

["AudioRecorder::getRecordedSeconds"]
category = "sound"
