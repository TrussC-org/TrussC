["Environment"]
keywords = ["ibl", "skybox", "hdr"]
description.en = "IBL environment map for PBR ambient lighting (irradiance + prefilter + BRDF LUT). Destruction touches window context state and must run on the main thread, like Light destruction."
description.ja = "PBR ambient用IBL environment map（irradiance + prefilter + BRDF LUT）。破棄はウィンドウコンテキストの状態に触れるため、Light と同様にメインスレッドで行う必要がある。"
description.ko = "PBR 앰비언트용 IBL 환경맵 (이래디언스 + 프리필터 + BRDF LUT). 소멸 시 윈도우 컨텍스트 상태에 접근하므로 Light와 마찬가지로 메인 스레드에서 소멸시켜야 함."
of_category = "light-types"
related = ["setEnvironment", "getEnvironment", "Light", "Material", "Fbo"]
details = '''
On iOS/iPadOS Safari (WebKit, wasm), IBL baking is skipped automatically: cube-face
render targets freeze the canvas there. loadFromHDR()/loadProcedural() return false and
the scene falls back to flat ambient (~3% of albedo on non-metals) + direct lights.
Direct lighting, shadows, and all PBR material parameters still work on every platform.
Don't rely on IBL reflections when targeting iOS web.
'''

