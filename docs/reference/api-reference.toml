["setIndependentFps"]
category = "window_system"
keywords = ["framerate", "update rate", "decouple", "tick rate"]
description.en = "Set independent update and draw rates. A fixed update rate runs fixed steps (getDeltaTime() is 1 / updateFps for each), at most setMaxUpdateSteps() per frame (default 10): time beyond that (after a stall, when update() is too slow, or when updateFps is more than that many times the display rate) is dropped with a one-time warning. Switching at runtime starts the new rate from the switch (no catch-up; on the next frame a fixed update rate runs one step, a VSYNC update's getDeltaTime() counts from the call, or from the update's start when called inside an update, and a fixed draw rate draws). Calling it again with the current rates does nothing, and changing only the draw rate keeps the update's phase and drops no time; switching between a synced (setFps) and an independent update counts as an update-mode change even at the same rate (setFps(VSYNC) to setIndependentFps(VSYNC, 30) drops up to a frame). Entering a fixed update rate restarts with one step, which can count more or less than the time since the last update (from a 144 Hz display to a fixed 60, the step is ~9.7 ms longer than the 1/144 s since the last update); entering a VSYNC update drops the time since the last update (under a frame in the usual modes, long only after an idle like EVENT_DRIVEN), and on that frame, called outside update(), its dt counts only from the call"
description.ja = "updateとdrawのフレームレートを個別に設定。固定の update レートは固定ステップで回り（各ステップの getDeltaTime() は 1 / updateFps）、1フレームあたり最大 setMaxUpdateSteps() ステップ（既定10）。それを超える分（停止後、update() が遅すぎる場合、updateFps がディスプレイのレートのその倍数を超える場合）は捨てられ、一度だけ警告が出る。実行中の切り替えは切り替えた時点から新しいレートで始まる（取り戻しはせず、次のフレームで固定 update レートは1ステップ回り、VSYNC の update の getDeltaTime() は呼び出しから（update の中で呼んだならその update の開始から）数え、固定 draw レートは描画する）。今と同じレートで呼んでも何もせず、draw のレートだけを変えても update の位相は保たれ、時間も捨てない。ただし同期（setFps）と独立の update の切り替えは、レートが同じでも update のモードの変化として扱う（setFps(VSYNC) から setIndependentFps(VSYNC, 30) で最大1フレーム捨てる）。固定の update レートに入るときは1ステップ分で再開するので、前回の update からの時間より多くも少なくも数えうる（144Hz の表示から 60 固定で、そのステップは前回の update からの 1/144 秒より約 9.7 ms 長い）。VSYNC の update に入るときは前回の update からの時間を捨て（普段のモードなら1フレーム未満、長くなるのは EVENT_DRIVEN のアイドルのあとだけ）、そのフレームで update の外から呼んだ場合、dt は呼び出しからの時間になる"
description.ko = "update와 draw의 프레임레이트를 독립적으로 설정. 고정 update 레이트는 고정 스텝으로 돌며(각 스텝의 getDeltaTime()은 1 / updateFps) 프레임당 최대 setMaxUpdateSteps() 스텝(기본값 10). 이를 넘는 시간(정지 후, update()가 너무 느릴 때, updateFps가 디스플레이 레이트의 그 배수를 넘을 때)은 버려지고 경고가 한 번 출력된다. 실행 중 전환은 전환 시점부터 새 레이트로 시작한다(따라잡기 없이, 다음 프레임에 고정 update 레이트는 한 스텝 돌고, VSYNC update의 getDeltaTime()은 호출 시점부터(update 안에서 호출했다면 그 update의 시작부터) 세며, 고정 draw 레이트는 그린다). 현재와 같은 레이트로 호출하면 아무것도 하지 않으며, draw 레이트만 바꾸면 update의 위상이 유지되고 시간도 버려지지 않는다. 단, 동기(setFps)와 독립 update 사이의 전환은 레이트가 같아도 update 모드의 변화로 다룬다(setFps(VSYNC)에서 setIndependentFps(VSYNC, 30)으로 바꾸면 최대 1프레임이 버려진다). 고정 update 레이트로 들어갈 때는 1스텝으로 다시 시작하므로 직전 update 이후의 시간보다 많거나 적게 셀 수 있다(144Hz 표시에서 60 고정으로 바꾸면 그 스텝은 직전 update 이후의 1/144초보다 약 9.7 ms 길다). VSYNC update로 들어갈 때는 직전 update 이후의 시간이 버려지며(평소 모드라면 1프레임 미만, 길어지는 것은 EVENT_DRIVEN 대기 뒤뿐), 그 프레임에서 update 밖에서 호출한 경우 dt는 호출 시점부터의 시간이 된다"
related = ["setFps", "getFpsSettings", "setMaxUpdateSteps"]

