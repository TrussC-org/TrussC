["ScreenRecorder"]
category = "video"
keywords = ["capture", "record", "screencast", "grab", "mp4"]
description.en = "Captures the rendered output to a video file (start/stop recording of the on-screen frames)"
description.ja = "描画結果を動画ファイルにキャプチャする（画面フレームの録画開始/停止）"
description.ko = "렌더링 출력을 비디오 파일로 캡처(화면 프레임의 녹화 시작/정지)"
related = ["VideoWriter", "startRecording", "Fbo"]
platform_note.en = "Built on VideoWriter, so it is non-functional on web (writer.open() fails). Works on all native platforms. macOS additionally uses an async zero-copy swapchain capture path (TC_ASYNC_SCREEN_CAPTURE / lockFrame+submitFrame); others fall back to synchronous grabScreen()."
platform_note.ja = "VideoWriter 上に構築されるため web では機能しない（writer.open 失敗）。ネイティブ全対応。macOS のみ非同期ゼロコピー capture（lockFrame/submitFrame）、他は同期 grabScreen フォールバック。"

