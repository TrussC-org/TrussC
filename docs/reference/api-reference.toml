["getElapsedTimef"]
category = "time_elapsed"
keywords = ["time", "seconds", "uptime", "runtime", "clock"]
of = ["ofGetElapsedTimef"]
description.en = "Elapsed seconds (float) since program start. Same clock as getElapsedTime(); a float loses precision after about a day of uptime (7.8 ms steps at 18 h), so use it for animation and display, and getElapsedTime() (double) where precision matters"
description.ja = "プログラム開始からの経過秒数（float）。getElapsedTime() と同じクロック。float は稼働約1日で精度が落ちる（18時間で7.8ms刻み）ので、アニメーションや表示用に使い、精度が要るところでは getElapsedTime()（double）を使う"
description.ko = "프로그램 시작 이후 경과 시간(초, float). getElapsedTime()과 같은 시계. float는 가동 약 하루 후 정밀도가 떨어지므로(18시간에 7.8ms 단위) 애니메이션·표시용으로 쓰고, 정밀도가 필요한 곳에는 getElapsedTime()(double)을 쓴다"
related = ["getElapsedTime", "getFrameElapsedTime", "resetElapsedTimeCounter"]

