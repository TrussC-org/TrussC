["runApp"]
category = "lifecycle"
keywords = ["main", "start", "launch", "boot", "entry"]
description.en = "Start the application main loop with your App subclass. Templated on the app type — call TC_RUN_APP(MyApp) (or runApp<MyApp>()) from main(). On desktop, returns 1 if window or GPU startup fails before setup() runs, otherwise 0. On Linux, no available X display causes an abort (a nonzero process status). TC_RUN_APP passes this status to main(); Android and Web use OS/browser-owned loops and do not report shutdown through this return value."
description.ja = "App サブクラスを指定してアプリのメインループを開始。アプリ型でテンプレート化されているので、main() から TC_RUN_APP(MyApp)（または runApp<MyApp>()）で呼ぶ。 デスクトップでは、ウィンドウや GPU の起動に失敗して setup() が実行されなかった場合は 1、それ以外は 0 を返す。Linux で X のディスプレイが無い場合は abort で終了する（終了ステータスは 0 ではない）。TC_RUN_APP はこの終了コードを main() に渡す。Android と Web は OS／ブラウザがループを管理するため、この戻り値で終了を通知しない。"
description.ko = "App 서브클래스로 애플리케이션 메인 루프를 시작. 앱 타입으로 템플릿화되어 있으므로 main()에서 TC_RUN_APP(MyApp)(또는 runApp<MyApp>())로 호출. 데스크톱에서는 창 또는 GPU 시작 실패로 setup()이 실행되지 않으면 1, 그 외에는 0을 반환한다. Linux에서 X 디스플레이가 없으면 abort로 종료한다(종료 상태는 0이 아님). TC_RUN_APP은 이 종료 코드를 main()에 전달한다. Android와 Web은 OS/브라우저가 루프를 관리하므로 이 반환값으로 종료를 보고하지 않는다."
related = ["WindowSettings", "runHeadlessApp", "events"]

["runHeadlessApp"]
category = "window_system"
keywords = ["no window", "offscreen", "cli", "server"]
description.en = "Run an app class without a window or graphics context (update loop only). Updates are fixed steps at the target rate (getDeltaTime() is 1 / fps), at most setMaxUpdateSteps() per loop pass (default 10; between passes the loop sleeps until the next step is due, at most 1 ms); time beyond that (after a stall, or when update() is slower than its rate) is dropped with a one-time warning. Template on the app type; returns the process exit code"
description.ja = "ウィンドウやグラフィックスコンテキストなしでアプリクラスを実行（update ループのみ）。update は目標レートの固定ステップ（getDeltaTime() は 1 / fps）で、ループ1周あたり最大 setMaxUpdateSteps() ステップ（既定10。周と周の間は次のステップの時刻まで、最長1ms スリープする）。それを超える分（停止後や update() がレートに追いつかない場合）は捨てられ、一度だけ警告が出る。アプリ型をテンプレート引数に取り、プロセスの終了コードを返す"
description.ko = "윈도우나 그래픽스 컨텍스트 없이 앱 클래스를 실행 (update 루프만). update는 목표 레이트의 고정 스텝(getDeltaTime()은 1 / fps)으로 루프 1회당 최대 setMaxUpdateSteps() 스텝(기본값 10. 회차 사이에는 다음 스텝 시각까지, 최대 1ms 슬립). 이를 넘는 시간(정지 후, update()가 레이트를 따라가지 못할 때)은 버려지고 경고가 한 번 출력된다. 앱 타입을 템플릿 인자로 받고 프로세스 종료 코드를 반환"
related = ["HeadlessSettings", "runApp", "setMaxUpdateSteps"]

["runOnMainThread"]
category = "utility"
keywords = ["main thread", "marshal", "queue", "dispatch", "sync"]
description.en = "Run a callback on the main (scene) thread; immediately if already on it, otherwise queued to the next frame. Each frame runs, in order, what was queued when its drain started; work queued during the drain runs in the next frame. Nothing is dropped and there is no limit (a callback may edit the tree or free something); the tc_get_health MCP tool reports the count as mainQueuePending. Code that may queue faster than the app runs it, and can drop values, keeps its own bounded or latest-value buffer"
description.ja = "コールバックをメイン（シーン）スレッドで実行。既にメインなら即時、そうでなければ次フレームにキュー。各フレームは、ドレイン開始時点でキューにあったものを順番に実行する。ドレイン中にキューされたものは次のフレームで実行される。何も捨てず、上限もない（コールバックはツリーを編集したり何かを解放したりしうる）。その数は MCP ツール tc_get_health が mainQueuePending として返す。アプリが処理するより速くキューしうるコードで、値を捨ててよいものは、自前で上限付きのバッファか最新値だけのバッファを持つ"
description.ko = "콜백을 메인(씬) 스레드에서 실행. 이미 메인이면 즉시, 아니면 다음 프레임으로 큐잉. 각 프레임은 드레인 시작 시점에 큐에 있던 것을 순서대로 실행한다. 드레인 중에 큐잉된 것은 다음 프레임에 실행된다. 아무것도 버리지 않고 상한도 없다(콜백이 트리를 편집하거나 무언가를 해제할 수 있으므로). 그 개수는 MCP 도구 tc_get_health가 mainQueuePending으로 보고한다. 앱이 처리하는 것보다 빠르게 큐잉할 수 있고 값을 버려도 되는 코드는 자체적으로 상한이 있는 버퍼나 최신값 버퍼를 둔다"
related = ["isMainThread", "Node::callAfterAsync"]

