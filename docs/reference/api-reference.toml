description.en = "Return the sokol-gfx color attachment view used to render into this RenderTarget (advanced interop)."
description.ja = "この RenderTarget へ描画するための sokol-gfx カラーアタッチメント view を返す（高度な相互運用向け）。"
description.ko = "이 RenderTarget에 렌더링하기 위한 sokol-gfx 컬러 어태치먼트 view를 반환한다(고급 상호운용용)."

["Texture::getAttachmentViewForMip"]
description.en = "Return the sokol-gfx color attachment view for the given mip level (advanced interop)."
description.ja = "指定したミップレベルの sokol-gfx カラーアタッチメント view を返す（高度な相互運用向け）。"
description.ko = "지정한 밉 레벨의 sokol-gfx 컬러 어태치먼트 view를 반환한다(고급 상호운용용)."

["Texture::getViewForMip"]
description.en = "Return the sokol-gfx texture view for sampling a single mip level (advanced interop)."
description.ja = "単一のミップレベルをサンプリングするための sokol-gfx テクスチャ view を返す（高度な相互運用向け）。"
description.ko = "단일 밉 레벨을 샘플링하기 위한 sokol-gfx 텍스처 view를 반환한다(고급 상호운용용)."

["Texture::getCubemapFaceAttachmentView"]
description.en = "Return (lazily creating) the sokol-gfx attachment view for one (face, mip) of this cubemap (advanced interop)."
description.ja = "このキューブマップの (face, mip) 用 sokol-gfx アタッチメント view を返す（必要時に生成、高度な相互運用向け）。"
description.ko = "이 큐브맵의 (face, mip)에 대한 sokol-gfx 어태치먼트 view를 반환한다(지연 생성, 고급 상호운용용)."

["Fbo::getColorImage"]
description.en = "Return the underlying sokol-gfx color image handle (advanced interop)."
description.ja = "内部のカラー sokol-gfx image ハンドルを返す（高度な相互運用向け）。"
description.ko = "내부 컬러 sokol-gfx image 핸들을 반환한다(고급 상호운용용)."

["Fbo::getTextureView"]
description.en = "Return the underlying sokol-gfx color texture view handle (advanced interop)."
description.ja = "内部のカラーテクスチャ sokol-gfx view ハンドルを返す（高度な相互運用向け）。"
description.ko = "내부 컬러 텍스처 sokol-gfx view 핸들을 반환한다(고급 상호운용용)."

["Fbo::getSampler"]
description.en = "Return the underlying sokol-gfx sampler handle (advanced interop)."
description.ja = "内部の sokol-gfx sampler ハンドルを返す（高度な相互運用向け）。"
description.ko = "내부 sokol-gfx sampler 핸들을 반환한다(고급 상호운용용)."

["Mesh::getGpuVertexBuffer"]
category = "types_mesh"
keywords = ["gpu", "buffer", "interop", "sokol", "sg_buffer"]
description.en = "The sokol-gfx vertex buffer handle backing the mesh (advanced interop)."
description.ja = "メッシュを支える sokol-gfx 頂点バッファハンドル（高度な相互運用向け）。"
description.ko = "메시를 뒷받침하는 sokol-gfx 정점 버퍼 핸들(고급 상호운용용)."
related = ["Mesh::getGpuVertexCount", "Mesh::uploadToGpu", "Mesh::getGpuIndexBuffer", "Mesh::getGpuPointBuffer"]
details.en = '''
The `sg_buffer` holding the interleaved vertex data after
[`uploadToGpu`](#Mesh::uploadToGpu) (call that first, or draw the mesh once, so it
exists). Use it to feed the mesh into your own `sg_pipeline` — e.g. an addon that
runs a custom shader or compute pass over the geometry — paired with
[`getGpuVertexCount`](#Mesh::getGpuVertexCount) as the draw count. The id is `0`
until the first upload.
'''
details.ja = '''
[`uploadToGpu`](#Mesh::uploadToGpu) 後にインターリーブされた頂点データを保持する
`sg_buffer`（先にそれを呼ぶか、一度描画して存在させること）。自前の
`sg_pipeline` にメッシュを流し込むのに使う — たとえば addon がジオメトリに対して
独自のシェーダ／コンピュートパスを走らせる用途 — 描画頂点数として
[`getGpuVertexCount`](#Mesh::getGpuVertexCount) と組み合わせる。最初のアップロード
までは id が `0`。
'''
details.ko = '''
[`uploadToGpu`](#Mesh::uploadToGpu) 후 인터리브된 정점 데이터를 담는
`sg_buffer`다(먼저 그 함수를 호출하거나 메시를 한 번 그려서 존재하게 한다).
메시를 자신의 `sg_pipeline`에 넣는 데 쓴다 — 예컨대 addon이 지오메트리에 대해
커스텀 셰이더/컴퓨트 패스를 돌리는 용도 — 드로우 정점 수로
[`getGpuVertexCount`](#Mesh::getGpuVertexCount)와 함께 쓴다. 첫 업로드 전까지는
id가 `0`이다.
'''

["Mesh::getGpuIndexBuffer"]
category = "types_mesh"
keywords = ["gpu", "buffer", "interop", "sokol", "sg_buffer"]
description.en = "The sokol-gfx buffer handle holding the uploaded list indices (advanced interop). TriangleStrip and TriangleFan expand to triangle lists; LineStrip and LineLoop expand to line lists. If the mesh has no indices, 0..N-1 (N = vertex count) supplies the source sequence, including for Points. Use getGpuIndexCount for the uploaded count. Custom pipelines must draw triangle modes as triangle lists and line modes as line lists."
description.ja = "アップロードしたリストのインデックスを保持する sokol-gfx バッファハンドル（高度な相互運用向け）。TriangleStrip と TriangleFan は三角形リストに、LineStrip と LineLoop は線リストに展開する。元のインデックスが無ければ 0..N-1（N は頂点数）を入力列とし、Points でも同じ連番を使う。アップロード済みの数は getGpuIndexCount で取得する。独自のパイプラインでは三角形モードを三角形リスト、線モードを線リストとして描画する。"
description.ko = "업로드한 리스트 인덱스를 담는 sokol-gfx 버퍼 핸들(고급 상호운용용). TriangleStrip과 TriangleFan은 삼각형 리스트로, LineStrip과 LineLoop는 선 리스트로 확장한다. 원본 인덱스가 없으면 0..N-1(N은 정점 수)을 입력 시퀀스로 사용하며, Points에서도 같은 순차 인덱스를 사용한다. 업로드된 개수는 getGpuIndexCount로 얻는다. 커스텀 파이프라인에서는 삼각형 모드를 삼각형 리스트로, 선 모드를 선 리스트로 그려야 한다."
related = ["Mesh::getGpuIndexCount", "Mesh::getGpuVertexBuffer", "Mesh::uploadToGpu"]

["Mesh::getGpuPointBuffer"]
category = "types_mesh"
keywords = ["gpu", "buffer", "interop", "sokol", "sg_buffer", "point cloud", "points"]
description.en = "The sokol-gfx buffer handle holding the uploaded point data, position + color per point (advanced interop)."
description.ja = "アップロード済みの点データ（点ごとに位置＋色）を保持する sokol-gfx バッファハンドル（高度な相互運用向け）。"
description.ko = "업로드된 포인트 데이터(포인트마다 위치 + 색상)를 담는 sokol-gfx 버퍼 핸들(고급 상호운용용)."
related = ["Mesh::getGpuPointCount", "Mesh::uploadPointsToGpu", "Mesh::getGpuVertexBuffer"]
details.en = '''
The point-cloud counterpart of
[`getGpuVertexBuffer`](#Mesh::getGpuVertexBuffer): an `sg_buffer` of tightly
packed `{ pos.xyz, color.rgba }` per point, filled by
[`uploadPointsToGpu`](#Mesh::uploadPointsToGpu) (or the first
[`drawGpuPoints`](#Mesh::drawGpuPoints)). Bind it into your own pipeline — e.g. a
GPU particle/compute pass over the cloud — with
[`getGpuPointCount`](#Mesh::getGpuPointCount) points. The id is `0` until the
first upload.
'''
details.ja = '''
[`getGpuVertexBuffer`](#Mesh::getGpuVertexBuffer) の点群版。点ごとに
`{ pos.xyz, color.rgba }` を密に詰めた `sg_buffer` で、
[`uploadPointsToGpu`](#Mesh::uploadPointsToGpu)（または最初の
[`drawGpuPoints`](#Mesh::drawGpuPoints)）が埋める。自前パイプラインにバインドして
使う — たとえば点群に対する GPU パーティクル／コンピュートパス — 点数は
[`getGpuPointCount`](#Mesh::getGpuPointCount)。最初のアップロードまでは id が `0`。
'''
details.ko = '''
[`getGpuVertexBuffer`](#Mesh::getGpuVertexBuffer)의 포인트 클라우드 버전이다.
포인트마다 `{ pos.xyz, color.rgba }`를 빽빽하게 채운 `sg_buffer`로,
[`uploadPointsToGpu`](#Mesh::uploadPointsToGpu)(또는 첫
[`drawGpuPoints`](#Mesh::drawGpuPoints))가 채운다. 자신의 파이프라인에
바인딩해서 쓴다 — 예컨대 포인트 클라우드에 대한 GPU 파티클/컴퓨트 패스 —
포인트 수는 [`getGpuPointCount`](#Mesh::getGpuPointCount)다. 첫 업로드 전까지는
id가 `0`이다.
'''

["Font::getAtlas"]
description.en = "Return the atlas page at the given index for debug visualization, or nullptr if out of range. Pages are single-channel R8 textures holding glyph coverage in R, so drawing a page's view with the normal pipeline shows it in red."
description.ja = "デバッグ表示用に指定インデックスのアトラスページを返す。範囲外なら nullptr。ページはグリフのカバレッジを R に持つ単一チャンネルの R8 テクスチャなので、ページの view を通常のパイプラインで描くと赤く表示される。"
description.ko = "디버그 시각화용으로 지정 인덱스의 아틀라스 페이지를 반환한다. 범위를 벗어나면 nullptr. 페이지는 글리프 커버리지를 R에 담는 단일 채널 R8 텍스처이므로, 페이지의 view를 일반 파이프라인으로 그리면 빨갛게 표시된다."

["Font::getSampler"]
description.en = "Return the shared sokol-gfx sampler used for atlas rendering (advanced interop)."
description.ja = "アトラス描画に使う共有 sokol-gfx sampler を返す（高度な相互運用向け）。"
description.ko = "아틀라스 렌더링에 쓰이는 공유 sokol-gfx sampler를 반환한다(고급 상호운용용)."

["IesProfile::getView"]
description.en = "Return the sokol-gfx texture view of the IES profile for pipeline binding (advanced interop)."
description.ja = "パイプラインバインド用に IES プロファイルの sokol-gfx テクスチャ view を返す（高度な相互運用向け）。"
description.ko = "파이프라인 바인딩용으로 IES 프로파일의 sokol-gfx 텍스처 view를 반환한다(고급 상호운용용)."

["IesProfile::getSampler"]
description.en = "Return the sokol-gfx sampler of the IES profile for pipeline binding (advanced interop)."
description.ja = "パイプラインバインド用に IES プロファイルの sokol-gfx sampler を返す（高度な相互運用向け）。"
description.ko = "파이프라인 바인딩용으로 IES 프로파일의 sokol-gfx sampler를 반환한다(고급 상호운용용)."

["Node::getCameraContext"]
description.en = "Return the camera context this node was last drawn under (null if never drawn)."
description.ja = "このノードが最後に描画されたカメラコンテキストを返す（未描画なら null）。"
description.ko = "이 노드가 마지막으로 그려진 카메라 컨텍스트를 반환한다(그려진 적 없으면 null)."

["Node::setCameraContext"]
description.en = "Set the camera context for a manually-managed node (normally set automatically by drawTree)."
description.ja = "手動管理ノードのカメラコンテキストを設定する（通常は drawTree が自動設定）。"
description.ko = "수동 관리 노드의 카메라 컨텍스트를 설정한다(보통 drawTree가 자동 설정)."

["CameraContext::screenPointToRay"]
description.en = "Unproject a screen point (pixels, top-left origin) into a world-space ray."
description.ja = "スクリーン座標（ピクセル、左上原点）をワールド空間のレイに逆投影する。"
description.ko = "화면 좌표(픽셀, 좌상단 원점)를 월드 공간 광선으로 역투영한다."

["RectNode::draw"]
description.en = "Draw the rectangle node; override in derived classes (draws nothing by default)."
description.ja = "矩形ノードを描画する。派生クラスでオーバーライドする（デフォルトは何も描かない）。"
description.ko = "사각형 노드를 그린다. 파생 클래스에서 재정의한다(기본은 아무것도 그리지 않음)."

["Shader::clear"]
description.en = "Destroy the shader's GPU resources and reset it to the unloaded state."
description.ja = "シェーダの GPU リソースを破棄して未ロード状態にリセットする。"
description.ko = "셰이더의 GPU 리소스를 파괴하고 미로드 상태로 초기화한다."

["Shader::submitVertices"]
description.en = "Submit a batch of vertices for deferred drawing with this shader (lines are unsupported)."
description.ja = "このシェーダで遅延描画する頂点バッチを送る（ラインは非対応）。"
description.ko = "이 셰이더로 지연 렌더링할 정점 배치를 제출한다(라인은 미지원)."

["Reflector::visit"]
description.en = "Handle one reflected member by name and value; return true if it was edited."
description.ja = "名前と値で 1 つの反映メンバを処理する。編集されたら true を返す。"
description.ko = "이름과 값으로 반영된 멤버 하나를 처리한다. 편집되었으면 true를 반환한다."

["Reflector::isReadOnly"]
description.en = "Return true if the current reflection scope is read-only."
description.ja = "現在の反映スコープが読み取り専用なら true を返す。"
description.ko = "현재 반영 범위가 읽기 전용이면 true를 반환한다."

["Reflector::pushReadOnly"]
description.en = "Enter a read-only scope (members visited inside cannot be written)."
description.ja = "読み取り専用スコープに入る（内側で訪れるメンバは書き込み不可）。"
description.ko = "읽기 전용 범위로 진입한다(내부에서 방문하는 멤버는 쓸 수 없음)."

["Reflector::popReadOnly"]
description.en = "Leave the current read-only scope."
description.ja = "現在の読み取り専用スコープを抜ける。"
description.ko = "현재 읽기 전용 범위를 벗어난다."

["Reflector::isDerived"]
keywords = ["derived", "reflection", "serialize", "TC_DERIVED"]
description.en = "Return true if the current member is a derived value (TC_DERIVED): computed from another member, writable, but not saved."
description.ja = "現在のメンバが派生値（TC_DERIVED）なら true を返す。他のメンバから計算され、書き込めるが保存はされない。"
description.ko = "현재 멤버가 파생 값(TC_DERIVED)이면 true를 반환한다. 다른 멤버에서 계산되며 쓸 수 있지만 저장되지 않는다."

["Reflector::pushDerived"]
keywords = ["derived", "reflection", "TC_DERIVED"]
description.en = "Enter a derived-value scope (TC_DERIVED visits inside it)."
description.ja = "派生値スコープに入る（TC_DERIVED はこの内側で訪れる）。"
description.ko = "파생 값 범위로 진입한다(TC_DERIVED는 이 안에서 방문한다)."

["Reflector::popDerived"]
keywords = ["derived", "reflection", "TC_DERIVED"]
description.en = "Leave the current derived-value scope."
description.ja = "現在の派生値スコープを抜ける。"
description.ko = "현재 파생 값 범위를 벗어난다."

["Reflector::beginGroup"]
description.en = "Enter a nested composite group of reflected members (no-op for flat backends)."
description.ja = "反映メンバのネストしたグループに入る（フラットなバックエンドでは何もしない）。"
description.ko = "반영된 멤버의 중첩 그룹으로 진입한다(평면 백엔드에서는 동작 없음)."

["Reflector::endGroup"]
description.en = "Leave the current nested group."
description.ja = "現在のネストグループを抜ける。"
description.ko = "현재 중첩 그룹을 벗어난다."

["JsonReadReflector::unknownKeys"]
description.en = "Return the source keys that matched no reflected member (typos etc.); valid after reflectMembers runs."
description.ja = "どの反映メンバにも一致しなかったソースキー（タイポ等）を返す。reflectMembers 実行後に有効。"
description.ko = "어떤 반영 멤버와도 일치하지 않은 소스 키(오타 등)를 반환한다. reflectMembers 실행 후 유효."

["JsonReadReflector::visit"]
description.en = "Apply the JSON value for one member through its setter, recording applied/skipped/read-only."
description.ja = "1 メンバの JSON 値をセッター経由で適用し、適用／スキップ／読取専用を記録する。"
description.ko = "한 멤버의 JSON 값을 세터를 통해 적용하고 적용/건너뜀/읽기전용을 기록한다."

["JsonReadReflector::beginGroup"]
description.en = "Descend into the nested JSON object for a composite member."
description.ja = "複合メンバ用にネストした JSON オブジェクトへ降りる。"
description.ko = "복합 멤버를 위해 중첩된 JSON 객체로 내려간다."

["JsonReadReflector::endGroup"]
description.en = "Return from the nested JSON object."
description.ja = "ネストした JSON オブジェクトから戻る。"
description.ko = "중첩된 JSON 객체에서 돌아온다."

["JsonWriteReflector::visit"]
description.en = "Write one reflected member into the output JSON object."
description.ja = "1 つの反映メンバを出力 JSON オブジェクトに書き込む。"
description.ko = "반영된 멤버 하나를 출력 JSON 객체에 기록한다."

["JsonWriteReflector::beginGroup"]
description.en = "Open a nested JSON object for a composite member."
description.ja = "複合メンバ用にネストした JSON オブジェクトを開く。"
description.ko = "복합 멤버를 위해 중첩된 JSON 객체를 연다."

["JsonWriteReflector::endGroup"]
description.en = "Close the current nested JSON object."
description.ja = "現在のネストした JSON オブジェクトを閉じる。"
description.ko = "현재 중첩된 JSON 객체를 닫는다."

["UdpSocket::processNetwork"]
description.en = "Pump pending UDP I/O; normally auto-driven by the update event, but can be called manually for synchronous polling."
description.ja = "保留中の UDP I/O を処理する。通常は update イベントで自動駆動されるが、同期ポーリングのため手動呼び出しも可能。"
description.ko = "대기 중인 UDP I/O를 처리한다. 보통 update 이벤트로 자동 구동되지만 동기 폴링을 위해 수동 호출도 가능하다."

["TcpClient::processNetwork"]
description.en = "Pump pending TCP I/O; normally auto-driven by the update event, but can be called manually for synchronous polling."
description.ja = "保留中の TCP I/O を処理する。通常は update イベントで自動駆動されるが、同期ポーリングのため手動呼び出しも可能。"
description.ko = "대기 중인 TCP I/O를 처리한다. 보통 update 이벤트로 자동 구동되지만 동기 폴링을 위해 수동 호출도 가능하다."

["AudioEngine::mixAudio"]
description.en = "Audio output callback: mix all playing sounds into the buffer (internal, called from the audio thread)."
description.ja = "音声出力コールバック。再生中の全サウンドをバッファにミックスする（内部用、音声スレッドから呼ばれる）。"
description.ko = "오디오 출력 콜백. 재생 중인 모든 사운드를 버퍼에 믹스한다(내부용, 오디오 스레드에서 호출)."

["MicInput::onAudioData"]
description.en = "Mic input callback: receive captured input samples (internal, called from the audio thread)."
description.ja = "マイク入力コールバック。キャプチャした入力サンプルを受け取る（内部用、音声スレッドから呼ばれる）。"
description.ko = "마이크 입력 콜백. 캡처된 입력 샘플을 받는다(내부용, 오디오 스레드에서 호출)."

["MouseEventArgs::syncLegacy"]
description.en = "Copy the canonical pos field into the deprecated x/y mirror fields (legacy mirrors scheduled for removal in v1.0)."
description.ja = "正規の pos を非推奨の x/y ミラーフィールドにコピーする（レガシーミラーは v1.0 で削除予定）。"
description.ko = "정규 pos 값을 폐기 예정인 x/y 미러 필드로 복사한다(레거시 미러는 v1.0에서 제거 예정)."

["MouseMoveEventArgs::syncLegacy"]
description.en = "Copy the canonical pos/delta fields into the deprecated x/y/deltaX/deltaY mirror fields (legacy mirrors scheduled for removal in v1.0)."
description.ja = "正規の pos/delta を非推奨の x/y/deltaX/deltaY ミラーフィールドにコピーする（レガシーミラーは v1.0 で削除予定）。"
description.ko = "정규 pos/delta 값을 폐기 예정인 x/y/deltaX/deltaY 미러 필드로 복사한다(레거시 미러는 v1.0에서 제거 예정)."

["MouseDragEventArgs::syncLegacy"]
description.en = "Copy the canonical pos/delta fields into the deprecated x/y/deltaX/deltaY mirror fields (legacy mirrors scheduled for removal in v1.0)."
description.ja = "正規の pos/delta を非推奨の x/y/deltaX/deltaY ミラーフィールドにコピーする（レガシーミラーは v1.0 で削除予定）。"
description.ko = "정규 pos/delta 값을 폐기 예정인 x/y/deltaX/deltaY 미러 필드로 복사한다(레거시 미러는 v1.0에서 제거 예정)."

["ScrollEventArgs::syncLegacy"]
description.en = "Copy the canonical scroll field into the deprecated scrollX/scrollY mirror fields (legacy mirrors scheduled for removal in v1.0)."
description.ja = "正規の scroll を非推奨の scrollX/scrollY ミラーフィールドにコピーする（レガシーミラーは v1.0 で削除予定）。"
description.ko = "정규 scroll 값을 폐기 예정인 scrollX/scrollY 미러 필드로 복사한다(레거시 미러는 v1.0에서 제거 예정)."

