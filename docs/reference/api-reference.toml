["PointStyle"]
category = "types_mesh"
keywords = ["point cloud", "points", "splat", "shape", "pixel"]
description.en = "Shape used to draw points: Square, Round, Pixel."
description.ja = "点の描画形状：Square, Round, Pixel。"
description.ko = "포인트를 그리는 모양: Square, Round, Pixel."
related = ["setPointStyle", "getPointStyle", "setPointSize", "Mesh::drawGpuPoints"]
details.en = '''
The shape a [`PrimitiveMode`](#PrimitiveMode)`::Points` mesh is drawn with — set
as draw state via [`setPointStyle`](#setPointStyle). All three are GPU-resident
and differ only in shape: `Square` and `Round` are billboard splats sized by
[`setPointSize`](#setPointSize) (logical px); `Pixel` is a true 1px point and
ignores the size. `Square` is the lightest splat; `Round` adds anti-aliasing
(alpha-to-coverage, so it needs a multisampled target to smooth).
'''
details.ja = '''
[`PrimitiveMode`](#PrimitiveMode)`::Points` のメッシュを描く形状で、
[`setPointStyle`](#setPointStyle) で描画ステートとして設定する。3 つとも GPU 常駐で
違いは形だけ。`Square` と `Round` は [`setPointSize`](#setPointSize)（論理 px）で
サイズ指定するビルボードスプラット、`Pixel` は本物の 1px 点でサイズを無視する。
`Square` が最も軽いスプラットで、`Round` はアンチエイリアス（alpha-to-coverage の
ため、滑らかにするにはマルチサンプルのターゲットが必要）を加える。
'''
details.ko = '''
[`PrimitiveMode`](#PrimitiveMode)`::Points` 메시를 그리는 모양으로,
[`setPointStyle`](#setPointStyle)로 그리기 상태로 설정한다. 셋 다 GPU 상주이며
차이는 모양뿐이다. `Square`와 `Round`는 [`setPointSize`](#setPointSize)(논리 px)로
크기를 정하는 빌보드 스플랫이고, `Pixel`은 진짜 1px 포인트로 크기를 무시한다.
`Square`가 가장 가벼운 스플랫이고, `Round`는 안티앨리어싱(alpha-to-coverage이므로
부드럽게 하려면 멀티샘플 타깃이 필요)을 더한다.
'''
value_desc.Square.en = "Billboarded quad splat (lightest, default)."
value_desc.Square.ja = "ビルボード四角スプラット（最軽量・デフォルト）。"
value_desc.Square.ko = "빌보드 사각 스플랫(가장 가벼움, 기본값)."
value_desc.Round.en = "Anti-aliased disc splat (alpha-to-coverage)."
value_desc.Round.ja = "アンチエイリアスされた円スプラット（alpha-to-coverage）。"
value_desc.Round.ko = "안티앨리어싱된 원 스플랫(alpha-to-coverage)."
value_desc.Pixel.en = "True 1px point primitive (ignores point size)."
value_desc.Pixel.ja = "本物の 1px 点プリミティブ（サイズを無視）。"
value_desc.Pixel.ko = "진짜 1px 포인트 프리미티브(크기를 무시)."

