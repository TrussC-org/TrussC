platform_note.en = "TCP client via raw BSD/Winsock sockets (connect/connectAsync/send/receive, sync or threaded). Fully functional on the 5 native platforms. Compiles for wasm but raw TCP only works tunneled over Emscripten's WebSocket socket emulation (a proxy server), not as a native browser socket. On wasm threading is disabled (useThread_ forced false), so connectAsync() degrades to a non-blocking connect driven by processNetwork() instead of a background thread."
platform_note.ja = "生 BSD/Winsock ソケットによる TCP クライアント (connect/connectAsync/send/receive、同期/スレッド両対応)。ネイティブ5プラットフォームで完全動作。wasm でもコンパイルされるが、生 TCP は Emscripten の WebSocket ソケットエミュレーション (プロキシサーバ) 経由でのみ動作し、ブラウザのネイティブソケットとしては動かない。wasm はスレッド無効 (useThread_ 強制 false) のため connectAsync() はバックグラウンドスレッドではなく processNetwork() 駆動のノンブロッキング connect に縮退する。"

