["EnumLabelSpan"]
description.en = "Label table for one enum type: a view over its human-readable enumerator names."
description.ja = "ある enum 型のラベル表。人間可読な列挙子名の軽量ビュー。"
description.ko = "한 enum 타입의 라벨 테이블. 사람이 읽을 수 있는 열거자 이름의 경량 뷰."

["EnumLabelSpan::labels"]
description.en = "Pointer to the array of label strings; labels[value] is the name."
description.ja = "ラベル文字列配列へのポインタ。labels[value] が名前。"
description.ko = "라벨 문자열 배열 포인터. labels[value]가 이름."

["EnumLabelSpan::count"]
description.en = "Number of labels in the table."
description.ja = "テーブル内のラベル数。"
description.ko = "테이블 내 라벨 개수."

["enumNames"]
description.en = "Return a compile-time array of all valid enumerator names of E."
description.ja = "E のすべての有効な列挙子名をコンパイル時配列で返す。"
description.ko = "E의 유효한 모든 열거자 이름을 컴파일 타임 배열로 반환한다."

["enumValues"]
description.en = "Return a compile-time array of all valid enumerator values of E, parallel to enumNames."
description.ja = "E のすべての有効な列挙子値をコンパイル時配列で返す。enumNames と並行。"
description.ko = "E의 유효한 모든 열거자 값을 컴파일 타임 배열로 반환한다. enumNames와 병렬."

["enumReflectedSpan"]
description.en = "Return an EnumLabelSpan synthesized from reflection (valid for contiguous zero-based enums)."
description.ja = "リフレクションから合成した EnumLabelSpan を返す（0 始まり連続の enum で有効）。"
description.ko = "리플렉션으로 합성한 EnumLabelSpan을 반환한다(0부터 연속인 enum에서 유효)."

["enumLabel"]
description.en = "Return the display string for one enum value (TC_ENUM_LABELS override, else reflected name)."
description.ja = "ある enum 値の表示文字列を返す（TC_ENUM_LABELS があれば優先、なければリフレクション名）。"
description.ko = "한 enum 값의 표시 문자열을 반환한다(TC_ENUM_LABELS 우선, 없으면 리플렉션 이름)."

["Reflector"]
description.en = "Visitor base for the TC_REFLECT reflection system; backends (inspector, JSON, codec) subclass it with one visit() per supported type."
description.ja = "TC_REFLECT リフレクションのビジター基底クラス。バックエンド（インスペクタ、JSON、コーデック）が型ごとの visit() を実装して継承する。"
description.ko = "TC_REFLECT 리플렉션의 비지터 베이스 클래스. 백엔드(인스펙터, JSON, 코덱)가 타입별 visit()를 구현해 상속한다."

["CameraContext::view"]
description.en = "View matrix this scene part was drawn under."
description.ja = "このシーン部分が描画されたビュー行列。"
description.ko = "이 장면 부분이 그려진 뷰 행렬."

["CameraContext::projection"]
description.en = "Projection matrix this scene part was drawn under."
description.ja = "このシーン部分が描画されたプロジェクション行列。"
description.ko = "이 장면 부분이 그려진 프로젝션 행렬."

["CameraContext::viewW"]
description.en = "Viewport width in pixels for this context."
description.ja = "このコンテキストのビューポート幅（ピクセル）。"
description.ko = "이 컨텍스트의 뷰포트 너비(픽셀)."

["CameraContext::viewH"]
description.en = "Viewport height in pixels for this context."
description.ja = "このコンテキストのビューポート高さ（ピクセル）。"
description.ko = "이 컨텍스트의 뷰포트 높이(픽셀)."

["CameraContext::pickable"]
description.en = "Whether nodes drawn under this context can be hit-tested; false for FBO contexts."
description.ja = "このコンテキスト下で描かれたノードをヒットテストできるか。FBO コンテキストでは false。"
description.ko = "이 컨텍스트에서 그려진 노드를 히트 테스트할 수 있는지. FBO 컨텍스트는 false."

["EventPriority::App"]
description.en = "Default listener priority (100); the level app-level listeners run at."
description.ja = "リスナーの既定優先度（100）。アプリレベルのリスナーが動くレベル。"
description.ko = "기본 리스너 우선순위(100). 앱 레벨 리스너가 실행되는 레벨."

["PlayingSound::buffer"]
description.en = "The polymorphic sound source (eager SoundBuffer or streaming SoundStream) this voice plays."
description.ja = "このボイスが再生するポリモーフィックなサウンドソース（即時 SoundBuffer かストリーミング SoundStream）。"
description.ko = "이 보이스가 재생하는 다형성 사운드 소스(즉시 SoundBuffer 또는 스트리밍 SoundStream)."

["PlayingSound::stream"]
description.en = "Per-instance streaming state; null for eager voices."
description.ja = "インスタンスごとのストリーミング状態。即時ボイスでは null。"
description.ko = "인스턴스별 스트리밍 상태. 즉시 보이스에서는 null."

["JsonWriteReflector"]
description.en = "Reflector backend that writes reflected members into a JSON object."
description.ja = "リフレクトされたメンバを JSON オブジェクトへ書き出す Reflector バックエンド。"
description.ko = "리플렉션된 멤버를 JSON 객체로 쓰는 Reflector 백엔드."

["JsonWriteReflector::members"]
description.en = "The accumulated JSON object built from visited members."
description.ja = "訪問したメンバから構築された JSON オブジェクト。"
description.ko = "방문한 멤버로 구성된 JSON 객체."

["JsonWriteReflector::includeDerived"]
keywords = ["derived", "save", "serialize", "globalPos"]
description.en = "When true, derived values (TC_DERIVED, e.g. Node's globalPos) are written too; false (default) leaves them out, as a save should."
description.ja = "true なら派生値（TC_DERIVED、例: Node の globalPos）も書き出す。false（既定）では保存用に除外する。"
description.ko = "true이면 파생 값(TC_DERIVED, 예: Node의 globalPos)도 기록한다. false(기본값)이면 저장용으로 제외한다."

["JsonWriteReflector::derived"]
keywords = ["derived", "reflection", "globalPos"]
description.en = "Member paths of the derived values encountered (nested groups joined by '.'), whether or not they were written."
description.ja = "出会った派生値のメンバパス（ネストしたグループは '.' で連結）。書き出したかどうかに関係なく記録する。"
description.ko = "만난 파생 값의 멤버 경로(중첩 그룹은 '.'으로 연결). 기록 여부와 관계없이 기록한다."

["JsonReadReflector"]
description.en = "Reflector backend that applies a JSON object onto reflected members through their setters."
description.ja = "JSON オブジェクトをセッター経由でリフレクトされたメンバへ適用する Reflector バックエンド。"
description.ko = "JSON 객체를 세터를 통해 리플렉션된 멤버에 적용하는 Reflector 백엔드."

["JsonReadReflector::applied"]
description.en = "Keys that matched a member and were written."
description.ja = "メンバに一致して書き込まれたキー。"
description.ko = "멤버에 일치하여 기록된 키."

["JsonReadReflector::skipped"]
description.en = "Keys that matched a member but had the wrong JSON shape."
description.ja = "メンバに一致したが JSON の形が不正だったキー。"
description.ko = "멤버에 일치했지만 JSON 형태가 잘못된 키."

["JsonReadReflector::readOnly"]
description.en = "Keys that matched a read-only member and were not written."
description.ja = "読み取り専用メンバに一致し書き込まれなかったキー。"
description.ko = "읽기 전용 멤버에 일치하여 기록되지 않은 키."

["ShaderVertex::x"]
description.en = "Vertex position X."
description.ja = "頂点位置 X。"
description.ko = "정점 위치 X."

["ShaderVertex::y"]
description.en = "Vertex position Y."
description.ja = "頂点位置 Y。"
description.ko = "정점 위치 Y."

["ShaderVertex::z"]
description.en = "Vertex position Z."
description.ja = "頂点位置 Z。"
description.ko = "정점 위치 Z."

["ShaderVertex::u"]
description.en = "Texture coordinate U."
description.ja = "テクスチャ座標 U。"
description.ko = "텍스처 좌표 U."

["ShaderVertex::v"]
description.en = "Texture coordinate V."
description.ja = "テクスチャ座標 V。"
description.ko = "텍스처 좌표 V."

["ShaderVertex::r"]
description.en = "Vertex color red component."
description.ja = "頂点カラーの赤成分。"
description.ko = "정점 색상 빨강 성분."

["ShaderVertex::g"]
description.en = "Vertex color green component."
description.ja = "頂点カラーの緑成分。"
description.ko = "정점 색상 초록 성분."

["ShaderVertex::b"]
description.en = "Vertex color blue component."
description.ja = "頂点カラーの青成分。"
description.ko = "정점 색상 파랑 성분."

["ShaderVertex::a"]
description.en = "Vertex color alpha component."
description.ja = "頂点カラーのアルファ成分。"
description.ko = "정점 색상 알파 성분."

["RenderContext"]
description.en = "Deprecated alias for internal::RenderContext; use the free drawing functions instead."
description.ja = "internal::RenderContext の非推奨エイリアス。代わりに自由関数の描画 API を使う。"
description.ko = "internal::RenderContext의 더 이상 사용되지 않는 별칭. 대신 자유 함수 그리기 API를 사용한다."

["Font::forEachGlyphHorizontal"]
description.en = "Run the horizontal-writing layout pass over pre-wrapped text, invoking the visitor per placed glyph."
description.ja = "折り返し済みテキストに対し横書きレイアウトを実行し、配置されたグリフごとにビジターを呼ぶ。"
description.ko = "줄바꿈된 텍스트에 가로쓰기 레이아웃을 수행하며 배치된 글리프마다 비지터를 호출한다."

["Font::emitPlacedGlyphsToAtlas"]
description.en = "Emit atlas quads for a stream of placed glyphs (shared by horizontal and vertical layout)."
description.ja = "配置済みグリフ列に対してアトラスクワッドを生成する（横書き・縦書き共通）。"
description.ko = "배치된 글리프 스트림에 대해 아틀라스 쿼드를 생성한다(가로·세로 레이아웃 공용)."

["Font::drawStringInternal"]
description.en = "Draw pre-wrapped text in horizontal writing mode (internal layout + atlas emit)."
description.ja = "折り返し済みテキストを横書きで描画する（内部レイアウト＋アトラス出力）。"
description.ko = "줄바꿈된 텍스트를 가로쓰기로 그린다(내부 레이아웃 + 아틀라스 출력)."

["Font::forEachGlyphVertical"]
description.en = "Run the vertical-writing layout pass over pre-wrapped text, invoking the visitor per placed glyph."
description.ja = "折り返し済みテキストに対し縦書きレイアウトを実行し、配置されたグリフごとにビジターを呼ぶ。"
description.ko = "줄바꿈된 텍스트에 세로쓰기 레이아웃을 수행하며 배치된 글리프마다 비지터를 호출한다."

["Font::drawStringVerticalInternal"]
description.en = "Draw pre-wrapped text in vertical writing mode (internal layout + atlas emit)."
description.ja = "折り返し済みテキストを縦書きで描画する（内部レイアウト＋アトラス出力）。"
description.ko = "줄바꿈된 텍스트를 세로쓰기로 그린다(내부 레이아웃 + 아틀라스 출력)."

["Font::kinsokuLineStart"]
description.en = "Return whether a codepoint is forbidden at the start of a line (kinsoku rule)."
description.ja = "あるコードポイントが行頭禁則かどうかを返す（禁則処理）。"
description.ko = "어떤 코드포인트가 줄 시작에 금지되는지 반환한다(긴소쿠 규칙)."

["Font::kinsokuLineEnd"]
description.en = "Return whether a codepoint is forbidden at the end of a line (kinsoku rule)."
description.ja = "あるコードポイントが行末禁則かどうかを返す（禁則処理）。"
description.ko = "어떤 코드포인트가 줄 끝에 금지되는지 반환한다(긴소쿠 규칙)."

["Font::wrapTextHorizontal"]
description.en = "Insert hard newlines into text for horizontal word wrapping at maxLineLength."
description.ja = "横書きの折り返しのため、maxLineLength でテキストに改行を挿入する。"
description.ko = "가로 줄바꿈을 위해 maxLineLength에서 텍스트에 개행을 삽입한다."

["Font::wrapTextVertical"]
description.en = "Insert hard newlines into text for vertical wrapping by column-height budget."
description.ja = "縦書きの折り返しのため、列高予算でテキストに改行を挿入する。"
description.ko = "세로 줄바꿈을 위해 열 높이 예산에 따라 텍스트에 개행을 삽입한다."

["Font::wrapTextIfEnabled"]
description.en = "Wrap text per the current writing mode when wrapping is enabled, else return it unchanged."
description.ja = "折り返しが有効なら現在の書字方向で折り返し、無効ならそのまま返す。"
description.ko = "줄바꿈이 켜져 있으면 현재 쓰기 방향으로 줄바꿈하고, 아니면 그대로 반환한다."

["Font::calcAlignOffset"]
description.en = "Compute the alignment offset for text given horizontal and vertical alignment."
description.ja = "水平・垂直アラインメントを考慮したテキストの整列オフセットを計算する。"
description.ko = "수평·수직 정렬을 고려한 텍스트의 정렬 오프셋을 계산한다."

["Shader::storeUniform"]
description.en = "Store raw uniform bytes for the given slot, to be applied at draw time."
description.ja = "指定スロットの生のユニフォームバイト列を保存し、描画時に適用する。"
description.ko = "지정 슬롯의 원시 유니폼 바이트를 저장하여 그리기 시 적용한다."

["Shader::applyUniforms"]
description.en = "Apply all stored uniforms to the bound shader."
description.ja = "保存済みの全ユニフォームをバインド中のシェーダに適用する。"
description.ko = "저장된 모든 유니폼을 바인딩된 셰이더에 적용한다."

["Shader::shader"]
description.en = "The underlying sokol shader handle."
description.ja = "内部の sokol シェーダハンドル。"
description.ko = "내부 sokol 셰이더 핸들."

["Shader::pipeline"]
description.en = "The pipeline targeting the swapchain, created at load()."
description.ja = "スワップチェーンを対象とするパイプライン。load() 時に作成。"
description.ko = "스왑체인을 대상으로 하는 파이프라인. load() 시 생성."

["Shader::vertexBuffer"]
description.en = "The dynamic vertex buffer for shader draws."
description.ja = "シェーダ描画用の動的頂点バッファ。"
description.ko = "셰이더 그리기용 동적 정점 버퍼."

["Shader::indexBuffer"]
description.en = "The dynamic index buffer for shader draws."
description.ja = "シェーダ描画用の動的インデックスバッファ。"
description.ko = "셰이더 그리기용 동적 인덱스 버퍼."

["Shader::loaded"]
description.en = "Whether the shader has been loaded."
description.ja = "シェーダがロード済みかどうか。"
description.ko = "셰이더가 로드되었는지 여부."

["Shader::pendingViews"]
description.en = "View bindings staged per slot, applied at draw time."
description.ja = "スロットごとに保留中のビューバインディング。描画時に適用。"
description.ko = "슬롯별로 대기 중인 뷰 바인딩. 그리기 시 적용."

["Shader::pendingUniforms"]
description.en = "Raw uniform bytes staged per slot, applied at draw time."
description.ja = "スロットごとに保留中の生ユニフォームバイト列。描画時に適用。"
description.ko = "슬롯별로 대기 중인 원시 유니폼 바이트. 그리기 시 적용."

["Shader::createPipelineDesc"]
description.en = "Build the pipeline descriptor (standard vertex layout); overridable by subclasses."
description.ja = "パイプライン記述子（標準頂点レイアウト）を構築する。サブクラスでオーバーライド可能。"
description.ko = "파이프라인 디스크립터(표준 정점 레이아웃)를 구성한다. 서브클래스에서 재정의 가능."

["Shader::createVertexBuffer"]
description.en = "Create the dynamic vertex/index buffers; overridable by subclasses."
description.ja = "動的頂点・インデックスバッファを作成する。サブクラスでオーバーライド可能。"
description.ko = "동적 정점·인덱스 버퍼를 생성한다. 서브클래스에서 재정의 가능."

["Shader::onBegin"]
description.en = "Hook called when the shader scope begins; override to set up bindings."
description.ja = "シェーダスコープ開始時に呼ばれるフック。バインディング設定用にオーバーライドする。"
description.ko = "셰이더 스코프 시작 시 호출되는 훅. 바인딩 설정을 위해 재정의한다."

["Shader::onEnd"]
description.en = "Hook called when the shader scope ends."
description.ja = "シェーダスコープ終了時に呼ばれるフック。"
description.ko = "셰이더 스코프 종료 시 호출되는 훅."

["Shader::setupBindings"]
description.en = "Hook to populate the sg_bindings before a draw; override for custom inputs."
description.ja = "描画前に sg_bindings を埋めるフック。カスタム入力用にオーバーライドする。"
description.ko = "그리기 전 sg_bindings를 채우는 훅. 사용자 입력을 위해 재정의한다."

["Shader::fillTextureBindings"]
description.en = "Copy the textures set with setTexture() into sg_bindings; a sampler is written only for slots below sokol's sampler limit (12)."
description.ja = "setTexture() で設定したテクスチャを sg_bindings に写す。サンプラーは sokol のサンプラー上限（12）未満のスロットにだけ書く。"
description.ko = "setTexture()로 설정한 텍스처를 sg_bindings에 복사한다. 샘플러는 sokol 샘플러 한도(12) 미만 슬롯에만 쓴다."

["Shader::pipelineForCurrentTarget"]
description.en = "Return the pipeline matching the current render target, building and caching one per (format, sampleCount)."
description.ja = "現在のレンダーターゲットに合うパイプラインを返す。(フォーマット, サンプル数) ごとに生成・キャッシュ。"
description.ko = "현재 렌더 타겟에 맞는 파이프라인을 반환한다. (포맷, 샘플 수)별로 생성·캐시."

["FullscreenShader::createPipelineDesc"]
description.en = "Build the fullscreen-quad pipeline descriptor (overrides Shader's)."
description.ja = "フルスクリーンクワッド用のパイプライン記述子を構築する（Shader をオーバーライド）。"
description.ko = "전체 화면 쿼드용 파이프라인 디스크립터를 구성한다(Shader 재정의)."

["FullscreenShader::createVertexBuffer"]
description.en = "Create the fullscreen-quad vertex/index buffers (overrides Shader's)."
description.ja = "フルスクリーンクワッド用の頂点・インデックスバッファを作成する（Shader をオーバーライド）。"
description.ko = "전체 화면 쿼드용 정점·인덱스 버퍼를 생성한다(Shader 재정의)."

["VideoPlayerBase::getCurrentFrameImpl"]
description.en = "Protected implementation hook: return the current frame index. Called after VideoPlayerBase's public frame API accepts the frame rate."
description.ja = "protected 実装フック：現在のフレーム番号を返す。VideoPlayerBase の公開フレーム API がフレームレートを確認した後に呼ばれる。"
description.ko = "protected 구현 훅: 현재 프레임 인덱스를 반환한다. VideoPlayerBase의 공개 프레임 API가 프레임 레이트를 확인한 뒤 호출한다."

["VideoPlayerBase::getTotalFramesImpl"]
description.en = "Protected implementation hook: return the total frame count. Called after VideoPlayerBase's public frame API accepts the frame rate."
description.ja = "protected 実装フック：総フレーム数を返す。VideoPlayerBase の公開フレーム API がフレームレートを確認した後に呼ばれる。"
description.ko = "protected 구현 훅: 전체 프레임 수를 반환한다. VideoPlayerBase의 공개 프레임 API가 프레임 레이트를 확인한 뒤 호출한다."

["VideoPlayerBase::setFrameImpl"]
description.en = "Protected implementation hook: seek to the given frame index. Called after VideoPlayerBase's public frame API accepts the frame rate."
description.ja = "protected 実装フック：指定したフレーム番号にシークする。VideoPlayerBase の公開フレーム API がフレームレートを確認した後に呼ばれる。"
description.ko = "protected 구현 훅: 지정한 프레임 인덱스로 이동한다. VideoPlayerBase의 공개 프레임 API가 프레임 레이트를 확인한 뒤 호출한다."

["VideoPlayerBase::nextFrameImpl"]
description.en = "Protected implementation hook: advance to the next frame. Called after VideoPlayerBase's public frame API accepts the frame rate."
description.ja = "protected 実装フック：次のフレームへ進む。VideoPlayerBase の公開フレーム API がフレームレートを確認した後に呼ばれる。"
description.ko = "protected 구현 훅: 다음 프레임으로 이동한다. VideoPlayerBase의 공개 프레임 API가 프레임 레이트를 확인한 뒤 호출한다."

["VideoPlayerBase::previousFrameImpl"]
description.en = "Protected implementation hook: step back to the previous frame. Called after VideoPlayerBase's public frame API accepts the frame rate."
description.ja = "protected 実装フック：前のフレームへ戻る。VideoPlayerBase の公開フレーム API がフレームレートを確認した後に呼ばれる。"
description.ko = "protected 구현 훅: 이전 프레임으로 돌아간다. VideoPlayerBase의 공개 프레임 API가 프레임 레이트를 확인한 뒤 호출한다."

["VideoPlayerBase::playImpl"]
description.en = "Platform hook: start playback. Pure virtual, implemented per backend."
description.ja = "プラットフォームフック：再生を開始する。純粋仮想、バックエンドごとに実装。"
description.ko = "플랫폼 훅: 재생을 시작한다. 순수 가상, 백엔드별 구현."

["VideoPlayerBase::stopImpl"]
description.en = "Platform hook: stop playback. Pure virtual, implemented per backend."
description.ja = "プラットフォームフック：再生を停止する。純粋仮想、バックエンドごとに実装。"
description.ko = "플랫폼 훅: 재생을 멈춘다. 순수 가상, 백엔드별 구현."

["VideoPlayerBase::setPausedImpl"]
description.en = "Platform hook: set paused state. Pure virtual, implemented per backend."
description.ja = "プラットフォームフック：一時停止状態を設定する。純粋仮想、バックエンドごとに実装。"
description.ko = "플랫폼 훅: 일시정지 상태를 설정한다. 순수 가상, 백엔드별 구현."

["VideoPlayerBase::setPositionImpl"]
description.en = "Platform hook: seek to a normalized position. Pure virtual, implemented per backend."
description.ja = "プラットフォームフック：正規化位置にシークする。純粋仮想、バックエンドごとに実装。"
description.ko = "플랫폼 훅: 정규화 위치로 탐색한다. 순수 가상, 백엔드별 구현."

["VideoPlayerBase::setVolumeImpl"]
description.en = "Platform hook: set volume. Pure virtual, implemented per backend."
description.ja = "プラットフォームフック：音量を設定する。純粋仮想、バックエンドごとに実装。"
description.ko = "플랫폼 훅: 볼륨을 설정한다. 순수 가상, 백엔드별 구현."

["VideoPlayerBase::setSpeedImpl"]
description.en = "Platform hook: set playback speed. Pure virtual, implemented per backend."
description.ja = "プラットフォームフック：再生速度を設定する。純粋仮想、バックエンドごとに実装。"
description.ko = "플랫폼 훅: 재생 속도를 설정한다. 순수 가상, 백엔드별 구현."

["VideoPlayerBase::setPanImpl"]
description.en = "Platform hook: set stereo pan. Pure virtual, implemented per backend."
description.ja = "プラットフォームフック：ステレオパンを設定する。純粋仮想、バックエンドごとに実装。"
description.ko = "플랫폼 훅: 스테레오 팬을 설정한다. 순수 가상, 백엔드별 구현."

["VideoPlayerBase::setLoopImpl"]
description.en = "Platform hook: set looping. Pure virtual, implemented per backend."
description.ja = "プラットフォームフック：ループを設定する。純粋仮想、バックエンドごとに実装。"
description.ko = "플랫폼 훅: 루프를 설정한다. 순수 가상, 백엔드별 구현."

["VideoPlayerBase::applyCachedStateToPlatform"]
description.en = "Subclass hook: after the backend has loaded, reapply the loop, volume and pan set before load(). Speed is applied by play()."
description.ja = "サブクラス用フック：バックエンドの読み込み後に、load() の前に設定したループ・音量・パンを適用し直す。速度は play() で適用する。"
description.ko = "서브클래스용 훅: 백엔드 로드 후, load() 전에 설정한 루프·볼륨·팬을 다시 적용한다. 속도는 play()에서 적용한다."

["VideoPlayerBase::markFrameNew"]
description.en = "Mark that a new frame has arrived (sets frameNew and firstFrameReceived)."
description.ja = "新フレーム到着をマークする（frameNew と firstFrameReceived を立てる）。"
description.ko = "새 프레임 도착을 표시한다(frameNew, firstFrameReceived 설정)."

["VideoPlayerBase::markDone"]
description.en = "Mark playback as done, clearing playing unless looping."
description.ja = "再生終了をマークする。ループ中でなければ playing を下げる。"
description.ko = "재생 종료를 표시한다. 루프 중이 아니면 playing을 해제한다."

