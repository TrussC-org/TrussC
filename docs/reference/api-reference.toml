["getDeltaTime"]
category = "time_frame"
keywords = ["dt", "elapsed", "frametime", "timestep", "interval"]
of = ["ofGetLastFrameTime"]
description.en = "Seconds since the previous update. Measured wall time in VSYNC / setFps modes; in fixed-Hz update mode (setIndependentFps with an update rate) and in runHeadlessApp every step reports exactly 1 / updateFps. Per window; a secondary window still measures its delta with high_resolution_clock (the system clock on Linux) until #307: a forward system clock step (NTP, a manual change) lands in one delta, so that window's due Node timers fire at once, and an uncapped callEveryCatchUp fires once per interval of the step; a backward step makes one delta negative: getDeltaTime() is negative on that tick and the window's Node timers are not counted down on it"
description.ja = "前回の update からの経過秒数。VSYNC / setFps モードでは実測時間。固定Hz update モード（update レートを指定した setIndependentFps）と runHeadlessApp では各ステップが正確に 1 / updateFps を返す。ウィンドウごと。サブウィンドウは #307 までは high_resolution_clock（Linux ではシステム時計）で測るので、システム時刻が先へ飛ぶ（NTP や手動変更）とその分が1回の delta に入り、そのウィンドウの期限が来た Node タイマーが一度に発火し、上限なしの callEveryCatchUp は飛んだ分のインターバルの回数だけ呼ばれる。時刻が戻ると delta が1回負になり、そのティックでは getDeltaTime() が負で、そのウィンドウの Node タイマーはカウントダウンされない"
description.ko = "이전 update로부터의 경과 시간(초). VSYNC / setFps 모드에서는 실측 시간. 고정 Hz update 모드(update 레이트를 지정한 setIndependentFps)와 runHeadlessApp에서는 각 스텝이 정확히 1 / updateFps를 반환. 윈도우별. 보조 윈도우는 #307까지는 high_resolution_clock(Linux에서는 시스템 시계)으로 재므로, 시스템 시각이 앞으로 뛰면(NTP, 수동 변경) 그만큼이 한 번의 delta에 들어가 그 윈도우의 만기된 Node 타이머가 한꺼번에 실행되고, 상한 없는 callEveryCatchUp은 뛴 시간의 인터벌 수만큼 호출된다. 시각이 뒤로 가면 delta가 한 번 음수가 되어, 그 틱에서는 getDeltaTime()이 음수이고 그 윈도우의 Node 타이머는 카운트다운되지 않는다"
related = ["getFrameRate", "setIndependentFps", "getFrameElapsedTime"]

