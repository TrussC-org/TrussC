["TcpServer"]
keywords = ["tcp listener", "server socket", "accept", "host", "network server"]
of = ["ofxTCPServer"]
description.en = "TCP server (accept clients, send/broadcast)"
description.ja = "TCPサーバ（クライアント受け入れ・送信/ブロードキャスト）"
description.ko = "TCP 서버 (클라이언트 수락, 전송/브로드캐스트)"
of_category = "network-types"
related = ["TcpClient", "TcpServerClient", "TcpServerReceiveEventArgs", "TcpClientConnectEventArgs"]
platform_note.en = "TCP server (socket/bind/listen/accept on a background accept thread). Real on the 5 native platforms. Effectively unavailable on wasm: a browser cannot listen()/accept() incoming connections, and the accept thread needs std::thread which the default web build lacks. Not documented in api-definition.yaml."
platform_note.ja = "TCP サーバ (socket/bind/listen/accept をバックグラウンド accept スレッドで)。ネイティブ5プラットフォームで実装。wasm では実質利用不可: ブラウザは着信を listen()/accept() できず、accept スレッドに必要な std::thread も web 既定ビルドに無い。api-definition.yaml には未記載。"

["TcpServer::broadcast"]
description.en = "Broadcast data to all clients and wait for every one of them (blocking)"
description.ja = "全クライアントへブロードキャストし、全員分の完了を待つ（ブロッキング）"
description.ko = "모든 클라이언트로 브로드캐스트하고 전원의 완료를 대기 (블로킹)"
details = "Queues the payload for every client first and then waits, so a slow peer no longer delays the clients behind it — but the call still returns only once all of them have it. Use broadcastAsync() to return immediately instead, and setSendTimeout() to bound the wait on unreliable peers."

["TcpServer::broadcastAsync"]
description.en = "Queue data for every client and return at once; returns how many accepted it"
description.ja = "全クライアントへキュー投入して即座に返る。受け付けたクライアント数を返す"
description.ko = "모든 클라이언트에 큐로 넣고 즉시 반환. 받아들인 클라이언트 수를 반환"
keywords = ["broadcast", "async", "non-blocking", "queue"]
related = ["TcpServer::sendAsync", "TcpServer::broadcast", "TcpServer::onSendComplete"]
details = "The payload is buffered once and shared by every client's queue, not copied per peer, so broadcasting a frame to twenty clients costs one copy. Clients whose queue is already at its high-water mark are skipped, which is why the return value can be less than getClientCount(). Each client that did accept it reports through onSendComplete."

["TcpServer::disconnectAllClients"]
description.en = "Disconnect all clients"
description.ja = "全クライアントを切断"
description.ko = "모든 클라이언트를 연결 해제"
details.en = "Waits for the clients' threads like disconnectClient(), except in an inline listener on one of the server's own threads, where it disconnects them and returns without waiting. A client that connects while it runs may stay connected."
details.ja = "disconnectClient() と同じくクライアントのスレッドの終了を待つ。ただしサーバ自身のスレッド上のインラインリスナーでは、切断だけして待たずに戻る。実行中に接続してきたクライアントは接続されたまま残ることがある。"
details.ko = "disconnectClient()와 마찬가지로 클라이언트 스레드의 종료를 기다린다. 단, 서버 자신의 스레드에서 실행되는 인라인 리스너에서는 연결만 해제하고 기다리지 않고 반환한다. 실행 중에 접속한 클라이언트는 연결된 채로 남을 수 있다."

["TcpServer::disconnectClient"]
description.en = "Disconnect a specific client"
description.ja = "指定クライアントを切断"
description.ko = "특정 클라이언트를 연결 해제"
details.en = "Returns once that client's receive and writer threads have ended; the writer first completes whatever is still queued. It may be called from any listener, for its own client or any other: in an inline listener on one of the server's own threads (accept, receive or writer) it disconnects the client and returns without waiting, since such a thread may be waiting for the caller in turn. Those threads are joined later, by the server once they have ended, by the next stop() or start() on another thread, or by the destructor."
details.ja = "そのクライアントの受信スレッドと送信スレッドが終わってから戻る。送信スレッドはキューに残っている分を先に完了させる。どのリスナーからでも、自分のクライアントにも他のクライアントにも呼べる。サーバ自身のスレッド（accept、受信、送信）上のインラインリスナーでは、クライアントを切断して待たずに戻る。そのスレッドが逆に呼び出し元を待っていることがあるからだ。それらのスレッドは後で join される。終わった時点でサーバが、あるいは別のスレッドでの次の stop() か start()、またはデストラクタが join する。"
details.ko = "그 클라이언트의 수신 스레드와 송신 스레드가 끝난 뒤에 반환한다. 송신 스레드는 큐에 남은 것을 먼저 완료한다. 어떤 리스너에서든, 자기 클라이언트든 다른 클라이언트든 호출할 수 있다. 서버 자신의 스레드(accept, 수신, 송신)에서 실행되는 인라인 리스너에서는 클라이언트 연결을 해제하고 기다리지 않고 반환한다. 그 스레드가 반대로 호출한 쪽을 기다리고 있을 수 있기 때문이다. 그 스레드들은 나중에 join된다. 끝난 시점에 서버가, 또는 다른 스레드에서의 다음 stop()이나 start(), 혹은 소멸자가 join한다."

