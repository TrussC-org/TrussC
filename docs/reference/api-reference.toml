["Mesh::uploadToGpu"]
category = "types_mesh"
keywords = ["sync", "gpu", "buffer", "interop"]
description.en = "Upload the mesh's vertex/index data to its GPU buffers now (for the PBR / custom-render path)."
description.ja = "メッシュの頂点・インデックスデータを今すぐ GPU バッファにアップロード（PBR / 自前描画パス向け）。"
description.ko = "메시의 정점·인덱스 데이터를 지금 GPU 버퍼에 업로드한다(PBR / 커스텀 렌더링 경로용)."
related = ["Mesh::markGpuDirty", "Mesh::drawGpuPbr", "Mesh::getGpuVertexBuffer"]
details.en = '''
Lazy: it only re-uploads when the data changed since the last upload (see
[`getDataRevision()`](#Mesh::getDataRevision)), so calling it every frame is
cheap. [`drawGpuPbr()`](#Mesh::drawGpuPbr) calls it for you, so you only need it
when accessing [`getGpuVertexBuffer`](#Mesh::getGpuVertexBuffer) directly for
custom GPU work. Every mutator and every non-const getter (e.g.
[`getVertices()`](#Mesh::getVertices)) marks the data changed, including a
`clear()` followed by re-adding the same number of vertices.
'''
details.ja = '''
遅延実行で、前回のアップロード以降にデータが変わったときだけ再アップロードする
（[`getDataRevision()`](#Mesh::getDataRevision) 参照）ので毎フレーム呼んでも
安価。[`drawGpuPbr()`](#Mesh::drawGpuPbr) が内部で呼ぶため、明示的に必要なのは
[`getGpuVertexBuffer`](#Mesh::getGpuVertexBuffer) を直接触って自前 GPU 処理を
するときだけ。すべての変更関数と非 const ゲッター（[`getVertices()`](#Mesh::getVertices)
など）がデータを変更済みにする。`clear()` して同じ数の頂点を追加し直した場合も同様。
'''
details.ko = '''
지연 실행이라 마지막 업로드 이후 데이터가 바뀌었을 때만 다시 업로드하므로
([`getDataRevision()`](#Mesh::getDataRevision) 참고) 매 프레임 호출해도
저렴하다. [`drawGpuPbr()`](#Mesh::drawGpuPbr)이 내부에서 호출하므로, 명시적으로
필요한 경우는 [`getGpuVertexBuffer`](#Mesh::getGpuVertexBuffer)를 직접 다뤄
커스텀 GPU 작업을 할 때뿐이다. 모든 변경 함수와 non-const getter
([`getVertices()`](#Mesh::getVertices) 등)가 데이터를 변경됨으로 표시한다.
`clear()` 후 같은 수의 정점을 다시 추가한 경우도 마찬가지다.
'''

["Mesh::uploadPointsToGpu"]
category = "types_mesh"
keywords = ["sync", "gpu", "buffer", "interop", "point cloud", "points"]
description.en = "Upload the point cloud (positions + colors) to its GPU buffer now (for the Points / custom-render path)."
description.ja = "点群（位置＋色）を今すぐ GPU バッファにアップロード（Points / 自前描画パス向け）。"
description.ko = "포인트 클라우드(위치 + 색상)를 지금 GPU 버퍼에 업로드한다(Points / 커스텀 렌더링 경로용)."
related = ["Mesh::markGpuDirty", "Mesh::drawGpuPoints", "Mesh::getGpuPointBuffer"]
details.en = '''
The point-cloud counterpart of [`uploadToGpu`](#Mesh::uploadToGpu): it packs the
mesh's positions and per-vertex colors into a separate GPU buffer used by the
[`PrimitiveMode`](#PrimitiveMode)`::Points` path. Lazy — only re-uploads when
the data changed since the last upload (see
[`getDataRevision()`](#Mesh::getDataRevision)).
[`drawGpuPoints()`](#Mesh::drawGpuPoints) calls it for you; call it
directly only when reading [`getGpuPointBuffer`](#Mesh::getGpuPointBuffer) for a
custom shader/compute pass. Every mutator and non-const getter marks the data
changed.
'''
details.ja = '''
[`uploadToGpu`](#Mesh::uploadToGpu) の点群版。メッシュの位置と頂点ごとの色を、
[`PrimitiveMode`](#PrimitiveMode)`::Points` パスが使う専用 GPU バッファに詰める。
遅延実行で、前回のアップロード以降にデータが変わったときだけ再アップロード
（[`getDataRevision()`](#Mesh::getDataRevision) 参照）。[`drawGpuPoints()`](#Mesh::drawGpuPoints)
が内部で呼ぶため、直接必要なのは [`getGpuPointBuffer`](#Mesh::getGpuPointBuffer)
を自前のシェーダ／コンピュートパスで読むときだけ。すべての変更関数と非 const
ゲッターがデータを変更済みにする。
'''
details.ko = '''
[`uploadToGpu`](#Mesh::uploadToGpu)의 포인트 클라우드 버전이다. 메시의 위치와
정점별 색상을 [`PrimitiveMode`](#PrimitiveMode)`::Points` 경로가 사용하는 전용
GPU 버퍼에 채운다. 지연 실행이라 마지막 업로드 이후 데이터가 바뀌었을 때만
다시 업로드한다([`getDataRevision()`](#Mesh::getDataRevision) 참고).
[`drawGpuPoints()`](#Mesh::drawGpuPoints)가 내부에서 호출하므로, 직접 필요한
경우는 [`getGpuPointBuffer`](#Mesh::getGpuPointBuffer)를 커스텀 셰이더/컴퓨트
패스에서 읽을 때뿐이다. 모든 변경 함수와 non-const getter가 데이터를 변경됨으로
표시한다.
'''

["MicInput"]
keywords = ["microphone", "audio input", "capture", "recording input"]
description.en = "Microphone capture (miniaudio). Opens an input device and exposes the latest samples through a ring buffer. Use the global getMicInput() to access the shared instance, then start() it; getMicAnalysisBuffer() is a convenience wrapper over getBuffer()."
description.ja = "マイク入力 (miniaudio)。入力デバイスを開き、最新サンプルをリングバッファ経由で公開する。共有インスタンスはグローバルの getMicInput() で取得し、start() する。getMicAnalysisBuffer() は getBuffer() の簡易ラッパー"
description.ko = "마이크 입력 (miniaudio). 입력 디바이스를 열고 최신 샘플을 링 버퍼를 통해 노출한다. 공유 인스턴스는 전역 getMicInput() 으로 접근한 뒤 start() 한다. getMicAnalysisBuffer() 는 getBuffer() 의 편의 래퍼"
related = ["getMicInput", "AudioEngine", "getMicAnalysisBuffer"]

["MicInput::getBuffer"]
description.en = "Copy the latest captured samples into outBuffer. numSamples is capped at the ring buffer size (4096). Returns the number of samples written."
description.ja = "最新のキャプチャサンプルを outBuffer にコピー。numSamples はリングバッファサイズ (4096) に制限される。書き込んだサンプル数を返す"
description.ko = "최신 캡처 샘플을 outBuffer 에 복사. numSamples 는 링 버퍼 크기 (4096) 로 제한됨. 기록한 샘플 수를 반환"

["MicInput::getDeviceName"]
description.en = "Name of the capture device start() opened; empty while stopped, and on Web (the browser does not expose it)."
description.ja = "start() が開いた入力デバイスの名前。停止中と Web (ブラウザが公開しない) では空"
description.ko = "start() 가 연 입력 디바이스 이름. 정지 중과 Web (브라우저가 공개하지 않음) 에서는 비어 있음"

["MicInput::getSampleRate"]
description.en = "Sample rate the microphone was opened at."
description.ja = "マイクを開いたときのサンプルレート"
description.ko = "마이크를 연 샘플레이트"

["MicInput::isRunning"]
description.en = "True while the microphone device is open and capturing."
description.ja = "マイクデバイスが開いてキャプチャ中の間 true"
description.ko = "마이크 디바이스가 열려 캡처 중일 때 true"

["MicInput::start"]
description.en = "Open the microphone device at the given sample rate and begin capturing. Returns false on failure."
description.ja = "指定サンプルレートでマイクデバイスを開き、キャプチャを開始。失敗時 false を返す"
description.ko = "지정한 샘플레이트로 마이크 디바이스를 열고 캡처를 시작. 실패 시 false 반환"

["MicInput::stop"]
description.en = "Stop capture and close the microphone device."
description.ja = "キャプチャを停止してマイクデバイスを閉じる"
description.ko = "캡처를 정지하고 마이크 디바이스를 닫음"

["MixMode"]
description.en = "Sound channel mixing: Auto (match the output) or DownmixMono."
description.ja = "サウンドのチャンネルミックス：Auto（出力に合わせる）または DownmixMono。"
description.ko = "사운드 채널 믹싱: Auto(출력에 맞춤) 또는 DownmixMono."
keywords = ["channel", "downmix", "mono"]
related = ["Sound::setMixMode", "Sound"]

["Mod"]
keywords = ["component", "behavior", "addmod"]
description.en = "Attachable behavior base class for Node. Subclass it, override the lifecycle and input hooks, and attach with node->addMod<T>(). Lifecycle: setup() on attach, then each frame earlyUpdate() -> Node::update() -> update() -> draw(), and onDestroy() on removal. Override isExclusive() to allow only one instance per Node, and canAttachTo() to restrict attachment."
description.ja = "Node にアタッチできる振る舞いの基底クラス。サブクラス化してライフサイクルと入力フックをオーバーライドし、node->addMod<T>() でアタッチする。ライフサイクル: アタッチ時に setup()、以降毎フレーム earlyUpdate() -> Node::update() -> update() -> draw()、削除時に onDestroy()。isExclusive() をオーバーライドすると Node ごとに1インスタンスのみ許可、canAttachTo() でアタッチ先を制限できる"
description.ko = "Node에 부착 가능한 동작 기반 클래스. 서브클래싱하여 라이프사이클과 입력 훅을 오버라이드하고 node->addMod<T>()로 부착. 라이프사이클: 부착 시 setup(), 이후 매 프레임 earlyUpdate() -> Node::update() -> update() -> draw(), 제거 시 onDestroy(). isExclusive()를 오버라이드하면 Node당 한 인스턴스만 허용, canAttachTo()로 부착 대상을 제한"
related = ["Node", "LayoutMod", "TweenMod", "Node::addChild"]

["Mod::canAttachTo"]
description.en = "Override to restrict which Node types this Mod can attach to. Return false to reject attachment. Default true. (protected, virtual)"
description.ja = "オーバーライド: この Mod がアタッチできる Node 型を制限する。アタッチを拒否するには false を返す。デフォルトは true。（protected, virtual）"
description.ko = "오버라이드: 이 Mod가 부착 가능한 Node 타입을 제한. 부착을 거부하려면 false 반환. 기본값 true. (protected, virtual)"

["Mod::draw"]
description.en = "Override: called during the draw phase, after Node::draw(). (protected, virtual)"
description.ja = "オーバーライド: 描画フェーズ中、Node::draw() の後に呼ばれる。（protected, virtual）"
description.ko = "오버라이드: 그리기 단계 중 Node::draw() 후에 호출됨. (protected, virtual)"

["Mod::earlyUpdate"]
description.en = "Override: called every frame BEFORE Node::update(). Use for applying transforms, tweens, physics. (protected, virtual)"
description.ja = "オーバーライド: 毎フレーム Node::update() の前に呼ばれる。トランスフォーム・トゥイーン・物理の適用に使う。（protected, virtual）"
description.ko = "오버라이드: 매 프레임 Node::update() 전에 호출됨. 트랜스폼, 트윈, 물리 적용에 사용. (protected, virtual)"

["Mod::getOwner"]
description.en = "Get the owner Node this Mod is attached to."
description.ja = "この Mod がアタッチされている所有 Node を取得"
description.ko = "이 Mod가 부착된 소유 Node를 얻음"

["Mod::hitTest"]
description.en = "Override: screen-space pointer picking (NOT physics collision). Define a hit shape in the node's LOCAL space; if the node's own test OR any mod's returns true, the node is the hit. (protected, virtual)"
description.ja = "オーバーライド: スクリーン空間のポインタピッキング（物理衝突ではない）。ノードのローカル空間でヒット形状を定義する。ノード自身のテストかいずれかの mod が true を返せば、そのノードがヒット扱いになる。（protected, virtual）"
description.ko = "오버라이드: 화면 공간 포인터 피킹(물리 충돌이 아님). 노드의 로컬 공간에서 히트 형상을 정의. 노드 자신의 테스트나 어느 mod라도 true를 반환하면 해당 노드가 히트됨. (protected, virtual)"

["Mod::isExclusive"]
description.en = "Override to return true if only one instance of this Mod type may be attached per Node (e.g. LayoutMod). Default false. (protected, virtual)"
description.ja = "オーバーライド: この Mod 型を Node ごとに1インスタンスのみアタッチ可能とする場合は true を返す（例: LayoutMod）。デフォルトは false。（protected, virtual）"
description.ko = "오버라이드: 이 Mod 타입을 Node당 한 인스턴스만 부착 가능하게 하려면 true 반환(예: LayoutMod). 기본값 false. (protected, virtual)"

["Mod::onDestroy"]
description.en = "Override: called when the Mod is removed or the Node is destroyed. (protected, virtual)"
description.ja = "オーバーライド: Mod が削除されたか Node が破棄されたときに呼ばれる。（protected, virtual）"
description.ko = "오버라이드: Mod가 제거되거나 Node가 파괴될 때 호출됨. (protected, virtual)"

["Mod::onKeyPress"]
description.en = "Override: key press (broadcast to mods on every node). Return true to consume. (protected, virtual)"
description.ja = "オーバーライド: キー押下（すべてのノードの mod にブロードキャストされる）。消費するには true を返す。（protected, virtual）"
description.ko = "오버라이드: 키 누름(모든 노드의 mod에 브로드캐스트됨). 소비하려면 true 반환. (protected, virtual)"

["Mod::onKeyRelease"]
description.en = "Override: key release (broadcast to mods on every node). Return true to consume. (protected, virtual)"
description.ja = "オーバーライド: キー解放（すべてのノードの mod にブロードキャストされる）。消費するには true を返す。（protected, virtual）"
description.ko = "오버라이드: 키 놓음(모든 노드의 mod에 브로드캐스트됨). 소비하려면 true 반환. (protected, virtual)"

["Mod::onMouseDrag"]
