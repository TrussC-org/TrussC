related = ["SerialDeviceInfo", "SerialDisconnectEventArgs", "TcpClient"]
platform_note.en = "Real backends only on Windows (Win32 COM), macOS/Linux (POSIX termios), and Android (USB Host CDC-ACM via JNI+usbfs, CDC-ACM class devices only, first connect needs an async USB permission dialog). No serial on iOS (sandbox has no /dev/tty access — the macOS __APPLE__ enumeration branch compiles but never lists/opens a device) or wasm (Emscripten has no serial device; setup() falls into the POSIX open()/termios path against the virtual FS and fails)."
platform_note.ja = "実バックエンドは Windows (Win32 COM)、macOS/Linux (POSIX termios)、Android (USB Host CDC-ACM、JNI+usbfs、CDC-ACMクラス機器のみ、初回接続は非同期のUSB許可ダイアログが必要) のみ。iOS はサンドボックスで /dev/tty にアクセスできず実質不可 (__APPLE__ の列挙分岐はコンパイルされるが機器を列挙/オープンできない)、wasm はシリアルデバイスが存在せず setup() が POSIX open()/termios 経路に落ちて失敗。"

details.en = "Each open port has a receive worker and a 1 MiB buffer on desktop and Android. When the buffer fills, the oldest bytes are discarded and getDroppedByteCount() counts them. Overflow warnings use a 5 s OnceGate and include the running total. On desktop, overflow and driver warnings are delivered by the next read/write I/O call; device loss is also deferred to app I/O. Windows uses overlapped reads and writes."
details.ja = "デスクトップと Android では、開いたポートごとに受信ワーカーと 1 MiB のバッファを持つ。容量を超えると古いバイトから破棄し、getDroppedByteCount() で数える。オーバーフロー警告は 5 秒間隔の OnceGate で制限し、累計を含める。デスクトップでは、オーバーフローとドライバの警告は次の読み書き時に出し、切断の通知もアプリの I/O 呼び出しまで遅延する。Windows の読み書きはオーバーラップ I/O を使う。"
details.ko = "데스크톱과 Android에서는 열린 포트마다 수신 워커와 1 MiB 버퍼를 둔다. 용량을 넘으면 가장 오래된 바이트부터 버리고 getDroppedByteCount()로 센다. 오버플로 경고는 5초 간격 OnceGate로 제한하며 누적 수를 포함한다. 데스크톱에서는 오버플로 및 드라이버 경고를 다음 읽기/쓰기 I/O 호출에서 전달하고, 장치 소실도 앱 I/O까지 지연한다. Windows 읽기와 쓰기는 오버랩 I/O를 사용한다."

