["Event::notify"]
description.en = "Fire the event, calling all listeners in priority order (no argument for Event<void>); stops early if a listener marks an input arg consumed. A listener removed during the pass on this thread is not called; one added during the pass starts from the next notify()"
description.ja = "イベントを発火し、全リスナーを priority 順に呼び出す(Event<void> は引数なし)。リスナーが入力 arg を consumed にすると早期終了。同じスレッドでパス中に外されたリスナーは呼ばれない。パス中に追加されたリスナーは次の notify() から呼ばれる"
description.ko = "이벤트를 발생시켜 모든 리스너를 priority 순으로 호출(Event<void>는 인자 없음). 리스너가 입력 arg를 consumed로 표시하면 조기 종료. 같은 스레드에서 패스 도중 제거된 리스너는 호출되지 않는다. 패스 도중 추가된 리스너는 다음 notify() 부터 호출된다"

["Event<T>"]
keywords = ["signal", "callback", "listener"]
description.en = "Generic event you subscribe to with listen(callback) and fire with notify(arg). The template parameter is the argument type passed to listeners by reference; Event<void> is the no-argument specialization (callbacks and notify take no argument). listen() returns an EventListener RAII token that disconnects when destroyed"
description.ja = "listen(callback) で購読し notify(arg) で発火する汎用イベント。テンプレートパラメータはリスナーに参照で渡される引数の型。Event<void> は引数なしの特殊化(callback も notify も引数なし)。listen() は破棄時に切断する EventListener RAII トークンを返す"
description.ko = "listen(callback)으로 구독하고 notify(arg)로 발생시키는 범용 이벤트. 템플릿 파라미터는 리스너에 참조로 전달되는 인자 타입. Event<void>는 인자 없는 특수화(callback과 notify 모두 인자 없음). listen()은 파괴 시 연결을 끊는 EventListener RAII 토큰을 반환"
related = ["AudioEngine::audioDeviceChanged", "EventListener", "CoreEvents", "Deliver"]

["EventListener"]
keywords = ["subscription", "raii", "token", "disconnect", "handle"]
description.en = "RAII token returned by Event::listen(); the listener is automatically disconnected when this token is destroyed or reassigned. Move-only"
description.ja = "Event::listen() が返す RAII トークン。このトークンが破棄または再代入されるとリスナーは自動的に切断される。ムーブのみ可"
description.ko = "Event::listen()이 반환하는 RAII 토큰. 이 토큰이 파괴되거나 재할당되면 리스너는 자동으로 연결이 끊김. 이동 전용"
related = ["Event<T>", "CoreEvents"]

["EventListener::disconnect"]
description.en = "Explicitly disconnect the listener now (otherwise happens automatically on destruction). On the thread that fires the event it is not called again, even later in a notify() pass already running. It does not wait for a callback running on another thread: for audio, follow it with AudioEngine::waitForAudioCallbacks()"
description.ja = "リスナーを今すぐ明示的に切断(そうしなければ破棄時に自動で行われる)。イベントを発火するスレッド上では、実行中の notify() パスの後半も含めて二度と呼ばれない。別スレッドで実行中のコールバックは待たない。オーディオなら続けて AudioEngine::waitForAudioCallbacks() を呼ぶ"
description.ko = "리스너를 지금 명시적으로 연결 해제(그렇지 않으면 파괴 시 자동으로 수행됨). 이벤트를 발생시키는 스레드에서는 이미 진행 중인 notify() 패스의 뒷부분을 포함해 다시 호출되지 않는다. 다른 스레드에서 실행 중인 콜백은 기다리지 않는다. 오디오라면 이어서 AudioEngine::waitForAudioCallbacks() 을 호출한다"

